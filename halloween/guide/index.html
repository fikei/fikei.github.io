<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Agape XV · Guide</title>
  <meta name="description" content="Every room at Agape Halloween XV: Reassemblage — what's on, who made it, and where to find it.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
  <link rel="stylesheet" href="guide.css?v=1.0.0">
</head>
<body data-auth="loading">

  <!-- Discord gate -->
  <section class="gate" id="gate" aria-live="polite">
    <div class="gate__card">
      <div class="gate__kicker">Agape Halloween XV</div>
      <h1 class="gate__title">Reassemblage</h1>
      <p class="gate__sub" id="gate-sub">Loading…</p>
      <button class="btn btn--filled btn--block gate__btn" id="gate-btn" type="button" hidden></button>
      <a class="btn btn--block gate__btn" id="gate-join" href="https://discord.gg/qunsekyQS" target="_blank" rel="noopener" hidden>Join the Agape Discord</a>
      <button class="btn btn--ghost btn--block" id="gate-recheck" type="button" hidden>I've joined — check again</button>
      <p class="gate__hint" id="gate-hint">The guide lives on the Agape Discord. Sign in with Discord to see every room.</p>
    </div>
  </section>

  <!-- App -->
  <div class="app" id="app" hidden>
    <header class="top">
      <div class="top__brand">
        <span class="top__title">Agape XV</span>
        <span class="top__mode" id="mode"></span>
      </div>
      <button class="top__icon" id="btn-theme" type="button" aria-label="Toggle light/dark">◐</button>
    </header>

    <nav class="stories" id="stories" aria-label="Rooms"></nav>

    <main class="view" id="view"></main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tabbar__btn" data-tab="map" type="button" aria-label="Map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Map</span>
      </button>
      <button class="tabbar__btn" data-tab="list" type="button" aria-label="List">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>List</span>
      </button>
      <button class="tabbar__btn" data-tab="me" type="button" aria-label="You">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>You</span>
      </button>
    </nav>

    <!-- Room / piece sheet -->
    <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet__bar">
        <button class="sheet__nav" id="sheet-prev" type="button" aria-label="Previous room">‹</button>
        <div class="sheet__head">
          <div class="sheet__kicker" id="sheet-kicker"></div>
          <h2 class="sheet__title" id="sheet-title"></h2>
        </div>
        <button class="sheet__nav" id="sheet-next" type="button" aria-label="Next room">›</button>
        <button class="sheet__close" id="sheet-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="sheet__body" id="sheet-body"></div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="guide.js?v=1.0.0"></script>
</body>
</html>
