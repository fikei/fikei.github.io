project_id = "yfhudwakpgzswiylhfbh"

# pull-recommendations is invoked by pg_cron and by the user-sources
# wrapper using a shared X-Cron-Secret header (function-level auth).
# Disable platform JWT verification so cron can hit it.
[functions.pull-recommendations]
verify_jwt = false

# ats-radar-ingest is called by the local job-radar push script using
# X-Cron-Secret or a service-key bearer (checked in-function). The gateway
# only passes legacy JWTs, so platform verification must be off for the
# new-format sb_secret key to reach the function's own auth check.
[functions.ats-radar-ingest]
verify_jwt = false

# recruit-discord is Discord's interactions endpoint — authenticated by
# Ed25519 request signatures, not JWTs.
[functions.recruit-discord]
verify_jwt = false

# recruit-watch serves recordings by capability link (the share_token is the
# credential) — no user JWT involved.
[functions.recruit-watch]
verify_jwt = false

# mail-watch is invoked by pg_cron (migration 180) with a one-time nonce,
# and manually with X-Cron-Secret. Both are checked in-function; no user JWT
# is ever involved, so the gateway's verification only gets in the way.
[functions.mail-watch]
verify_jwt = false
