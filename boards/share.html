<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Shared Board</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/icons/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/icons/favicons/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="/images/icons/favicons/favicon.ico">
  <link rel="manifest" href="/images/icons/favicons/site.webmanifest">

  <!-- Space Grotesk Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
/* ============================================
   Shared Board View - Matching Main Board Style
   ============================================ */

:root {
  /* Typography - Space Grotesk */
  --font-primary: "Space Grotesk", sans-serif;
  --font-serif: "Space Grotesk", sans-serif;
  --font-mono: "Space Grotesk", sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;
  --line-height-tight: 1.2;
  --line-height-normal: 1.6;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* Grid */
  --grid-gap: 16px;

  /* Dark mode (default) */
  --bg: #111;
  --fg: #fff;
  --surface: #1a1a1a;
  --border: #fff;
  --muted: #888;
  --subtle: #333;
}

:root.light {
  --bg: #fff;
  --fg: #000;
  --surface: #fff;
  --border: #000;
  --muted: #888;
  --subtle: #e0e0e0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-primary);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
}

/* ============================================
   Header (Share-specific)
   ============================================ */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-3) var(--space-4);
  background: var(--bg);
  border-bottom: 1px solid var(--fg);
  z-index: 100;
}

.header__info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.header__title {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.header__meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
}

.header__actions {
  display: flex;
  gap: var(--space-2);
}

.header__btn {
  padding: var(--space-2) var(--space-3);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--fg);
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, color 0.15s;
}

.header__btn:hover {
  background: var(--fg);
  color: var(--bg);
}

/* ============================================
   Filters
   ============================================ */
.filters {
  position: fixed;
  top: 48px;
  left: 0;
  right: 0;
  display: flex;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  background: var(--bg);
  overflow-x: auto;
  z-index: 99;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.filters::-webkit-scrollbar { display: none; }

.filter-token {
  padding: var(--space-1) var(--space-3);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--fg);
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}

.filter-token:hover,
.filter-token--active {
  background: var(--fg);
  color: var(--bg);
}

/* ============================================
   Grid
   ============================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--grid-gap);
  padding: var(--space-4);
  padding-top: 96px;
}

.grid--no-filters {
  padding-top: 64px;
}

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}

/* ============================================
   Grid Item
   ============================================ */
.grid-item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  background: var(--subtle);
  border: 1px solid var(--fg);
  transition: transform 0.1s, opacity 0.1s;
}

.grid-item__image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(1.1);
  transition: filter 0.2s;
}

.grid-item:hover .grid-item__image {
  filter: grayscale(0%);
}

.grid-item__overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: var(--space-3);
  background: var(--bg);
  border-top: 1px solid var(--fg);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__overlay {
  opacity: 1;
}

@media (hover: none) {
  .grid-item__overlay {
    opacity: 1;
    padding: var(--space-2);
  }
}

.grid-item__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-sm);
  font-weight: normal;
  line-height: var(--line-height-tight);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-item__domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  margin-top: 2px;
  text-decoration: underline;
}

.grid-item__category {
  position: absolute;
  top: 0;
  left: 0;
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 2px 6px;
  background: var(--bg);
  border-right: 1px solid var(--fg);
  border-bottom: 1px solid var(--fg);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__category {
  opacity: 1;
}

/* Placeholder (no image) */
.grid-item--placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--placeholder .grid-item__initial {
  font-family: var(--font-serif);
  font-size: var(--font-size-2xl);
  color: var(--bg);
}

/* ============================================
   Expanded States
   ============================================ */
.grid-item--expanded-medium,
.grid-item--expanded-large {
  aspect-ratio: auto;
  padding: var(--space-4);
  background: var(--bg);
  position: relative;
}

.grid-item--expanded-medium .grid-item__overlay,
.grid-item--expanded-large .grid-item__overlay {
  display: none;
}

.grid-item--expanded-medium .grid-item__category,
.grid-item--expanded-large .grid-item__category {
  opacity: 1;
}

.grid-item--expanded-medium .grid-item__image,
.grid-item--expanded-large .grid-item__image {
  filter: grayscale(0%);
}

.grid-item--expanded-medium .grid-item__details,
.grid-item--expanded-large .grid-item__details {
  display: flex;
}

/* Medium State: 2x2 */
.grid-item--expanded-medium {
  grid-column: span 2;
  grid-row: span 2;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr auto;
  gap: var(--space-3);
}

.grid-item--expanded-medium .grid-item__image {
  grid-row: 1 / 2;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid-item--expanded-medium .grid-item__initial-wrap {
  grid-row: 1 / 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--expanded-medium .grid-item__details {
  grid-row: 1 / 2;
  flex-direction: column;
  gap: var(--space-2);
}

.grid-item--expanded-medium .grid-item__actions {
  grid-column: 1 / -1;
  grid-row: 2;
}

/* Large State: 3x2 */
.grid-item--expanded-large {
  grid-column: span 3;
  grid-row: span 2;
  display: grid;
  grid-template-columns: 1fr 2fr;
  grid-template-rows: 1fr auto;
  gap: var(--space-4);
}

.grid-item--expanded-large .grid-item__image {
  grid-row: 1 / 3;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid-item--expanded-large .grid-item__initial-wrap {
  grid-row: 1 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--expanded-large .grid-item__details {
  grid-row: 1 / 2;
  flex-direction: column;
  gap: var(--space-3);
}

.grid-item--expanded-large .grid-item__actions {
  grid-row: 2;
}

/* Details */
.grid-item__details {
  display: none;
  flex-direction: column;
  gap: var(--space-3);
}

.grid-item__details-title {
  font-family: var(--font-serif);
  font-size: var(--font-size-lg);
  font-weight: normal;
  line-height: var(--line-height-tight);
}

.grid-item__details-domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  text-decoration: underline;
}

.grid-item__details-description {
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  color: var(--muted);
  line-height: var(--line-height-normal);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-item__details-meta {
  display: flex;
  gap: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
}

/* Actions */
.grid-item__actions {
  display: flex;
  gap: var(--space-2);
  padding-top: var(--space-3);
  border-top: 1px solid var(--subtle);
}

.grid-item__action {
  padding: var(--space-2) var(--space-3);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--fg);
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, color 0.15s;
}

.grid-item__action:hover {
  background: var(--fg);
  color: var(--bg);
}

.grid-item__action--saved {
  background: var(--fg);
  color: var(--bg);
}

.grid-item__action:disabled {
  opacity: 0.7;
  cursor: default;
}

/* Resize Handle */
.grid-item__resize {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 24px;
  height: 24px;
  cursor: nwse-resize;
  display: none;
  align-items: flex-end;
  justify-content: flex-end;
  padding: 4px;
}

.grid-item--expanded-medium .grid-item__resize,
.grid-item--expanded-large .grid-item__resize {
  display: flex;
}

.grid-item__resize::before {
  content: '';
  width: 12px;
  height: 12px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
}

.grid-item__resize:hover::before {
  border-color: var(--fg);
}

/* ============================================
   Loading & Error States
   ============================================ */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  padding-top: 96px;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.error {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  padding-top: 96px;
  text-align: center;
  padding: var(--space-4);
}

.error__title {
  font-family: var(--font-mono);
  font-size: var(--font-size-base);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: var(--space-2);
}

.error__message {
  font-family: var(--font-serif);
  font-size: var(--font-size-sm);
  color: var(--muted);
}

/* ============================================
   Toast
   ============================================ */
.toast-container {
  position: fixed;
  bottom: var(--space-4);
  left: var(--space-4);
  z-index: 200;
}

.toast {
  padding: var(--space-2) var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: var(--fg);
  color: var(--bg);
  margin-top: var(--space-2);
  animation: slideIn 0.2s ease-out;
}

@keyframes slideIn {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* ============================================
   Theme Toggle
   ============================================ */
.theme-toggle {
  position: fixed;
  bottom: var(--space-4);
  right: var(--space-4);
  width: 32px;
  height: 18px;
  background: var(--subtle);
  border: 1px solid var(--fg);
  border-radius: 9px;
  cursor: pointer;
  z-index: 100;
}

.theme-toggle__knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  background: var(--fg);
  border-radius: 50%;
  transition: transform 0.2s;
}

:root.light .theme-toggle__knob {
  transform: translateX(14px);
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="header">
    <div class="header__info">
      <h1 class="header__title" id="boardTitle">Loading...</h1>
      <p class="header__meta" id="boardMeta"></p>
    </div>
    <div class="header__actions">
      <a href="/boards/" class="header__btn">Create Your Own</a>
    </div>
  </header>

  <nav class="filters" id="filters" style="display:none;"></nav>

  <div class="loading" id="loading">Loading...</div>
  <div class="error" id="error" style="display:none;">
    <h2 class="error__title">Board Not Found</h2>
    <p class="error__message">This board may have been removed or the link is incorrect.</p>
  </div>

  <main class="grid" id="grid" style="display:none;"></main>

  <button class="theme-toggle" id="themeToggle"><div class="theme-toggle__knob"></div></button>

  <div class="toast-container" id="toastContainer"></div>

<script>
(function() {
  'use strict';

  // ============================================
  // Config
  // ============================================
  const SUPABASE_URL = 'https://yfhudwakpgzswiylhfbh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmaHVkd2FrcGd6c3dpeWxoZmJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MTE3ODYsImV4cCI6MjA4NTM4Nzc4Nn0.bemC-CPA2vkoM5P4P-tmsPQ1RPr4ifPa5iginUXPKLI';

  // ============================================
  // DOM
  // ============================================
  const $ = id => document.getElementById(id);
  const boardTitle = $('boardTitle');
  const boardMeta = $('boardMeta');
  const filters = $('filters');
  const loading = $('loading');
  const error = $('error');
  const grid = $('grid');
  const toastContainer = $('toastContainer');
  const themeToggle = $('themeToggle');

  // ============================================
  // State
  // ============================================
  let board = null;
  let links = [];
  let currentFilter = 'all';
  let expandedCards = null; // Will be set from localStorage or board default

  // Load/save expanded state
  function getExpandedKey() {
    const params = new URLSearchParams(window.location.search);
    return `boards-share-expanded-${params.get('id') || 'unknown'}`;
  }

  function loadExpandedCards() {
    try {
      const saved = localStorage.getItem(getExpandedKey());
      return saved ? JSON.parse(saved) : null; // null means use board default
    } catch { return null; }
  }

  function initExpandedCards() {
    const saved = loadExpandedCards();
    if (saved !== null) {
      // Use viewer's saved state
      expandedCards = saved;
    } else {
      // First visit - use board owner's expansion state
      expandedCards = (board && board.expanded_cards) ? { ...board.expanded_cards } : {};
    }
  }

  function saveExpandedCards() {
    try {
      localStorage.setItem(getExpandedKey(), JSON.stringify(expandedCards));
    } catch (e) { /* ignore */ }
  }

  // ============================================
  // Helpers
  // ============================================
  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function cap(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  }

  function secureImg(url) {
    return url ? url.replace(/^http:\/\//i, 'https://') : '';
  }

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    toastContainer.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // ============================================
  // Theme
  // ============================================
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    document.documentElement.classList.add('light');
  }

  themeToggle.onclick = () => {
    document.documentElement.classList.toggle('light');
    localStorage.setItem('theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
  };

  // ============================================
  // Load Board
  // ============================================
  async function loadBoard() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('id');

    if (!slug) {
      showError();
      return;
    }

    try {
      // Fetch board info
      const boardRes = await fetch(
        `${SUPABASE_URL}/rest/v1/shared_boards?slug=eq.${slug}&select=*`,
        { headers: { 'apikey': SUPABASE_ANON_KEY } }
      );

      if (!boardRes.ok) throw new Error('Failed to load board');

      const boardData = await boardRes.json();
      if (boardData.length === 0) {
        showError();
        return;
      }

      board = boardData[0];

      // Record view
      recordView(board.id);

      // Fetch links
      await loadLinks();

    } catch (e) {
      console.error('Failed to load board:', e);
      showError();
    }
  }

  async function loadLinks() {
    try {
      let linkIds;

      if (board.update_mode === 'snapshot' && board.snapshot_link_ids) {
        // Use snapshot link IDs
        linkIds = board.snapshot_link_ids;
        const idsParam = linkIds.map(id => `"${id}"`).join(',');
        const linksRes = await fetch(
          `${SUPABASE_URL}/rest/v1/links?id=in.(${idsParam})&select=*`,
          { headers: { 'apikey': SUPABASE_ANON_KEY } }
        );
        links = await linksRes.json();
      } else {
        // Live mode - fetch user's current links
        let query = `${SUPABASE_URL}/rest/v1/links?user_id=eq.${board.user_id}&select=*`;
        if (board.category) {
          query += `&category=eq.${board.category}`;
        }

        const linksRes = await fetch(query, {
          headers: { 'apikey': SUPABASE_ANON_KEY }
        });
        links = await linksRes.json();
      }

      // Sort links according to owner's saved order
      if (board.link_order && board.link_order.length > 0) {
        const orderMap = {};
        board.link_order.forEach((id, idx) => orderMap[id] = idx);
        links.sort((a, b) => {
          const aIdx = orderMap[a.id] ?? 999999;
          const bIdx = orderMap[b.id] ?? 999999;
          return aIdx - bIdx;
        });
      }

      showBoard();

    } catch (e) {
      console.error('Failed to load links:', e);
      showError();
    }
  }

  async function recordView(boardId) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/board_views`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY
        },
        body: JSON.stringify({
          board_id: boardId,
          referrer: document.referrer || null,
          user_agent: navigator.userAgent
        })
      });
    } catch (e) {
      // Ignore view tracking errors
    }
  }

  function showError() {
    loading.style.display = 'none';
    error.style.display = 'flex';
  }

  function showBoard() {
    loading.style.display = 'none';
    grid.style.display = 'grid';

    // Initialize expanded cards (from localStorage or board default)
    initExpandedCards();

    // Set title with owner email
    const categoryName = board.name || (board.category ? cap(board.category) : 'All Links');
    const ownerEmail = board.owner_email || 'Anonymous';
    boardTitle.textContent = `${ownerEmail} / ${categoryName}`;
    document.title = `${categoryName} - ${ownerEmail}`;

    // Set meta
    boardMeta.textContent = `${links.length} link${links.length !== 1 ? 's' : ''}`;

    // Show filters if showing all categories
    if (!board.category) {
      renderFilters();
      filters.style.display = 'flex';
    } else {
      grid.classList.add('grid--no-filters');
    }

    renderGrid();
  }

  // ============================================
  // Render
  // ============================================
  function renderFilters() {
    const categories = {};
    for (const l of links) {
      categories[l.category] = (categories[l.category] || 0) + 1;
    }

    let html = `<button class="filter-token ${currentFilter === 'all' ? 'filter-token--active' : ''}" data-category="all">All</button>`;

    const sorted = Object.entries(categories)
      .filter(([cat]) => cat !== 'uncategorized')
      .sort((a, b) => b[1] - a[1]);

    for (const [cat, count] of sorted) {
      const active = currentFilter === cat ? 'filter-token--active' : '';
      html += `<button class="filter-token ${active}" data-category="${cat}">${cap(cat)}</button>`;
    }

    // Add uncategorized at end if exists
    if (categories['uncategorized']) {
      const active = currentFilter === 'uncategorized' ? 'filter-token--active' : '';
      html += `<button class="filter-token ${active}" data-category="uncategorized">Uncategorized</button>`;
    }

    filters.innerHTML = html;
  }

  function renderGrid() {
    const filtered = currentFilter === 'all' ? links : links.filter(l => l.category === currentFilter);

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="loading">No links in this category</div>';
      return;
    }

    let html = '';
    for (const l of filtered) {
      const hasImg = l.image && l.image.length > 0;
      const initial = l.title ? l.title.charAt(0).toUpperCase() : '?';
      const expansionState = expandedCards[l.id];
      const expandedClass = expansionState ? ` grid-item--expanded-${expansionState}` : '';
      const isExpanded = !!expansionState;
      const dateStr = l.created_at ? new Date(l.created_at).toLocaleDateString() : '';

      const detailsHtml = `
        <div class="grid-item__details">
          <h2 class="grid-item__details-title">${esc(l.title)}</h2>
          <p class="grid-item__details-domain">${esc(l.domain)}</p>
          ${l.description ? `<p class="grid-item__details-description">${esc(l.description)}</p>` : ''}
          <div class="grid-item__details-meta">
            <span>${cap(l.category)}</span>
            ${dateStr ? `<span>${dateStr}</span>` : ''}
          </div>
          <div class="grid-item__actions">
            <a href="${l.url}" target="_blank" rel="noopener" class="grid-item__action" data-action="visit">Visit</a>
            <button class="grid-item__action" data-action="save">Save Link</button>
          </div>
        </div>
        <div class="grid-item__resize" data-action="resize"></div>`;

      if (hasImg) {
        html += `<article class="grid-item${expandedClass}" data-id="${l.id}" data-url="${esc(l.url)}">
          <img class="grid-item__image" src="${secureImg(l.image)}" alt="" loading="lazy">
          <div class="grid-item__overlay"><h3 class="grid-item__title">${esc(l.title)}</h3><p class="grid-item__domain">${esc(l.domain)}</p></div>
          <span class="grid-item__category">${cap(l.category)}</span>
          ${detailsHtml}
        </article>`;
      } else {
        html += `<article class="grid-item grid-item--placeholder${expandedClass}" data-id="${l.id}" data-url="${esc(l.url)}">
          ${isExpanded ? `<div class="grid-item__initial-wrap"><span class="grid-item__initial">${initial}</span></div>` : `<span class="grid-item__initial">${initial}</span>`}
          <div class="grid-item__overlay"><h3 class="grid-item__title">${esc(l.title)}</h3><p class="grid-item__domain">${esc(l.domain)}</p></div>
          <span class="grid-item__category">${cap(l.category)}</span>
          ${detailsHtml}
        </article>`;
      }
    }

    grid.innerHTML = html;
  }

  // ============================================
  // Events
  // ============================================
  filters.onclick = (e) => {
    const btn = e.target.closest('.filter-token');
    if (!btn) return;
    currentFilter = btn.dataset.category;
    renderFilters();
    renderGrid();
  };

  grid.onclick = (e) => {
    const item = e.target.closest('.grid-item');
    if (!item) return;

    const id = item.dataset.id;
    const url = item.dataset.url;
    const action = e.target.closest('[data-action]')?.dataset.action;

    // Handle actions
    if (action === 'visit') {
      return; // Let link handle it
    }

    if (action === 'save') {
      e.preventDefault();
      const btn = e.target.closest('[data-action="save"]');
      saveLink(id, btn);
      return;
    }

    if (action === 'resize') {
      e.preventDefault();
      cycleExpansion(id);
      return;
    }

    // Click on card - cycle expansion
    cycleExpansion(id);
  };

  function cycleExpansion(id) {
    const current = expandedCards[id];
    if (!current) {
      expandedCards[id] = 'medium';
    } else if (current === 'medium') {
      expandedCards[id] = 'large';
    } else {
      delete expandedCards[id];
    }
    saveExpandedCards();
    renderGrid();
  }

  // Auth helpers
  function getStoredAuth() {
    try {
      const key = `sb-yfhudwakpgzswiylhfbh-auth-token`;
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : null;
    } catch { return null; }
  }

  function getAccessToken() {
    const auth = getStoredAuth();
    return auth?.access_token || null;
  }

  function getCurrentUser() {
    const auth = getStoredAuth();
    return auth?.user || null;
  }

  const PENDING_SAVES_KEY = 'boards_pending_saves';

  function getPendingSaves() {
    try {
      return JSON.parse(localStorage.getItem(PENDING_SAVES_KEY) || '[]');
    } catch { return []; }
  }

  function savePendingSave(linkData) {
    const pending = getPendingSaves();
    // Check if URL already in pending
    if (pending.some(p => p.url === linkData.url)) {
      return false; // Already pending
    }
    pending.push(linkData);
    localStorage.setItem(PENDING_SAVES_KEY, JSON.stringify(pending));
    return true;
  }

  async function checkDuplicate(url, accessToken) {
    try {
      const encodedUrl = encodeURIComponent(url);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/links?url=eq.${encodedUrl}&select=id`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`
        }
      });
      if (res.ok) {
        const existing = await res.json();
        return existing.length > 0;
      }
    } catch {}
    return false;
  }

  async function saveLink(id, btn) {
    const link = links.find(l => l.id === id);
    if (!link || !btn) return;

    const accessToken = getAccessToken();
    const user = getCurrentUser();

    // Disable button during save
    btn.disabled = true;
    btn.textContent = 'Saving...';

    // If not logged in, save to pending queue
    if (!accessToken || !user) {
      // Check if already in pending saves
      const pending = getPendingSaves();
      if (pending.some(p => p.url === link.url)) {
        btn.textContent = 'Already Saved';
        btn.classList.add('grid-item__action--saved');
        setTimeout(() => {
          btn.textContent = 'View on Board';
          btn.disabled = false;
          btn.onclick = (e) => {
            e.stopPropagation();
            window.open('/boards/', '_blank');
          };
        }, 1500);
        return;
      }

      // Save to pending queue
      const linkData = {
        id: crypto.randomUUID(),
        url: link.url,
        title: link.title,
        description: link.description,
        image: link.image,
        domain: link.domain,
        category: link.category,
        confidence: link.confidence || null,
        created_at: new Date().toISOString()
      };
      savePendingSave(linkData);

      // Animate same as logged-in save
      btn.textContent = 'Saved ✓';
      btn.classList.add('grid-item__action--saved');
      setTimeout(() => {
        btn.textContent = 'View on Board';
        btn.disabled = false;
        btn.onclick = (e) => {
          e.stopPropagation();
          window.open('/boards/', '_blank');
        };
      }, 1500);
      return;
    }

    try {
      // Check for duplicate by URL
      const isDuplicate = await checkDuplicate(link.url, accessToken);
      if (isDuplicate) {
        btn.textContent = 'Already Saved';
        btn.classList.add('grid-item__action--saved');
        setTimeout(() => {
          btn.textContent = 'View on Board';
          btn.disabled = false;
          btn.onclick = (e) => {
            e.stopPropagation();
            window.open('/boards/', '_blank');
          };
        }, 1500);
        return;
      }

      // Generate new ID for the saved link
      const newId = crypto.randomUUID();

      // Save link to user's board
      const res = await fetch(`${SUPABASE_URL}/rest/v1/links`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          id: newId,
          user_id: user.id,
          url: link.url,
          title: link.title,
          description: link.description,
          image: link.image,
          domain: link.domain,
          category: link.category,
          confidence: link.confidence || null,
          created_at: new Date().toISOString()
        })
      });

      if (res.ok) {
        // Animate to "Saved ✓"
        btn.textContent = 'Saved ✓';
        btn.classList.add('grid-item__action--saved');

        // After delay, show "View on your board"
        setTimeout(() => {
          btn.textContent = 'View on Board';
          btn.disabled = false;
          btn.onclick = (e) => {
            e.stopPropagation();
            window.open('/boards/', '_blank');
          };
        }, 1500);
      } else {
        throw new Error('Failed to save');
      }
    } catch (e) {
      console.error('Save failed:', e);
      btn.textContent = 'Save Link';
      btn.disabled = false;
      toast('Failed to save - try again', true);
    }
  }

  // ============================================
  // Init
  // ============================================
  loadBoard();

})();
</script>
</body>
</html>
