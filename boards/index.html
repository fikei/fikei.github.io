<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" id="viewport">
  <title>Boards</title>

  <!-- Space Grotesk Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
/* ============================================
   Boards - Swiss Grid + Web 1.0 Typography
   ============================================ */

:root {
  /* Typography - Space Grotesk */
  --font-primary: "Space Grotesk", sans-serif;
  --font-serif: "Space Grotesk", sans-serif;
  --font-mono: "Space Grotesk", sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;
  --line-height-tight: 1.2;
  --line-height-normal: 1.6;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* Grid */
  --grid-gap: 16px;

  /* Dark mode (default) */
  --bg: #111;
  --fg: #fff;
  --surface: #1a1a1a;
  --border: #fff;
  --muted: #888;
  --subtle: #333;
}

:root.light {
  --bg: #fff;
  --fg: #000;
  --surface: #fff;
  --border: #000;
  --muted: #888;
  --subtle: #e0e0e0;
}

/* Progress bar */
.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--subtle);
  z-index: 1000;
  display: none;
}

.progress-bar--visible {
  display: block;
}

.progress-bar__fill {
  height: 100%;
  background: var(--fg);
  width: 0%;
  transition: width 0.2s ease;
}

.progress-status {
  position: fixed;
  top: var(--space-4);
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--fg);
  padding: var(--space-2) var(--space-4);
  z-index: 1000;
  display: none;
}

.progress-status--visible {
  display: block;
}

/* Auth bar */
.auth-bar {
  position: fixed;
  top: var(--space-4);
  right: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  z-index: 100;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.auth-bar__user {
  color: var(--muted);
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.auth-bar__btn {
  padding: var(--space-1) var(--space-3);
  background: transparent;
  border: 1px solid var(--fg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.auth-bar__btn:hover {
  background: var(--fg);
  color: var(--bg);
}

/* Auth modal */
.auth-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.auth-modal--visible {
  display: flex;
}

.auth-modal__content {
  background: var(--bg);
  border: 1px solid var(--fg);
  padding: var(--space-6);
  max-width: 320px;
  width: 90%;
}

.auth-modal__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-lg);
  margin-bottom: var(--space-4);
}

.auth-modal__input {
  width: 100%;
  padding: var(--space-3);
  border: 1px solid var(--fg);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  margin-bottom: var(--space-4);
  box-sizing: border-box;
}

.auth-modal__input:focus {
  outline: none;
  box-shadow: 0 0 0 1px var(--fg);
}

.auth-modal__submit {
  width: 100%;
  padding: var(--space-3);
  background: var(--fg);
  color: var(--bg);
  border: 1px solid var(--fg);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: opacity 0.15s;
}

.auth-modal__submit:hover {
  opacity: 0.9;
}

.auth-modal__submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.auth-modal__status {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  margin-top: var(--space-3);
  text-align: center;
}

.auth-modal__status--error {
  color: #c00;
}

.auth-modal__close {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  background: none;
  border: none;
  color: var(--fg);
  font-size: var(--font-size-lg);
  cursor: pointer;
  padding: var(--space-2);
}

/* Theme toggle */
.theme-toggle {
  position: fixed;
  bottom: var(--space-4);
  left: var(--space-4);
  width: 32px;
  height: 18px;
  background: transparent;
  border: 1px solid var(--fg);
  cursor: pointer;
  z-index: 100;
  padding: 2px;
  transition: background 0.2s ease;
}

.theme-toggle__knob {
  width: 12px;
  height: 12px;
  background: var(--fg);
  transition: transform 0.2s ease;
  transform: translateX(0);
}

:root.light .theme-toggle {
  background: var(--fg);
}

:root.light .theme-toggle__knob {
  background: var(--bg);
  transform: translateX(14px);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
}

body {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
  color: var(--fg);
  background: var(--bg);
  transition: background 0.3s ease, color 0.3s ease;
}

/* ============================================
   Floating Add Button
   ============================================ */
.fab {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  width: 24px;
  height: 24px;
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  background: var(--fg);
  color: var(--bg);
  border: none;
  cursor: pointer;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab:hover {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
}

/* ============================================
   Filters
   ============================================ */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-4);
  border-bottom: 1px solid var(--subtle);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

.filter-token {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: var(--space-1) var(--space-3);
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--fg);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.filter-token:hover {
  background: var(--fg);
  color: var(--bg);
}

.filter-token--active {
  background: var(--fg);
  color: var(--bg);
}

/* ============================================
   Grid
   ============================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--grid-gap);
  padding: var(--space-4);
}

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}

/* ============================================
   Grid Item
   ============================================ */
.grid-item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  background: var(--subtle);
  border: 1px solid var(--fg);
  transition: transform 0.1s, opacity 0.1s;
}

.grid-item.dragging {
  opacity: 0.4;
  transform: scale(0.95);
}

.grid-item.drag-before {
  transform: translateX(8px);
  box-shadow: -4px 0 0 0 var(--fg);
}

.grid-item.drag-after {
  transform: translateX(-8px);
  box-shadow: 4px 0 0 0 var(--fg);
}

/* New item animation */
@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-20px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.grid-item--new {
  animation: slideIn 0.4s ease-out forwards;
}

.grid-item__image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(1.1);
  transition: filter 0.2s;
}

.grid-item:hover .grid-item__image {
  filter: grayscale(0%);
}

.grid-item__overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: var(--space-3);
  background: var(--bg);
  border-top: 1px solid var(--fg);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__overlay {
  opacity: 1;
}

@media (hover: none) {
  .grid-item__overlay {
    opacity: 1;
    padding: var(--space-2);
  }
}

.grid-item__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-sm);
  font-weight: normal;
  line-height: var(--line-height-tight);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-item__domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  margin-top: 2px;
  text-decoration: underline;
}

.grid-item__category {
  position: absolute;
  top: 0;
  left: 0;
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 2px 6px;
  background: var(--bg);
  border-right: 1px solid var(--fg);
  border-bottom: 1px solid var(--fg);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__category {
  opacity: 1;
}

/* Placeholder */
.grid-item--placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--placeholder .grid-item__initial {
  font-family: var(--font-serif);
  font-size: var(--font-size-2xl);
  color: var(--bg);
}

/* Expanded States - Shared */
.grid-item--expanded-medium,
.grid-item--expanded-large {
  aspect-ratio: auto;
  padding: var(--space-4);
  background: var(--bg);
  position: relative;
}

.grid-item--expanded-medium .grid-item__overlay,
.grid-item--expanded-large .grid-item__overlay {
  display: none;
}

.grid-item--expanded-medium .grid-item__category,
.grid-item--expanded-large .grid-item__category {
  opacity: 1;
}

.grid-item--expanded-medium .grid-item__image,
.grid-item--expanded-large .grid-item__image {
  filter: grayscale(0%);
}

.grid-item--expanded-medium .grid-item__details,
.grid-item--expanded-large .grid-item__details {
  display: flex;
}

/* Medium State: 2×2 */
.grid-item--expanded-medium {
  grid-column: span 2;
  grid-row: span 2;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr auto;
  gap: var(--space-3);
}

.grid-item--expanded-medium .grid-item__image {
  grid-row: 1 / 2;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid-item--expanded-medium .grid-item__initial-wrap {
  grid-row: 1 / 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--expanded-medium .grid-item__details {
  grid-row: 1 / 2;
  flex-direction: column;
  gap: var(--space-2);
}

.grid-item--expanded-medium .grid-item__actions {
  grid-column: 1 / -1;
  grid-row: 2;
}

.grid-item--expanded-medium .grid-item__details-description {
  -webkit-line-clamp: 2;
}

/* Large State: 3×2 */
.grid-item--expanded-large {
  grid-column: span 3;
  grid-row: span 2;
  display: grid;
  grid-template-columns: 1fr 2fr;
  grid-template-rows: 1fr auto;
  gap: var(--space-4);
}

.grid-item--expanded-large .grid-item__image {
  grid-row: 1 / 3;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid-item--expanded-large .grid-item__initial-wrap {
  grid-row: 1 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--expanded-large .grid-item__details {
  grid-row: 1 / 2;
  flex-direction: column;
  gap: var(--space-3);
}

.grid-item--expanded-large .grid-item__actions {
  grid-row: 2;
}

.grid-item--expanded-large .grid-item__details-description {
  -webkit-line-clamp: 4;
}

/* Resize Handle */
.grid-item__resize {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 24px;
  height: 24px;
  cursor: nwse-resize;
  display: none;
  align-items: flex-end;
  justify-content: flex-end;
  padding: 4px;
}

.grid-item--expanded-medium .grid-item__resize,
.grid-item--expanded-large .grid-item__resize {
  display: flex;
}

.grid-item__resize::before {
  content: '';
  width: 12px;
  height: 12px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
}

.grid-item__resize:hover::before {
  border-color: var(--fg);
}

/* Shared detail styles */
.grid-item__details {
  display: none;
  flex-direction: column;
  gap: var(--space-3);
}

.grid-item__details-title {
  font-family: var(--font-serif);
  font-size: var(--font-size-lg);
  font-weight: normal;
  line-height: var(--line-height-tight);
}

.grid-item__details-domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  text-decoration: underline;
}

.grid-item__details-description {
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  color: var(--muted);
  line-height: var(--line-height-normal);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-item__details-meta {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  display: flex;
  gap: var(--space-3);
}

.grid-item__actions {
  display: flex;
  gap: var(--space-2);
  margin-top: auto;
}

.grid-item__action {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: var(--space-2) var(--space-3);
  background: transparent;
  border: 1px solid var(--fg);
  color: var(--fg);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, color 0.15s;
}

.grid-item__action:hover {
  background: var(--fg);
  color: var(--bg);
}

.grid-item__action--danger {
  border-color: #c00;
  color: #c00;
}

.grid-item__action--danger:hover {
  background: #c00;
  color: #fff;
}

/* Responsive: Mobile */
@media (max-width: 599px) {
  /* On mobile, both states become full-width stacked */
  .grid-item--expanded-medium,
  .grid-item--expanded-large {
    grid-column: 1 / -1;
    grid-row: span 1;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
  }

  .grid-item--expanded-medium .grid-item__image,
  .grid-item--expanded-large .grid-item__image,
  .grid-item--expanded-medium .grid-item__initial-wrap,
  .grid-item--expanded-large .grid-item__initial-wrap {
    grid-row: 1;
    aspect-ratio: 16/9;
    height: auto;
  }

  .grid-item--expanded-medium .grid-item__details,
  .grid-item--expanded-large .grid-item__details {
    grid-row: 2;
  }

  .grid-item--expanded-medium .grid-item__actions,
  .grid-item--expanded-large .grid-item__actions {
    grid-column: 1;
    grid-row: 3;
  }

  /* Hide resize on mobile - use tap to toggle */
  .grid-item__resize {
    display: none !important;
  }
}

/* ============================================
   Empty State
   ============================================ */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 100px);
}

.empty-state__box {
  border: 1px solid var(--fg);
  padding: var(--space-6);
  max-width: 320px;
  text-align: center;
}

.empty-state__text {
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  color: var(--fg);
  line-height: var(--line-height-normal);
}

.loader {
  grid-column: 1 / -1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 100px);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--fg);
}

.loader::after {
  content: 'Loading';
  animation: loading 1.5s infinite;
}

@keyframes loading {
  0%, 20% { content: 'Loading'; }
  40% { content: 'Loading.'; }
  60% { content: 'Loading..'; }
  80%, 100% { content: 'Loading...'; }
}

/* ============================================
   Modal
   ============================================ */
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0.15s;
}

.modal--visible {
  opacity: 1;
  visibility: visible;
}

.modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

.modal__content {
  position: relative;
  width: calc(100% - 32px);
  max-width: 480px;
  max-height: calc(100vh - 32px);
  background: var(--bg);
  border: 2px solid var(--fg);
  overflow-y: auto;
}

.modal--small .modal__content {
  max-width: 300px;
}

.modal__header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: var(--space-4);
  border-bottom: 1px solid var(--fg);
}

.modal__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
}

.modal__close {
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.modal__close:hover {
  text-decoration: underline;
}

/* ============================================
   Add Form
   ============================================ */
.add-form {
  padding: var(--space-4);
}

.add-form__input {
  width: 100%;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  border: 1px solid var(--fg);
  resize: vertical;
}

.add-form__input:focus {
  outline: 2px solid var(--fg);
  outline-offset: 1px;
}

.add-form__status {
  min-height: 20px;
  padding: var(--space-2) 0;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.add-form__status--error {
  font-weight: bold;
}

.add-form__submit {
  width: 100%;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: var(--fg);
  color: var(--bg);
  border: 1px solid var(--fg);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.add-form__submit:hover {
  background: var(--bg);
  color: var(--fg);
}

/* ============================================
   Overlay (Detail View)
   ============================================ */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0.15s;
}

.overlay--visible {
  opacity: 1;
  visibility: visible;
}

.overlay__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
}

.overlay__content {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

@media (min-width: 900px) {
  .overlay__content {
    max-width: 560px;
    margin: var(--space-8) auto;
    height: auto;
    max-height: calc(100vh - 64px);
    border: 2px solid var(--fg);
  }
}

.overlay__close {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  z-index: 10;
  width: 32px;
  height: 32px;
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  background: var(--bg);
  border: 1px solid var(--fg);
  cursor: pointer;
}

.overlay__image {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  filter: grayscale(100%);

      // Try twitter:image
      if (!ogImg) {
        ogImg = html.match(/<meta[^>]*name\s*=\s*["']twitter:image["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                html.match(/<meta[^>]*content\s*=\s*["']([^"']+)["'][^>]*name\s*=\s*["']twitter:image["']/i) ||
                html.match(/<meta[^>]*name\s*=\s*["']twitter:image:src["'][^>]*content\s*=\s*["']([^"']+)["']/i);
      }

      // Try og:image:url and og:image:secure_url
      if (!ogImg) {
        ogImg = html.match(/<meta[^>]*property\s*=\s*["']og:image:url["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                html.match(/<meta[^>]*property\s*=\s*["']og:image:secure_url["'][^>]*content\s*=\s*["']([^"']+)["']/i);
      }

      // Try itemprop image (schema.org)
      if (!ogImg) {
        ogImg = html.match(/<meta[^>]*itemprop\s*=\s*["']image["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                html.match(/<link[^>]*rel\s*=\s*["']image_src["'][^>]*href\s*=\s*["']([^"']+)["']/i);
      }

      // Fallback: try to find first significant image tag
      if (!ogImg) {
        const imgMatch = html.match(/<img[^>]*src\s*=\s*["']([^"']+)["'][^>]*>/gi);
        if (imgMatch) {
          for (const img of imgMatch.slice(0, 5)) {
            const src = img.match(/src\s*=\s*["']([^"']+)["']/i);
            if (src && src[1] && !src[1].includes('logo') && !src[1].includes('icon') && !src[1].includes('sprite')) {
              ogImg = [null, src[1]];
              break;
            }
          }
        }
      }

      if (ogImg) {
        let img = ogImg[1];
        // Skip logos, favicons, icons
        const imgLower = img.toLowerCase();
        if (imgLower.includes('logo') || imgLower.includes('favicon') || imgLower.includes('icon') || imgLower.includes('sprite') || imgLower.includes('profile')) {
          // Try to find a product image instead
          const productImg = html.match(/<img[^>]*class\s*=\s*["'][^"']*product[^"']*["'][^>]*src\s*=\s*["']([^"']+)["']/i) ||
                            html.match(/<img[^>]*src\s*=\s*["']([^"']+)["'][^>]*class\s*=\s*["'][^"']*product[^"']*["']/i) ||
                            html.match(/<img[^>]*data-src\s*=\s*["']([^"']+)["']/i);
          if (productImg && productImg[1]) {
            img = productImg[1];
          } else {
            // Try first significant image that's not a logo
            const imgMatch = html.match(/<img[^>]*src\s*=\s*["']([^"']+)["'][^>]*>/gi);
            if (imgMatch) {
              for (const imgTag of imgMatch.slice(0, 10)) {
                const src = imgTag.match(/src\s*=\s*["']([^"']+)["']/i);
                if (src && src[1]) {
                  const srcLower = src[1].toLowerCase();
                  if (!srcLower.includes('logo') && !srcLower.includes('favicon') && !srcLower.includes('icon') && !srcLower.includes('sprite') && !srcLower.includes('profile') && !srcLower.includes('avatar')) {
                    img = src[1];
                    break;
                  }
                }
              }
            }
          }
        }
        if (!img.startsWith('http')) {
          try { img = new URL(img, url).href; } catch {}
        }
        // Final check - don't use if still a logo
        const finalLower = img.toLowerCase();
        if (!finalLower.includes('logo') && !finalLower.includes('favicon') && !finalLower.includes('icon')) {
          meta.image = img;
        }
      }
    } catch (parseErr) {
      // Parse error - continue with defaults
    }

    return meta;
  }

  async function categorizeWithAI(link) {
    const domain = link.domain || new URL(link.url).hostname;
    const startTime = performance.now();

    // Check cache first (domain-level)
    if (categoryCache[domain]) {
      const ms = (performance.now() - startTime).toFixed(0);
      console.log(`%c[categorize] ${domain}`, 'color: #888',
        `\n  → ${categoryCache[domain]} (cached)`,
        `\n  ⏱ ${ms}ms`);
      return { category: categoryCache[domain], confidence: 0.8, cached: true, source: 'cache' };
    }

    // Call Supabase Edge Function
    try {
      const accessToken = getAccessToken();
      const res = await fetch(AI_CATEGORIZE_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken || SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({
          url: link.url,
          title: link.title || '',
          description: link.description || '',
          domain: domain,
          categories: CATEGORIES
        })
      });

      if (!res.ok) {
        console.warn('[categorize] API error:', res.status);
        return null; // Fall back to rule-based
      }

      const data = await res.json();
      const ms = (performance.now() - startTime).toFixed(0);

      console.log(`%c[categorize] ${domain}`, 'color: #10b981',
        `\n  → ${data.category} (AI, ${(data.confidence * 100).toFixed(0)}%)`,
        `\n  💭 ${data.reason || 'no reason'}`,
        `\n  ⏱ ${ms}ms`);

      // Cache the result by domain
      if (data.category && data.category !== 'uncategorized') {
        categoryCache[domain] = data.category;
        saveCategoryCache(categoryCache);
      }

      return { category: data.category, confidence: data.confidence || 0.9, cached: false, source: 'ai', reason: data.reason };
    } catch (e) {
      console.warn('[categorize] AI failed:', e.message);
      return null; // Fall back to rule-based
    }
  }

    // Fall back to rule-based
    const startTime = performance.now();

  function categorize(link) {
    const text = `${link.title || ''} ${link.description || ''} ${link.url || ''}`.toLowerCase();
    let best = 'uncategorized', maxScore = 0;

    for (const [cat, p] of Object.entries(PATTERNS)) {
      let score = 0;
      // Domain match gives 0.5
      for (const d of p.domains) {
        if ((link.domain || '').includes(d) || (link.url || '').includes(d)) {
          score += 0.5;
          break;
        }
      }
      // Keyword match gives 0.15 each (so 2 matches = 0.3 which passes threshold)
      for (const k of p.kw) {
        if (text.includes(k)) score += 0.15;
      }
      score = Math.min(score, 1);
      if (score > maxScore) { maxScore = score; best = cat; }
    }

    // Lower threshold to 0.15 (single keyword match is enough)
    return { category: maxScore >= 0.15 ? best : 'uncategorized', confidence: maxScore };
  }

  function detectClusters(items) {
    if (!items || items.length < 3) return [];
    const domainGroups = {};
    for (const item of items) {
      const d = item.domain || 'unknown';
      if (!domainGroups[d]) domainGroups[d] = [];
      domainGroups[d].push(item);
    }
    const clusters = [];
    for (const [domain, list] of Object.entries(domainGroups)) {
      if (list.length >= 3) {
        clusters.push({ name: domain.split('.')[0], items: list });
      }
    }
    return clusters;
  }

  function findByUrl(url) {
    const n = url.toLowerCase().replace(/\/+$/, '');

  }

  function addLink(link) {
    const existing = findByUrl(link.url);
    const data = load();

    if (existing) {
      const i = data.links.findIndex(l => l.id === existing.id);
      if (i !== -1) {
        const mergedImage = link.image || existing.image;
        const mergedDescription = link.description || existing.description;
        const mergedTitle = (link.title && link.title !== link.domain) ? link.title : existing.title;

        data.links[i] = {
          ...existing,
          ...link,
          image: mergedImage,
          description: mergedDescription,
          title: mergedTitle,
          id: existing.id,
          addedAt: existing.addedAt,
          updatedAt: new Date().toISOString()
        };
        syncLinkToSupabase(data.links[i]); // Background sync
      }
      if (!data.categories[link.category]) {
        data.categories[link.category] = { pinned: false };
      }
      save(data);
      return { success: true, updated: true };
    }

    const newLink = { ...link, addedAt: new Date().toISOString() };
    data.links.push(newLink);
    if (!data.linkOrder) data.linkOrder = [];
    data.linkOrder.unshift(link.id);
    if (!data.categories[link.category]) {
      data.categories[link.category] = { pinned: false };
    }
    save(data);
    syncLinkToSupabase(newLink); // Background sync
    syncOrderToSupabase(data.linkOrder); // Background sync
    return { success: true };
  }

  function updateLink(id, updates) {
    const data = load();
    const i = data.links.findIndex(l => l.id === id);
    if (i === -1) throw new Error('Not found');
    data.links[i] = { ...data.links[i], ...updates, updatedAt: new Date().toISOString() };
    if (updates.category && !data.categories[updates.category]) {
      data.categories[updates.category] = { pinned: false };
    }
    save(data);
    syncLinkToSupabase(data.links[i]); // Background sync
  }

  function deleteLink(id) {
    const data = load();
    data.links = data.links.filter(l => l.id !== id);
    if (data.linkOrder) data.linkOrder = data.linkOrder.filter(i => i !== id);
    save(data);
    deleteLinkFromSupabase(id); // Background sync
    syncOrderToSupabase(data.linkOrder);
  }

  function reorderLinks(fromId, toId, position = 'before') {
    const data = load();
    if (!data.linkOrder) data.linkOrder = data.links.map(l => l.id);
    const fromIdx = data.linkOrder.indexOf(fromId);
    let toIdx = data.linkOrder.indexOf(toId);
    if (fromIdx === -1 || toIdx === -1) return;
    data.linkOrder.splice(fromIdx, 1);
    toIdx = data.linkOrder.indexOf(toId);
    const insertIdx = position === 'after' ? toIdx + 1 : toIdx;
    data.linkOrder.splice(insertIdx, 0, fromId);
    save(data);
    syncOrderToSupabase(data.linkOrder); // Background sync
  }

  function createCategory(name) {
    const data = load();
    const n = name.toLowerCase().replace(/\s+/g, '-');
    if (data.categories[n]) throw new Error('Category exists');
    data.categories[n] = { pinned: false };
    save(data);
    return n;
  }

    for (const id of ids) {

        data.links[i].category = category;
        syncLinkToSupabase(data.links[i]); // Background sync
      }
    }
    if (!data.categories[category]) data.categories[category] = { pinned: false };
    save(data);
  }

  function renderFilters() {
    const cats = getCategories();
    const links = getAllLinks();
    const counts = { all: links.length };

    let html = `<button class="filter-token ${currentFilter === 'all' ? 'filter-token--active' : ''}" data-category="all">All</button>`;

    const sorted = Object.entries(cats)
      .filter(([n]) => counts[n] > 0 && n !== 'uncategorized')
      .sort((a, b) => (b[1].pinned ? 1 : 0) - (a[1].pinned ? 1 : 0) || (counts[b[0]] || 0) - (counts[a[0]] || 0));

    for (const [name] of sorted) {
      const c = counts[name] || 0;
      const active = currentFilter === name ? 'filter-token--active' : '';
      const badge = name === 'uncategorized' && c > 0 ? ` (${c})` : '';
      html += `<button class="filter-token ${active}" data-category="${name}">${cap(name)}${badge}</button>`;

      const aIdx = order.indexOf(a.id);

    });
  }

  grid.ondragstart = (e) => {
    const item = e.target.closest('.grid-item');
    if (!item) return;
    draggedId = item.dataset.id;
    isDragging = true;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedId);
  };

  grid.ondragend = (e) => {
    const item = e.target.closest('.grid-item');
    if (item) item.classList.remove('dragging');
    clearDragClasses();
    draggedId = null;
    dropPosition = null;
    setTimeout(() => { isDragging = false; }, 100);
  };

  grid.ondragover = (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const item = e.target.closest('.grid-item');
    if (item && item.dataset.id !== draggedId) {
      // Determine if dropping before or after based on mouse position
      const rect = item.getBoundingClientRect();
      const midX = rect.left + rect.width / 2;
      const isBefore = e.clientX < midX;

      clearDragClasses();
      item.classList.add(isBefore ? 'drag-before' : 'drag-after');
      dropPosition = isBefore ? 'before' : 'after';
    }
  };

  grid.ondragleave = (e) => {
    const item = e.target.closest('.grid-item');
    if (item) {
      item.classList.remove('drag-before', 'drag-after');
    }
  };

  grid.ondrop = (e) => {
    e.preventDefault();
    const targetItem = e.target.closest('.grid-item');
    if (!targetItem || !draggedId) return;
    clearDragClasses();
    const targetId = targetItem.dataset.id;
    if (draggedId !== targetId) {
      reorderLinks(draggedId, targetId, dropPosition);
      renderGrid();
    }
  };

  // Drag-to-resize functionality
  let resizeState = null;
  const RESIZE_THRESHOLD = 50; // pixels to trigger size change

  grid.onmousedown = (e) => {
    const handle = e.target.closest('.grid-item__resize');
    if (!handle) return;
    e.preventDefault();
    const item = e.target.closest('.grid-item');
    if (!item) return;
    resizeState = {
      id: item.dataset.id,
      startX: e.clientX,
      startY: e.clientY,
      currentState: expandedCards[item.dataset.id] || 'medium'
    };
    document.body.style.cursor = 'nwse-resize';

  document.onmousemove = (e) => {
    if (!resizeState) return;
    const deltaX = e.clientX - resizeState.startX;

  document.onmouseup = (e) => {
    if (!resizeState) return;
    const deltaX = e.clientX - resizeState.startX;
    const id = resizeState.id;

    // Determine new size based on drag distance
    if (deltaX > RESIZE_THRESHOLD && resizeState.currentState === 'medium') {
      expandedCards[id] = 'large';
      saveExpandedCards(expandedCards);

  // ============================================

  // ============================================
  // Direct paste processing

  async function processLinks(text) {
    const urls = extractUrls(text);

    if (urls.length === 0) {
      toast('No valid URLs found', true);
      return;
    }

    let added = 0, updated = 0, failed = 0;
    const total = urls.length;

    for (let i = 0; i < urls.length; i++) {
      const url = urls[i];
      showProgress(i + 1, total, url);
      try {
        const meta = await fetchMetadata(url);
        const cat = await smartCategorize(meta);
        const linkObj = { id: generateId(url), url, ...meta, category: cat.category, confidence: cat.confidence };
        const result = addLink(linkObj);
        if (result.success) {
          if (result.updated) updated++;
          else added++;
          // Render immediately after each successful add
          renderFilters();
          renderGrid();
        }
      } catch (err) {
        failed++;
      }
    }

    hideProgress();

    // Show summary toast at end
    const parts = [];
    if (added > 0) parts.push(`${added} added`);
    if (updated > 0) parts.push(`${updated} updated`);
    if (failed > 0) parts.push(`${failed} failed`);
    if (parts.length > 0) {
      toast(parts.join(', '));
    }
    checkClusters();
  }

  async function createOrUpdateShare() {
    const accessToken = getAccessToken();
    if (!accessToken) {
      toast('Login required', true);
      return;
    }

    const visibility = document.querySelector('input[name="shareVisibility"]:checked')?.value || 'link';
    const updateMode = document.querySelector('input[name="shareUpdateMode"]:checked')?.value || 'live';

    shareCreateBtn.disabled = true;
    shareCreateBtn.textContent = currentShare ? 'Updating...' : 'Creating...';

    try {
      let snapshotIds = null;
      if (updateMode === 'snapshot') {
        const links = shareCategory
          ? getAllLinks().filter(l => l.category === shareCategory)
          : getAllLinks();
        snapshotIds = links.map(l => l.id);
      }

      // Get expanded cards for the category being shared
      let expandedForShare = expandedCards;
      if (shareCategory) {
        // Filter to only cards in this category
        const categoryLinks = getAllLinks().filter(l => l.category === shareCategory);
        const categoryIds = new Set(categoryLinks.map(l => l.id));
        expandedForShare = {};
        for (const [id, state] of Object.entries(expandedCards)) {
          if (categoryIds.has(id)) {
            expandedForShare[id] = state;
          }
        }
      }

      // Get ordered link IDs for the category being shared
      const data = load();
      const orderedIds = data.linkOrder || [];
      let linkOrderForShare = orderedIds;
      if (shareCategory) {
        const categoryLinks = getAllLinks().filter(l => l.category === shareCategory);
        const categoryIds = new Set(categoryLinks.map(l => l.id));
        linkOrderForShare = orderedIds.filter(id => categoryIds.has(id));
      }

      const payload = {
        user_id: currentUser.id,
        category: shareCategory || null,
        visibility,
        update_mode: updateMode,
        snapshot_link_ids: snapshotIds,
        expanded_cards: expandedForShare,
        link_order: linkOrderForShare,
        owner_email: currentUser.email,
        updated_at: new Date().toISOString()
      };

      let res;
      if (currentShare) {
        // Update existing
        res = await fetch(
          `${SUPABASE_URL}/rest/v1/shared_boards?id=eq.${currentShare.id}`,
          {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${accessToken}`,
              'Prefer': 'return=representation'
            },
            body: JSON.stringify(payload)
          }
        );
      } else {
        // Create new - generate slug
        const slug = Math.random().toString(36).substring(2, 10);
        payload.slug = slug;

        res = await fetch(
          `${SUPABASE_URL}/rest/v1/shared_boards`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${accessToken}`,
              'Prefer': 'return=representation'
            },
            body: JSON.stringify(payload)
          }
        );
      }

      if (res.ok) {
        const data = await res.json();
        currentShare = Array.isArray(data) ? data[0] : data;
        showExistingShare(currentShare);
        toast(currentShare ? 'Share updated' : 'Share link created');
        loadAllShares(); // Refresh share status
      } else {
        const err = await res.text();
        console.error('[share] Failed:', res.status, err);
        toast('Failed to create share', true);
      }
    } catch (e) {
      console.error('[share] Error:', e);
      toast('Failed to create share', true);
    } finally {
      shareCreateBtn.disabled = false;
      shareCreateBtn.textContent = currentShare ? 'Update' : 'Create Share Link';
    }
  }

  async function forceSync() {
    console.log('[sync] === Starting Force Sync ===');

    // Prevent double-sync
    if (syncInProgress) {
      console.log('[sync] Already in progress, skipping');
      toast('Sync already in progress');
      return;
    }

    // Check login
    if (!currentUser) {
      console.log('[sync] Not logged in');
      toast('Login required to sync', true);
      return;
    }
    console.log('[sync] User:', currentUser.email);

    // Test Supabase connection with raw fetch first
    console.log('[sync] Testing raw fetch to Supabase...');
    try {
      const testStart = performance.now();
      const res = await fetch(`${SUPABASE_URL}/rest/v1/links?select=id&limit=1`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      const data = await res.json();
      console.log(`[sync] Raw fetch: ${(performance.now() - testStart).toFixed(0)}ms`, res.status, data);
      if (!res.ok) {
        toast('Supabase error: ' + res.status, true);
        return;
      }
    } catch (e) {
      console.error('[sync] Raw fetch failed:', e);
      toast('Cannot reach Supabase: ' + e.message, true);
      return;
    }

    // Get local data
    const local = load();
    console.log('[sync] Local links:', local.links.length);

    if (local.links.length === 0) {
      toast('No links to sync');
      return;
    }

    // Get user's access token directly from localStorage (Supabase client hangs)
    console.log('[sync] Getting access token from localStorage...');
    let accessToken = null;
    try {
      const storageKey = 'sb-yfhudwakpgzswiylhfbh-auth-token';
      const stored = localStorage.getItem(storageKey);
      if (stored) {
        const parsed = JSON.parse(stored);
        accessToken = parsed.access_token;
        console.log('[sync] Got access token from localStorage');
      }
    } catch (e) {
      console.error('[sync] Failed to get token:', e);
    }

    if (!accessToken) {
      console.error('[sync] No access token found');
      toast('Session expired - please login again', true);
      return;
    }

    syncInProgress = true;

    let uploaded = 0;
    let failed = 0;
    const errors = [];

    // Upload each link
    for (let i = 0; i < local.links.length; i++) {
      const link = local.links[i];
      console.log(`[sync] Uploading ${i + 1}/${local.links.length}: ${link.url}`);

      try {
        const payload = {
          id: link.id,
          user_id: currentUser.id,
          url: link.url,
          title: link.title || null,
          description: link.description || null,
          image: link.image || null,
          domain: link.domain || null,
          category: link.category || 'uncategorized',
          confidence: link.confidence || 0,
          created_at: link.addedAt || new Date().toISOString(),
          updated_at: link.updatedAt || null
        };
        console.log('[sync] Payload:', JSON.stringify(payload).substring(0, 200));

        // Use raw fetch instead of Supabase client (client hangs)
        console.log('[sync] Uploading via fetch...');
        const res = await fetch(`${SUPABASE_URL}/rest/v1/links`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${accessToken}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errText = await res.text();
          console.error('[sync] Upload failed:', res.status, errText);
          failed++;
          errors.push(`${link.url}: ${res.status}`);
        } else {
          console.log('[sync] Success:', res.status);
          uploaded++;
        }
      } catch (e) {
        console.error('[sync] Exception:', e.message);
        failed++;
        errors.push(`${link.url}: ${e.message}`);
      }
    }

    // Sync link order via fetch too
    console.log('[sync] Syncing link order...');
    try {
      const orderPayload = { user_id: currentUser.id, order_ids: local.linkOrder };
      await fetch(`${SUPABASE_URL}/rest/v1/link_order`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`,
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify(orderPayload)
      });
      console.log('[sync] Order synced');
    } catch (e) {
      console.error('[sync] Order sync failed:', e);
    }

    // Done
    syncInProgress = false;

    console.log(`[sync] === Complete: ${uploaded} uploaded, ${failed} failed ===`);
    if (errors.length > 0) {
      console.log('[sync] Errors:', errors);
    }

    toast(`Synced: ${uploaded} ok, ${failed} failed`);
  }

  let authCountdownInterval = null;

  function clearAuthCountdown() {
    if (authCountdownInterval) {
      clearInterval(authCountdownInterval);
      authCountdownInterval = null;
    }
  }

  function startAuthCountdown(seconds) {
    clearAuthCountdown();
    authSubmit.disabled = true;

    let remaining = seconds;
    authStatus.textContent = `Wait ${remaining}s`;
    authStatus.className = 'auth-modal__status auth-modal__status--error';

    authCountdownInterval = setInterval(() => {
      remaining--;
      if (remaining > 0) {
        authStatus.textContent = `Wait ${remaining}s`;
      } else {
        clearAuthCountdown();
        authStatus.textContent = 'Try again';
        authStatus.className = 'auth-modal__status';
        authSubmit.disabled = false;
      }
    }, 1000);
  }

  async function handleLogin(email) {
    clearAuthCountdown();
    authSubmit.disabled = true;
    authStatus.textContent = 'Sending magic link...';
    authStatus.className = 'auth-modal__status';

    try {
      const redirectUrl = window.location.origin + window.location.pathname;
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: redirectUrl
        }
      });

      if (error) throw error;

      authStatus.textContent = 'Check your email for the magic link!';
      authEmail.value = '';
      authSubmit.disabled = false;
    } catch (e) {
      const msg = e.message || 'Failed to send magic link';

      // Check for rate limit / security cooldown (e.g., "...after 45 seconds")
      const secMatch = msg.match(/after\s+(\d+)\s+second/i);
      if (secMatch) {
        const waitSecs = parseInt(secMatch[1], 10);
        startAuthCountdown(waitSecs);
      } else {
        authStatus.textContent = msg;
        authStatus.className = 'auth-modal__status auth-modal__status--error';
        authSubmit.disabled = false;
      }
    }
  }

  async function handleLogout() {
    await supabase.auth.signOut();
    currentUser = null;
    updateAuthUI();
    toast('Logged out');
  }

  async function onAuthStateChange(event, session) {
    console.log('[auth] onAuthStateChange:', event, session?.user?.email || 'no user');
    const wasLoggedOut = !currentUser;
    currentUser = session?.user || null;
    updateAuthUI();

    if (currentUser && wasLoggedOut) {
      // Just logged in - close modal and sync
      authModal.classList.remove('auth-modal--visible');
      toast('Logged in as ' + currentUser.email);

      // Check for local data to migrate
      const localData = load();
      if (localData.links.length > 0) {
        await migrateLocalToSupabase();
      }

      // Fetch from Supabase and update local cache
      const cloudData = await fetchFromSupabase();
      if (cloudData) {
        save({ links: cloudData.links, categories: cloudData.categories, linkOrder: cloudData.linkOrder });
        expandedCards = cloudData.expanded;
        localStorage.setItem(EXPANDED_KEY, JSON.stringify(expandedCards));
        renderFilters();
        renderGrid();
      }
    }
  }

  async function init() {
    const initStart = performance.now();

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.classList.add('light');
    }

    // Validate saved filter still exists
    if (currentFilter !== 'all') {
      const cats = getCategories();
      const links = getAllLinks();
      const validCategories = new Set(['all', ...Object.keys(cats), ...links.map(l => l.category)]);
      if (!validCategories.has(currentFilter)) {
        currentFilter = 'all';
        localStorage.setItem(FILTER_KEY, 'all');
      }
    }

    // Stale-while-revalidate: render from localStorage immediately
    renderFilters();
    renderGrid();
    console.log(`[perf] Initial render: ${(performance.now() - initStart).toFixed(0)}ms`);

    // Listen for auth changes
    supabase.auth.onAuthStateChange(onAuthStateChange);

    // Check if this is a magic link callback (has tokens in hash)
    const hash = window.location.hash;
    console.log('[auth] hash:', hash ? 'present' : 'none');
    if (hash.includes('access_token') || hash.includes('error')) {
      console.log('[auth] Magic link callback detected, waiting for Supabase...');
      // Don't clear hash - let Supabase handle it
    }

    // Revalidate: check session from localStorage (Supabase client hangs)
    const t1 = performance.now();
    const session = getStoredSession();
    console.log(`[perf] getSession: ${(performance.now() - t1).toFixed(0)}ms`);
    console.log('[auth] session:', session ? session.user.email : 'none');

    if (session) {
      currentUser = session.user;
      updateAuthUI();
      loadAllShares(); // Load user's shared boards

      // Fetch from Supabase and update if different
      const t2 = performance.now();
      const cloudData = await fetchFromSupabase();
      console.log(`[perf] fetchFromSupabase: ${(performance.now() - t2).toFixed(0)}ms`);

      if (cloudData) {
        const localData = load();
        console.log('[sync] cloud:', cloudData.links.length, 'links, local:', localData.links.length, 'links');

        // Always update from cloud (source of truth)
        save({ links: cloudData.links, categories: cloudData.categories, linkOrder: cloudData.linkOrder });
        expandedCards = cloudData.expanded;
        localStorage.setItem(EXPANDED_KEY, JSON.stringify(expandedCards));
        renderFilters();
        renderGrid();
        console.log('[sync] Updated from cloud');
      } else {
        console.log('[sync] No cloud data returned');
      }
    }

    console.log(`[perf] Total init: ${(performance.now() - initStart).toFixed(0)}ms`);

    // Re-check uncategorized items on load
    recategorizeUncategorized();

    // Check clipboard for URLs
    checkClipboardForUrls();

    // Start polling for cross-device sync (every 30s)
    startPolling();
  }

  // Polling for cross-device sync
  let pollingInterval = null;
  const POLL_INTERVAL = 30000; // 30 seconds

  function startPolling() {
    if (pollingInterval) return;
    pollingInterval = setInterval(pollForChanges, POLL_INTERVAL);
    console.log('[poll] Started polling every 30s');
  }

  function stopPolling() {
    if (pollingInterval) {
      clearInterval(pollingInterval);
      pollingInterval = null;
      console.log('[poll] Stopped polling');
    }
  }

  async function pollForChanges() {
    if (!currentUser) return;

    const cloudData = await fetchFromSupabase();
    if (!cloudData) return;

    const localData = load();
    const localIds = new Set(localData.links.map(l => l.id));
    const cloudIds = new Set(cloudData.links.map(l => l.id));

    // Find new items from cloud
    const newIds = cloudData.links
      .filter(l => !localIds.has(l.id))
      .map(l => l.id);

    // Find deleted items (in local but not cloud)
    const deletedIds = localData.links
      .filter(l => !cloudIds.has(l.id))
      .map(l => l.id);

    // Check for any changes
    const hasChanges = newIds.length > 0 || deletedIds.length > 0 ||
      cloudData.links.length !== localData.links.length;

    if (hasChanges) {
      console.log(`[poll] Changes detected: +${newIds.length} new, -${deletedIds.length} deleted`);

      // Save the new data
      save({ links: cloudData.links, categories: cloudData.categories, linkOrder: cloudData.linkOrder });
      expandedCards = cloudData.expanded;
      localStorage.setItem(EXPANDED_KEY, JSON.stringify(expandedCards));

      // Re-render with animation for new items
      renderFilters();
      renderGrid(newIds);

      if (newIds.length > 0) {
        toast(`${newIds.length} new link${newIds.length > 1 ? 's' : ''} synced`);
      }
    }
  }

  async function checkClipboardForUrls() {
    try {
      const text = await navigator.clipboard.readText();
      const urls = extractUrls(text);
      if (urls.length > 0) {
        // Check if these URLs are already saved
        const newUrls = urls.filter(url => !findByUrl(url));
        if (newUrls.length > 0) {
          showClipboardPrompt(newUrls, text);
        }
      }
    } catch (e) {
      // Permission denied or not supported - that's fine
    }
  }

  function showClipboardPrompt(urls, originalText) {
    const existing = document.querySelector('.clipboard-prompt');
    if (existing) existing.remove();

    const prompt = document.createElement('div');
    prompt.className = 'clipboard-prompt';
    const count = urls.length;
    const preview = urls[0].replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
    prompt.innerHTML = `
      <span class="clipboard-prompt__text">${count === 1 ? preview : count + ' links'} in clipboard</span>
      <button class="clipboard-prompt__btn clipboard-prompt__btn--add">Add</button>
      <button class="clipboard-prompt__btn clipboard-prompt__btn--dismiss">✕</button>
    `;

    prompt.querySelector('.clipboard-prompt__btn--add').onclick = () => {
      prompt.remove();
      processLinks(originalText);
    };
    prompt.querySelector('.clipboard-prompt__btn--dismiss').onclick = () => {
      prompt.remove();
    };

    document.body.appendChild(prompt);

    // Auto-dismiss after 10 seconds
    setTimeout(() => prompt.remove(), 10000);
  }

  init();

  // Listen for paste anywhere on page
  document.addEventListener('paste', (e) => {
    // Don't intercept if pasting into textarea/input
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

    const text = e.clipboardData.getData('text');
    if (text && extractUrls(text).length > 0) {
      e.preventDefault();
      processLinks(text);
    }
  });

})();
  </script>
</body>
