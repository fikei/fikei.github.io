<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<meta name="description" content="Pick the house massage day with Didi. Tap the dates that work for you.">
<title>Massage day · Agape</title>
<style>
  :root {
    --bg: #0d0d10;
    --surface: #17171c;
    --surface-2: #1f1f26;
    --border: #2b2b34;
    --text: #ececf1;
    --text-dim: #8b8b98;
    --accent: #f5c542;
    --accent-dim: #8a6f25;
    --can: #4ade80;
    --can-bg: #12301d;
    --maybe: #fbbf24;
    --maybe-bg: #33280b;
    --no: #f87171;
    --no-bg: #331616;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.35;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 48px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 800; color: var(--accent); }
  .saved { font-size: 12px; color: var(--text-dim); min-height: 1em; transition: opacity .3s; }
  .saved.err { color: var(--no); }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; }
  .notice {
    background: var(--maybe-bg); color: var(--maybe); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; margin-bottom: 12px;
  }
  .notice[hidden] { display: none; }

  .name-row { margin-bottom: 12px; }
  .name-row input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; color: var(--text); font-size: 16px;
  }
  .name-row input:focus { outline: none; border-color: var(--accent-dim); }
  .name-row input.want { border-color: var(--accent); animation: nudge .3s; }
  @keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; flex-wrap: wrap; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile {
    position: relative; display: flex; align-items: stretch;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    min-height: 58px;
  }
  .tile .cycle { flex: 1; text-align: left; padding: 8px 10px; display: flex; flex-direction: column; justify-content: center; }
  .tile .d { font-weight: 700; font-size: 15px; }
  .tile .w { font-size: 12px; color: var(--text-dim); }
  .tile .s { font-size: 12px; font-weight: 700; margin-top: 2px; color: var(--text-dim); }
  .tile[data-v="can"] { background: var(--can-bg); border-color: var(--can); }
  .tile[data-v="can"] .s { color: var(--can); }
  .tile[data-v="maybe"] { background: var(--maybe-bg); border-color: var(--maybe); }
  .tile[data-v="maybe"] .s { color: var(--maybe); }
  .tile[data-v="no"] { background: var(--no-bg); border-color: var(--no); }
  .tile[data-v="no"] .s { color: var(--no); }
  .tile .star {
    width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 20px; color: var(--border); border-left: 1px solid rgba(255,255,255,.06);
  }
  .tile .star small { font-size: 10px; font-weight: 700; color: var(--text-dim); }
  .tile .star.on { color: var(--accent); }
  .tile .star.on small { color: var(--accent); }
  .tile .star:disabled { opacity: .35; cursor: default; }

  .slots { grid-template-columns: 1fr 1fr 1fr; }
  .slots .tile { min-height: 52px; }

  h2 { font-size: 15px; font-weight: 700; margin: 24px 0 8px; }
  .count-line { color: var(--text-dim); font-size: 12px; font-weight: 400; }
  .res { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .res li {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px;
  }
  .res .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .res .when { font-weight: 700; }
  .res .nums { font-size: 13px; white-space: nowrap; }
  .res .nums .c { color: var(--can); }
  .res .nums .m { color: var(--maybe); }
  .res .bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--surface-2); margin: 6px 0 4px; }
  .res .bar i { display: block; }
  .res .bar .c { background: var(--can); }
  .res .bar .m { background: var(--maybe); }
  .res .who { font-size: 12px; color: var(--text-dim); }
  .res .who .out { color: var(--no); }
  .res .pick { margin-top: 6px; font-size: 12px; color: var(--accent); text-decoration: underline; }
  .res li.lead { border-color: var(--accent-dim); }
  .empty { color: var(--text-dim); font-size: 13px; }
  .chosen {
    background: var(--can-bg); border: 1px solid var(--can); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 12px;
  }
  .chosen b { color: var(--can); }
  .admin-row { margin-top: 16px; font-size: 12px; color: var(--text-dim); }
  .admin-row button { text-decoration: underline; color: var(--accent); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Massage day</h1>
    <span class="saved" id="saved" aria-live="polite"></span>
  </header>
  <p class="sub" id="sub">Didi is coming to the house. Tap each date: can, maybe or no. Star your first and second pick.</p>
  <p class="notice" id="notice" hidden></p>

  <div class="name-row">
    <input id="name" type="text" autocomplete="given-name" autocapitalize="words" enterkeyhint="done"
           placeholder="Your name" aria-label="Your name" maxlength="40">
  </div>

  <section id="vote"></section>

  <h2 id="results-title">The house so far <span class="count-line" id="count-line"></span></h2>
  <ul class="res" id="results"></ul>

  <p class="admin-row" id="admin-row" hidden></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="massage.js?v=1.0.0"></script>
</body>
</html>
