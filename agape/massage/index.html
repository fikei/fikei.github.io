<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="description" content="Pick the house massage day with Didi. Tap the dates that work for you.">
<title>Massage day · Agape</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<script>
  // Sassy CTRL is dark-first; `:root.light` flips it. This page follows the phone's setting.
  (function () {
    var mq = window.matchMedia && matchMedia('(prefers-color-scheme: light)');
    var set = function () {
      var light = !!(mq && mq.matches);
      document.documentElement.classList.toggle('light', light);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = light ? '#faf9f7' : '#111110';
    };
    set();
    if (mq && mq.addEventListener) mq.addEventListener('change', set);
    document.addEventListener('DOMContentLoaded', set);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-system/tokens.css">
<link rel="stylesheet" href="/design-system/components.css">
<style>
  /* Agape massage poll on Sassy CTRL (tokens.css + components.css).
     No hierarchy: one font, one size (--text-base), one weight, sentence case. The only thing that
     varies is a date's state on the Can do · Possible · Can't scale, said in words on every row
     and carried by its border (solid green, dashed amber, quiet grey). */
  :root {
    --mp-can: var(--accent-green);
    --mp-maybe: var(--accent-amber);
    --mp-cant: var(--fg-muted);
    --mp-no: var(--color-error);
    --mp-row-h: var(--space-12);
    --mp-col: 30rem;
  }
  :root.light {
    --mp-can: #1f7a10;
    --mp-maybe: #b86e00;
  }

  html, body { background: var(--bg); color: var(--fg); }
  body, body * {
    font-family: var(--font-primary);
    font-size: var(--text-base);
    font-weight: 400;
    font-style: normal;
    letter-spacing: 0;
    text-transform: none;
  }
  body { line-height: var(--leading-tight); -webkit-tap-highlight-color: transparent; }
  body .btn, body .input { font-size: var(--text-base); text-transform: none; letter-spacing: 0; }
  button { color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, .input:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-ring-offset); }

  /* ---------- Bar: name of the page and the saved mark, nothing louder than the rows ---------- */
  .appbar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    min-height: var(--mp-row-h);
    padding: env(safe-area-inset-top, 0) max(var(--space-4), calc((100% - var(--mp-col)) / 2 + var(--space-4))) 0;
    border-bottom: var(--border-thin) solid var(--border-subtle);
  }
  .appbar__title { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .appbar__sub { color: var(--fg-muted); }
  .saved { color: var(--mp-can); white-space: nowrap; opacity: 0; transition: opacity var(--duration-slower) var(--ease-default); }
  .saved.err { color: var(--mp-no); }

  /* ---------- Page and beats ---------- */
  main {
    max-width: var(--mp-col); margin: 0 auto;
    padding: var(--space-3) var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom, 0));
  }
  .beat { display: none; flex-direction: column; gap: var(--space-3); }
  body[data-beat="dates"] .beat--dates,
  body[data-beat="name"] .beat--name,
  body[data-beat="results"] .beat--results { display: flex; }
  .sub, .legend, .hint { color: var(--fg-muted); line-height: var(--leading-normal); }
  .legend.is-off { opacity: 0.5; }

  /* ---------- The scale: one row per date ---------- */
  .list { display: flex; flex-direction: column; gap: var(--space-1); }
  .tile {
    display: flex; align-items: stretch;
    border: var(--border-thin) solid var(--border-subtle);
    transition: border-color var(--duration-normal);
  }
  .tile .cycle {
    flex: 1; min-width: 0; min-height: var(--mp-row-h);
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding: 0 var(--space-3); text-align: left;
  }
  .tile .l { display: flex; gap: var(--space-2); min-width: 0; }
  .tile .w { color: var(--fg-muted); }
  .tile .s { color: var(--mp-cant); white-space: nowrap; }
  .tile[data-v="can"] { border-color: var(--mp-can); }
  .tile[data-v="can"] .s { color: var(--mp-can); }
  .tile[data-v="maybe"] { border-color: var(--mp-maybe); border-style: dashed; }
  .tile[data-v="maybe"] .s { color: var(--mp-maybe); }
  .tile .star {
    width: var(--mp-row-h); flex: 0 0 var(--mp-row-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: var(--leading-none); color: var(--fg-muted);
    border-left: var(--border-thin) solid var(--border-subtle);
  }
  .tile .star.on { color: var(--mp-maybe); }

  /* Hours grid (organizer phase 2) */
  .grid.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-1); }
  .chosen { color: var(--fg-muted); }
  .chosen b { color: var(--fg); }

  /* ---------- Actions: CTRL .btn at the page size, sentence case ---------- */
  /* One primary per beat: "Next", full width of the column. Back is a quiet link under it. */
  .actions { display: flex; flex-direction: column; align-items: stretch; gap: var(--space-1); }
  .actions .btn { width: 100%; min-height: var(--mp-row-h); padding: 0 var(--space-4); }
  .actions .link { align-self: flex-start; }
  .btn:disabled, .btn:disabled:hover { opacity: 0.35; background: transparent; color: var(--fg); cursor: default; }
  .link { color: var(--fg-muted); text-decoration: underline; text-underline-offset: 3px; padding: var(--space-2) 0; }
  .link[hidden] { display: none; }

  /* ---------- Name ---------- */
  .name-row .input { min-height: var(--mp-row-h); border-color: var(--border-subtle); background: var(--bg); }
  .name-row .input:focus { box-shadow: none; border-color: var(--fg); }
  .name-row .input.want { border-color: var(--mp-no); animation: nudge .3s; }
  @keyframes nudge { 25% { transform: translateX(calc(-1 * var(--space-1))); } 75% { transform: translateX(var(--space-1)); } }
  label[for="name"] { line-height: var(--leading-normal); }

  /* ---------- Results ---------- */
  .notice { color: var(--mp-maybe); border: var(--border-thin) dashed var(--mp-maybe); padding: var(--space-2) var(--space-3); line-height: var(--leading-normal); }
  .notice[hidden] { display: none; }
  body.no-poll .beat { display: none; }
  #missing { margin-bottom: var(--space-3); }
  .res { list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }
  .res li { border: var(--border-thin) solid var(--border-subtle); padding: var(--space-3); }
  .res .top { display: flex; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; }
  .res .nums { color: var(--fg-muted); white-space: nowrap; }
  .res .nums .c { color: var(--mp-can); }
  .res .nums .m { color: var(--mp-maybe); }
  .res .bar { display: flex; height: var(--space-1); overflow: hidden; background: var(--border-subtle); margin: var(--space-2) 0; }
  .res .bar i { display: block; }
  .res .bar .c { background: var(--mp-can); }
  .res .bar .m { background: var(--mp-maybe); }
  .res .who { color: var(--fg-muted); line-height: var(--leading-normal); }
  .res .pick, .admin-row button { margin-top: var(--space-2); padding: var(--space-2) var(--space-3); border: var(--border-thin) solid var(--border); }
  .res .pick:hover, .admin-row button:hover { background: var(--fg); color: var(--bg); }
  .res li.empty { color: var(--fg-muted); border-style: dashed; }
  .me-line { color: var(--fg-muted); display: flex; gap: var(--space-2); align-items: baseline; flex-wrap: wrap; }
  .me-line b { color: var(--fg); }
  .admin-row { color: var(--fg-muted); line-height: var(--leading-normal); }
  .admin-row[hidden] { display: none; }
</style>
</head>
<body data-beat="name">
<header class="appbar">
  <h1 class="appbar__title"><span id="title">Massage day</span> <span class="appbar__sub" id="subtitle">· Agape, with Didi</span></h1>
  <span class="saved" id="saved" aria-live="polite"></span>
</header>
<main>
  <p class="notice" id="missing" hidden>There’s no poll at this link yet. Check the link you were sent.</p>

  <!-- Beat 1: who's voting -->
  <section class="beat beat--name" aria-label="Your name">
    <label for="name">Who’s voting?</label>
    <div class="name-row">
      <input id="name" class="input" type="text" autocomplete="given-name" autocapitalize="words" enterkeyhint="next"
             placeholder="Your name" maxlength="40">
    </div>
    <button class="link" id="not-you" type="button" hidden>Not you?</button>
    <div class="actions">
      <button class="btn btn--filled btn--block" id="continue" type="button">Next</button>
    </div>
  </section>

  <!-- Beat 2: day preferences -->
  <section class="beat beat--dates" aria-label="Dates">
    <p class="sub" id="sub">Didi is coming to the house. Tap a date: Can do, then Possible, then back to Can’t.</p>
    <div id="vote"></div>
    <div class="actions">
      <button class="btn btn--filled btn--block" id="save" type="button" disabled>Next</button>
      <button class="link" id="back" type="button">Back</button>
    </div>
  </section>

  <!-- Beat 3: the house -->
  <section class="beat beat--results" aria-label="Results">
    <p class="me-line">Saved for <b id="me-name"></b> <button class="link" id="edit" type="button">Change my answers</button></p>
    <p class="notice" id="notice" hidden></p>
    <p id="results-title">The house so far <span class="count-line" id="count-line"></span></p>
    <ul class="res" id="results"></ul>
    <p class="admin-row" id="admin-row" hidden></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="massage.js?v=3.0.0"></script>
</body>
</html>
