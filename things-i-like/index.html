<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Things I Like</title>
  <style>
/* ============================================
   Things I Like - Swiss Grid + Web 1.0 Typography
   ============================================ */

:root {
  /* Typography - Web 1.0 choices */
  --font-serif: Georgia, "Times New Roman", Times, serif;
  --font-mono: "Courier New", Courier, monospace;
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;
  --line-height-tight: 1.2;
  --line-height-normal: 1.6;

  /* Colors - B&W only */
  --black: #000;
  --white: #fff;
  --gray-light: #e0e0e0;
  --gray-mid: #888;
  --gray-dark: #333;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* Grid */
  --grid-gap: 16px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
}

body {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
  color: var(--black);
  background: var(--white);
}

/* ============================================
   Header
   ============================================ */
.header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: var(--space-6) var(--space-4);
  border-bottom: 1px solid var(--black);
}

.header__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-xl);
  font-weight: normal;
  font-style: italic;
  letter-spacing: -0.02em;
}

.header__add-btn {
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  padding: var(--space-2) var(--space-4);
  background: var(--black);
  color: var(--white);
  border: none;
  cursor: pointer;
}

.header__add-btn:hover {
  text-decoration: underline;
}

/* ============================================
   Filters
   ============================================ */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-4);
  border-bottom: 1px solid var(--gray-light);
  position: sticky;
  top: 0;
  background: var(--white);
  z-index: 10;
}

.filter-token {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: var(--space-1) var(--space-3);
  background: var(--white);
  color: var(--black);
  border: 1px solid var(--black);
  cursor: pointer;
}

.filter-token:hover {
  text-decoration: underline;
}

.filter-token--active {
  background: var(--black);
  color: var(--white);
}

/* ============================================
   Grid
   ============================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--grid-gap);
  padding: var(--space-4);
}

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}

/* ============================================
   Grid Item
   ============================================ */
.grid-item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  background: var(--gray-light);
  border: 1px solid var(--black);
}

.grid-item__image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(1.1);
  transition: filter 0.2s;
}

.grid-item:hover .grid-item__image {
  filter: grayscale(0%);
}

.grid-item__overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: var(--space-3);
  background: var(--white);
  border-top: 1px solid var(--black);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__overlay {
  opacity: 1;
}

@media (hover: none) {
  .grid-item__overlay {
    opacity: 1;
    padding: var(--space-2);
  }
}

.grid-item__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-sm);
  font-weight: normal;
  line-height: var(--line-height-tight);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-item__domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--gray-mid);
  margin-top: 2px;
  text-decoration: underline;
}

.grid-item__category {
  position: absolute;
  top: 0;
  left: 0;
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 2px 6px;
  background: var(--white);
  border-right: 1px solid var(--black);
  border-bottom: 1px solid var(--black);
}

/* Placeholder */
.grid-item--placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--black);
}

.grid-item--placeholder .grid-item__initial {
  font-family: var(--font-serif);
  font-size: var(--font-size-2xl);
  font-style: italic;
  color: var(--white);
}

/* ============================================
   Empty State
   ============================================ */
.empty-state {
  grid-column: 1 / -1;
  padding: var(--space-8) var(--space-4);
  text-align: center;
}

.empty-state__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-lg);
  font-style: italic;
  margin-bottom: var(--space-2);
}

.empty-state__text {
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  color: var(--gray-mid);
}

/* ============================================
   Modal
   ============================================ */
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0.15s;
}

.modal--visible {
  opacity: 1;
  visibility: visible;
}

.modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

.modal__content {
  position: relative;
  width: calc(100% - 32px);
  max-width: 480px;
  max-height: calc(100vh - 32px);
  background: var(--white);
  border: 2px solid var(--black);
  overflow-y: auto;
}

.modal--small .modal__content {
  max-width: 300px;
}

.modal__header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: var(--space-4);
  border-bottom: 1px solid var(--black);
}

.modal__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
  font-style: italic;
}

.modal__close {
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.modal__close:hover {
  text-decoration: underline;
}

/* ============================================
   Add Form
   ============================================ */
.add-form {
  padding: var(--space-4);
}

.add-form__input {
  width: 100%;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  border: 1px solid var(--black);
  resize: vertical;
}

.add-form__input:focus {
  outline: 2px solid var(--black);
  outline-offset: 1px;
}

.add-form__status {
  min-height: 20px;
  padding: var(--space-2) 0;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.add-form__status--error {
  font-weight: bold;
}

.add-form__submit {
  width: 100%;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: var(--black);
  color: var(--white);
  border: 2px solid var(--black);
  cursor: pointer;
}

.add-form__submit:hover {
  background: var(--white);
  color: var(--black);
  text-decoration: underline;
}

/* ============================================
   Overlay (Detail View)
   ============================================ */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0.15s;
}

.overlay--visible {
  opacity: 1;
  visibility: visible;
}

.overlay__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
}

.overlay__content {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--white);
}

@media (min-width: 900px) {
  .overlay__content {
    max-width: 560px;
    margin: var(--space-8) auto;
    height: auto;
    max-height: calc(100vh - 64px);
    border: 2px solid var(--black);
  }
}

.overlay__close {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  z-index: 10;
  width: 32px;
  height: 32px;
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  background: var(--white);
  border: 1px solid var(--black);
  cursor: pointer;
}

.overlay__image {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  filter: grayscale(100%);
  border-bottom: 1px solid var(--black);
}

.overlay__details {
  flex: 1;
  padding: var(--space-6);
  overflow-y: auto;
}

.overlay__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-xl);
  font-weight: normal;
  line-height: var(--line-height-tight);
  margin-bottom: var(--space-2);
}

.overlay__domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gray-mid);
  text-decoration: underline;
  margin-bottom: var(--space-4);
}

.overlay__description {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
  margin-bottom: var(--space-6);
}

.overlay__meta {
  display: flex;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.overlay__category {
  padding: 2px 8px;
  background: var(--black);
  color: var(--white);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.overlay__date {
  color: var(--gray-mid);
}

.overlay__actions {
  display: flex;
  gap: var(--space-2);
}

.overlay__link,
.overlay__action {
  flex: 1;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  text-align: center;
  text-decoration: none;
  border: 1px solid var(--black);
  background: var(--white);
  color: var(--black);
  cursor: pointer;
}

.overlay__link:hover,
.overlay__action:hover {
  background: var(--black);
  color: var(--white);
}

.overlay__action--danger {
  border-color: var(--gray-mid);
  color: var(--gray-mid);
}

/* ============================================
   Category List
   ============================================ */
.category-list {
  padding: var(--space-2);
}

.category-list__item {
  display: block;
  width: 100%;
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  text-align: left;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: none;
  border: none;
  border-bottom: 1px solid var(--gray-light);
  cursor: pointer;
}

.category-list__item:hover {
  background: var(--gray-light);
  text-decoration: underline;
}

.category-list__item--active {
  font-weight: bold;
}

/* ============================================
   Toast
   ============================================ */
.toast-container {
  position: fixed;
  bottom: var(--space-4);
  left: var(--space-4);
  right: var(--space-4);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  pointer-events: none;
}

.toast {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  padding: var(--space-3);
  background: var(--black);
  color: var(--white);
  border: 1px solid var(--black);
  pointer-events: auto;
}

.toast--error {
  background: var(--white);
  color: var(--black);
  border: 2px solid var(--black);
}
  </style>
</head>
<body>
  <header class="header">
    <h1 class="header__title">Things I Like</h1>
    <button class="header__add-btn" id="addBtn">+</button>
  </header>

  <nav class="filters" id="filters">
    <button class="filter-token filter-token--active" data-category="all">All</button>
  </nav>

  <main class="grid" id="grid"></main>

  <!-- Add Modal -->
  <div class="modal" id="addModal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__content">
      <div class="modal__header">
        <h2 class="modal__title">Add Links</h2>
        <button class="modal__close" data-close>&times;</button>
      </div>
      <form id="addForm" class="add-form">
        <textarea id="linkInput" class="add-form__input" placeholder="https://example.com

Paste one or many links. Notes are ignored." rows="6"></textarea>
        <div class="add-form__status" id="formStatus"></div>
        <button type="submit" class="add-form__submit">Add</button>
      </form>
    </div>
  </div>

  <!-- Detail Overlay -->
  <div class="overlay" id="overlay">
    <div class="overlay__backdrop" data-close></div>
    <div class="overlay__content">
      <button class="overlay__close" data-close>&times;</button>
      <img class="overlay__image" id="overlayImage" src="" alt="">
      <div class="overlay__details">
        <h2 class="overlay__title" id="overlayTitle"></h2>
        <p class="overlay__domain" id="overlayDomain"></p>
        <p class="overlay__description" id="overlayDescription"></p>
        <div class="overlay__meta">
          <span class="overlay__category" id="overlayCategory"></span>
          <span class="overlay__date" id="overlayDate"></span>
        </div>
        <div class="overlay__actions">
          <a class="overlay__link" id="overlayLink" href="" target="_blank">Visit</a>
          <button class="overlay__action" id="overlayRecategorize">Move</button>
          <button class="overlay__action overlay__action--danger" id="overlayDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal modal--small" id="categoryModal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__content">
      <div class="modal__header">
        <h2 class="modal__title">Move to Category</h2>
        <button class="modal__close" data-close>&times;</button>
      </div>
      <div class="category-list" id="categoryList"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
// ============================================
// Things I Like - Single File App
// ============================================

(function() {
  'use strict';

  // ============================================
  // URL Parser
  // ============================================
  const URL_REGEX = /(?:https?:\/\/)?(?:www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&//=]*)/gi;

  function extractUrls(text) {
    if (!text) return [];
    const matches = text.match(URL_REGEX) || [];
    return matches.map(normalizeUrl).filter(Boolean).filter((u, i, a) => a.indexOf(u) === i);
  }

  function normalizeUrl(url) {
    if (!url) return null;
    let n = url.trim().toLowerCase();
    if (!n.startsWith('http://') && !n.startsWith('https://')) {
      n = 'https://' + n;
    }
    n = n.replace(/\/+$/, '');
    try { new URL(n); return n; } catch { return null; }
  }

  function extractDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
  }

  function generateId(url) {
    let h = 0;
    for (let i = 0; i < url.length; i++) {
      h = ((h << 5) - h) + url.charCodeAt(i);
      h = h & h;
    }
    return Math.abs(h).toString(36);
  }

  // ============================================
  // Metadata Fetcher
  // ============================================
  const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

  async function fetchMetadata(url) {
    const domain = extractDomain(url);
    const meta = { title: domain, description: '', image: null, domain };

    try {
      const res = await fetch(CORS_PROXY + encodeURIComponent(url));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();

      // Title
      const ogTitle = html.match(/<meta[^>]*property=["']og:title["'][^>]*content=["']([^"']*)["']/i) ||
                      html.match(/<meta[^>]*content=["']([^"']*)["'][^>]*property=["']og:title["']/i);
      const title = html.match(/<title[^>]*>([^<]*)<\/title>/i);
      if (ogTitle) meta.title = decodeEntities(ogTitle[1]);
      else if (title) meta.title = decodeEntities(title[1]);

      // Description
      const ogDesc = html.match(/<meta[^>]*property=["']og:description["'][^>]*content=["']([^"']*)["']/i) ||
                     html.match(/<meta[^>]*content=["']([^"']*)["'][^>]*property=["']og:description["']/i);
      const desc = html.match(/<meta[^>]*name=["']description["'][^>]*content=["']([^"']*)["']/i);
      if (ogDesc) meta.description = decodeEntities(ogDesc[1]);
      else if (desc) meta.description = decodeEntities(desc[1]);

      // Image
      const ogImg = html.match(/<meta[^>]*property=["']og:image["'][^>]*content=["']([^"']*)["']/i) ||
                    html.match(/<meta[^>]*content=["']([^"']*)["'][^>]*property=["']og:image["']/i);
      if (ogImg) {
        let img = ogImg[1];
        if (!img.startsWith('http')) {
          try { img = new URL(img, url).href; } catch {}
        }
        meta.image = img;
      }
    } catch (e) {
      console.warn('Fetch failed:', url, e.message);
      meta.title = generateTitleFromUrl(url);
    }

    return meta;
  }

  function decodeEntities(text) {
    const t = document.createElement('textarea');
    t.innerHTML = text;
    return t.value.trim();
  }

  function generateTitleFromUrl(url) {
    try {
      const u = new URL(url);
      const p = u.pathname.replace(/^\/|\/$/g, '').replace(/[-_]/g, ' ').replace(/\.[^.]+$/, '');
      if (p) return p.split('/').pop().replace(/\b\w/g, c => c.toUpperCase());
      return u.hostname.replace(/^www\./, '');
    } catch { return url; }
  }

  // ============================================
  // Categorizer
  // ============================================
  const PATTERNS = {
    media: {
      kw: ['video', 'music', 'podcast', 'youtube', 'spotify', 'album', 'song', 'movie', 'film', 'stream', 'listen', 'watch', 'playlist'],
      domains: ['youtube.com', 'youtu.be', 'spotify.com', 'soundcloud.com', 'vimeo.com', 'bandcamp.com', 'tiktok.com']
    },
    tools: {
      kw: ['app', 'software', 'tool', 'github', 'npm', 'library', 'framework', 'api', 'code', 'extension', 'plugin'],
      domains: ['github.com', 'gitlab.com', 'npmjs.com', 'producthunt.com']
    },
    places: {
      kw: ['restaurant', 'cafe', 'bar', 'hotel', 'travel', 'map', 'city', 'venue', 'shop', 'store', 'food', 'eat'],
      domains: ['yelp.com', 'tripadvisor.com', 'google.com/maps', 'airbnb.com']
    },
    people: {
      kw: ['profile', 'portfolio', 'about', 'bio', 'founder', 'creator', 'artist', 'designer', 'author', 'interview'],
      domains: ['linkedin.com', 'twitter.com', 'x.com', 'instagram.com', 'behance.net', 'dribbble.com']
    },
    ideas: {
      kw: ['article', 'essay', 'blog', 'opinion', 'thought', 'idea', 'research', 'paper', 'guide', 'tutorial', 'learn'],
      domains: ['medium.com', 'substack.com', 'wikipedia.org', 'news.ycombinator.com']
    }
  };

  function categorize(link) {
    const text = `${link.title} ${link.description} ${link.url}`.toLowerCase();
    let best = 'uncategorized', maxScore = 0;

    for (const [cat, p] of Object.entries(PATTERNS)) {
      let score = 0;
      for (const d of p.domains) if (link.domain.includes(d) || link.url.includes(d)) { score += 0.5; break; }
      for (const k of p.kw) if (text.includes(k)) score += 0.1;
      score = Math.min(score, 1);
      if (score > maxScore) { maxScore = score; best = cat; }
    }

    return { category: maxScore >= 0.4 ? best : 'uncategorized', confidence: maxScore };
  }

  function detectClusters(items) {
    if (!items || items.length < 3) return [];
    const domainGroups = {};
    for (const item of items) {
      const d = item.domain || 'unknown';
      if (!domainGroups[d]) domainGroups[d] = [];
      domainGroups[d].push(item);
    }
    const clusters = [];
    for (const [domain, list] of Object.entries(domainGroups)) {
      if (list.length >= 3) {
        clusters.push({ name: domain.split('.')[0], items: list });
      }
    }
    return clusters;
  }

  // ============================================
  // Storage
  // ============================================
  const STORAGE_KEY = 'things-i-like';

  function load() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) return JSON.parse(d);
    } catch {}
    return { links: [], categories: { uncategorized: { pinned: true } } };
  }

  function save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getAllLinks() { return load().links; }
  function getCategories() { return load().categories; }

  function findByUrl(url) {
    const n = url.toLowerCase().replace(/\/+$/, '');
    return getAllLinks().find(l => l.url.toLowerCase().replace(/\/+$/, '') === n);
  }

  function addLink(link) {
    if (findByUrl(link.url)) throw new Error('Link exists in ' + findByUrl(link.url).category);
    const data = load();
    data.links.push({ ...link, addedAt: new Date().toISOString() });
    if (!data.categories[link.category]) {
      data.categories[link.category] = { pinned: false };
    }
    save(data);
  }

  function updateLink(id, updates) {
    const data = load();
    const i = data.links.findIndex(l => l.id === id);
    if (i === -1) throw new Error('Not found');
    data.links[i] = { ...data.links[i], ...updates };
    if (updates.category && !data.categories[updates.category]) {
      data.categories[updates.category] = { pinned: false };
    }
    save(data);
  }

  function deleteLink(id) {
    const data = load();
    data.links = data.links.filter(l => l.id !== id);
    save(data);
  }

  function createCategory(name) {
    const data = load();
    const n = name.toLowerCase().replace(/\s+/g, '-');
    if (data.categories[n]) throw new Error('Category exists');
    data.categories[n] = { pinned: false };
    save(data);
    return n;
  }

  function bulkMove(ids, category) {
    const data = load();
    for (const id of ids) {
      const i = data.links.findIndex(l => l.id === id);
      if (i !== -1) data.links[i].category = category;
    }
    if (!data.categories[category]) data.categories[category] = { pinned: false };
    save(data);
  }

  // ============================================
  // App State
  // ============================================
  let currentFilter = 'all';
  let selectedLink = null;

  // ============================================
  // DOM
  // ============================================
  const $ = id => document.getElementById(id);
  const grid = $('grid');
  const filters = $('filters');
  const addModal = $('addModal');
  const addForm = $('addForm');
  const linkInput = $('linkInput');
  const formStatus = $('formStatus');
  const overlay = $('overlay');
  const categoryModal = $('categoryModal');
  const categoryList = $('categoryList');
  const toastContainer = $('toastContainer');

  // ============================================
  // Render
  // ============================================
  function renderFilters() {
    const cats = getCategories();
    const links = getAllLinks();
    const counts = { all: links.length };
    for (const l of links) counts[l.category] = (counts[l.category] || 0) + 1;

    let html = `<button class="filter-token ${currentFilter === 'all' ? 'filter-token--active' : ''}" data-category="all">All</button>`;

    const sorted = Object.entries(cats)
      .filter(([n]) => counts[n] > 0 || n === 'uncategorized')
      .sort((a, b) => (b[1].pinned ? 1 : 0) - (a[1].pinned ? 1 : 0) || (counts[b[0]] || 0) - (counts[a[0]] || 0));

    for (const [name] of sorted) {
      const c = counts[name] || 0;
      const active = currentFilter === name ? 'filter-token--active' : '';
      const badge = name === 'uncategorized' && c > 0 ? ` (${c})` : '';
      html += `<button class="filter-token ${active}" data-category="${name}">${cap(name)}${badge}</button>`;
    }

    filters.innerHTML = html;
  }

  function renderGrid() {
    const links = currentFilter === 'all' ? getAllLinks() : getAllLinks().filter(l => l.category === currentFilter);

    if (links.length === 0) {
      grid.innerHTML = `<div class="empty-state" id="emptyState" style="cursor:pointer"><h2 class="empty-state__title">Paste a link to begin</h2></div>`;
      $('emptyState').onclick = () => openModal(addModal);
      return;
    }

    const sorted = [...links].sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));
    let html = '';

    for (const l of sorted) {
      const hasImg = l.image && l.image.length > 0;
      const initial = l.title ? l.title.charAt(0).toUpperCase() : '?';

      if (hasImg) {
        html += `<article class="grid-item" data-id="${l.id}">
          <img class="grid-item__image" src="${l.image}" alt="" loading="lazy">
          <div class="grid-item__overlay"><h3 class="grid-item__title">${esc(l.title)}</h3><p class="grid-item__domain">${esc(l.domain)}</p></div>
          <span class="grid-item__category">${cap(l.category)}</span>
        </article>`;
      } else {
        html += `<article class="grid-item grid-item--placeholder" data-id="${l.id}">
          <span class="grid-item__initial">${initial}</span>
          <div class="grid-item__overlay"><h3 class="grid-item__title">${esc(l.title)}</h3><p class="grid-item__domain">${esc(l.domain)}</p></div>
          <span class="grid-item__category">${cap(l.category)}</span>
        </article>`;
      }
    }

    grid.innerHTML = html;
  }

  // ============================================
  // Events
  // ============================================
  $('addBtn').onclick = () => openModal(addModal);

  addForm.onsubmit = async (e) => {
    e.preventDefault();
    const text = linkInput.value.trim();
    if (!text) return;

    const urls = extractUrls(text);
    if (urls.length === 0) {
      showStatus('No valid URLs found', true);
      return;
    }

    showStatus(`Processing ${urls.length} link${urls.length > 1 ? 's' : ''}...`);
    let added = 0;

    for (const url of urls) {
      try {
        if (findByUrl(url)) { toast(`${extractDomain(url)} already exists`, true); continue; }
        const meta = await fetchMetadata(url);
        const cat = categorize(meta);
        addLink({ id: generateId(url), url, ...meta, category: cat.category, confidence: cat.confidence });
        added++;
      } catch (err) { toast(err.message, true); }
    }

    if (added > 0) {
      showStatus(`Added ${added} link${added > 1 ? 's' : ''}`);
      linkInput.value = '';
      renderFilters();
      renderGrid();
      checkClusters();
      setTimeout(() => { closeModal(addModal); showStatus(''); }, 800);
    }
  };

  filters.onclick = (e) => {
    const t = e.target.closest('.filter-token');
    if (t) {
      currentFilter = t.dataset.category;
      renderFilters();
      renderGrid();
    }
  };

  grid.onclick = (e) => {
    const item = e.target.closest('.grid-item');
    if (item) openDetail(item.dataset.id);
  };

  $('overlayRecategorize').onclick = () => { closeModal(overlay); openCategorySelect(); };
  $('overlayDelete').onclick = () => {
    if (!selectedLink) return;
    if (confirm('Delete this link?')) {
      deleteLink(selectedLink.id);
      closeModal(overlay);
      renderFilters();
      renderGrid();
      toast('Deleted');
    }
  };

  document.querySelectorAll('[data-close]').forEach(el => {
    el.onclick = (e) => {
      const m = e.target.closest('.modal, .overlay');
      if (m) closeModal(m);
    };
  });

  document.onkeydown = (e) => { if (e.key === 'Escape') closeAll(); };

  // ============================================
  // Helpers
  // ============================================
  function openModal(m) { m.classList.add('modal--visible', 'overlay--visible'); }
  function closeModal(m) { m.classList.remove('modal--visible', 'overlay--visible'); }
  function closeAll() { [addModal, overlay, categoryModal].forEach(closeModal); }

  function openDetail(id) {
    const l = getAllLinks().find(x => x.id === id);
    if (!l) return;
    selectedLink = l;
    $('overlayImage').src = l.image || '';
    $('overlayImage').style.display = l.image ? 'block' : 'none';
    $('overlayTitle').textContent = l.title;
    $('overlayDomain').textContent = l.domain;
    $('overlayDescription').textContent = l.description || '';
    $('overlayCategory').textContent = cap(l.category);
    $('overlayDate').textContent = new Date(l.addedAt).toLocaleDateString();
    $('overlayLink').href = l.url;
    openModal(overlay);
  }

  function openCategorySelect() {
    const cats = getCategories();
    let html = '';
    for (const n of Object.keys(cats)) {
      const active = selectedLink && selectedLink.category === n ? 'category-list__item--active' : '';
      html += `<button class="category-list__item ${active}" data-cat="${n}">${cap(n)}</button>`;
    }
    html += `<button class="category-list__item" data-cat="__new__">+ New category</button>`;
    categoryList.innerHTML = html;

    categoryList.onclick = (e) => {
      const btn = e.target.closest('.category-list__item');
      if (!btn) return;
      const cat = btn.dataset.cat;
      if (cat === '__new__') {
        const name = prompt('Category name:');
        if (name && name.trim()) {
          const n = createCategory(name.trim());
          recategorize(n);
        }
      } else {
        recategorize(cat);
      }
    };

    openModal(categoryModal);
  }

  function recategorize(cat) {
    if (!selectedLink) return;
    updateLink(selectedLink.id, { category: cat });
    closeModal(categoryModal);
    renderFilters();
    renderGrid();
    toast('Moved to ' + cap(cat));
  }

  function checkClusters() {
    const uncat = getAllLinks().filter(l => l.category === 'uncategorized');
    const clusters = detectClusters(uncat);
    if (clusters.length > 0) {
      const c = clusters[0];
      setTimeout(() => {
        if (confirm(`Found ${c.items.length} links from "${c.name}".\n\nCreate category?`)) {
          const n = createCategory(c.name);
          bulkMove(c.items.map(i => i.id), n);
          renderFilters();
          renderGrid();
          toast(`Created "${cap(n)}"`);
        }
      }, 500);
    }
  }

  function showStatus(msg, err) {
    formStatus.textContent = msg;
    formStatus.className = 'add-form__status' + (err ? ' add-form__status--error' : '');
  }

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' toast--error' : '');
    t.textContent = msg;
    toastContainer.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ============================================
  // Init
  // ============================================
  renderFilters();
  renderGrid();

  // First-use: auto-open add modal if no links exist
  if (getAllLinks().length === 0) {
    setTimeout(() => openModal(addModal), 100);
  }

})();
  </script>
</body>
</html>
