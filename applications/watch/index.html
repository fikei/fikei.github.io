<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Agape call recording</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0f1115; --surface: #171a21; --border: #262b36; --fg: #e8eaf0; --fg-muted: #9aa3b2; --accent: #5865f2; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    .brand { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-muted); margin: 0 0 16px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    .when { color: var(--fg-muted); font-size: 14px; margin: 0 0 20px; }
    video { width: 100%; border-radius: 12px; background: #000; display: block; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-top: 24px; }
    .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
    .summary { white-space: pre-wrap; font-size: 15px; }
    .foot { margin-top: 28px; font-size: 13px; color: var(--fg-muted); }
    .foot a { color: var(--accent); }
    .state { padding: 40px 0; text-align: center; color: var(--fg-muted); }

    /* Playback controls ride on the player itself — browsers bury speed in a
       menu and iOS omits it. Fade with the native controls on hover/touch. */
    .overlay {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      display: flex; gap: 6px; opacity: 0; transition: opacity 140ms ease;
    }
    .player:hover .overlay, .player:focus-within .overlay, .player.is-touched .overlay { opacity: 1; }
    .ov-btn {
      background: rgba(12, 14, 19, 0.78); color: #fff; border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; line-height: 1.2;
      cursor: pointer; backdrop-filter: blur(6px);
    }
    .ov-btn:hover { background: rgba(12, 14, 19, 0.95); }
    .speed { position: relative; }
    .speed-menu {
      position: absolute; top: calc(100% + 6px); right: 0; min-width: 92px;
      background: rgba(12, 14, 19, 0.96); border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px; padding: 4px; display: none; flex-direction: column;
      backdrop-filter: blur(6px);
    }
    .speed-menu.is-open { display: flex; }
    .speed-menu button {
      background: transparent; border: 0; color: #cfd5e1; text-align: left;
      padding: 6px 10px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .speed-menu button:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .speed-menu button[aria-checked="true"] { color: #fff; font-weight: 600; }

    /* Mini player: the shell goes fixed, a placeholder holds the page height
       so nothing jumps. Scrolling back up re-docks it inline. */
    .player { position: relative; }
    .player.is-mini {
      position: fixed; right: 16px; bottom: 16px; z-index: 60;
      width: min(360px, 62vw); border-radius: 12px; overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); border: 1px solid var(--border);
    }
    .player.is-mini video { border-radius: 0; }
    .player.is-mini .overlay { display: none; }
    .mini-bar {
      display: none; align-items: center; gap: 8px;
      background: var(--surface); padding: 6px 8px 6px 12px; font-size: 12px; color: var(--fg-muted);
    }
    .player.is-mini .mini-bar { display: flex; }
    .mini-bar__title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-bar button {
      background: transparent; border: 0; color: var(--fg-muted); cursor: pointer;
      font: inherit; font-size: 12px; padding: 3px 7px; border-radius: 6px;
    }
    .mini-bar button:hover { background: #222732; color: var(--fg); }
    @media (max-width: 520px) { .player.is-mini { width: min(260px, 70vw); right: 10px; bottom: 10px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand">Agape recruiting</p>
    <div id="root"><p class="state">Loading recording…</p></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yfhudwakpgzswiylhfbh.supabase.co';
    const RATES = [0.75, 1, 1.25, 1.5, 1.75, 2];
    const RATE_KEY = 'agape:watchRate';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function fmtWhen(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleString([], {
          weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit',
        });
      } catch { return ''; }
    }

    // Light markdown: the Haiku summaries use ## headings, **bold**, - bullets.
    function mdLite(src) {
      return esc(src)
        .replace(/^#+\s*(.+)$/gm, '<strong>$1</strong>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/^[-*]\s+(.+)$/gm, '• $1');
    }

    function wirePlayer(title) {
      const video = document.getElementById('v');
      const player = document.getElementById('player');
      const placeholder = document.getElementById('player-slot');
      if (!video) return;

      // ---- speed ----
      const saved = parseFloat(localStorage.getItem(RATE_KEY));
      const startRate = RATES.includes(saved) ? saved : 1;
      const speedBtn = document.getElementById('speed-btn');
      const speedMenu = document.getElementById('speed-menu');
      const buttons = [...speedMenu.querySelectorAll('[data-rate]')];
      const applyRate = rate => {
        video.playbackRate = rate;
        localStorage.setItem(RATE_KEY, String(rate));
        speedBtn.textContent = `${rate}\u00d7`;
        buttons.forEach(b => b.setAttribute('aria-checked', String(parseFloat(b.dataset.rate) === rate)));
      };
      const closeMenu = () => { speedMenu.classList.remove('is-open'); speedBtn.setAttribute('aria-expanded', 'false'); };
      speedBtn.addEventListener('click', e => {
        e.stopPropagation();
        const open = speedMenu.classList.toggle('is-open');
        speedBtn.setAttribute('aria-expanded', String(open));
      });
      buttons.forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        applyRate(parseFloat(b.dataset.rate));
        closeMenu();
      }));
      document.addEventListener('click', closeMenu);
      // Touch has no hover: reveal the overlay on tap, hide it with the menu.
      player.addEventListener('touchstart', () => {
        player.classList.add('is-touched');
        clearTimeout(player._ovTimer);
        player._ovTimer = setTimeout(() => player.classList.remove('is-touched'), 3500);
      }, { passive: true });
      applyRate(startRate);
      // Some browsers reset rate when new media loads.
      video.addEventListener('loadedmetadata', () => { video.playbackRate = startRate; });

      // ---- mini player ----
      let dismissed = false;
      const setMini = on => {
        if (player.classList.contains('is-mini') === on) return;
        if (on) {
          placeholder.style.height = `${player.offsetHeight}px`;
          player.classList.add('is-mini');
        } else {
          player.classList.remove('is-mini');
          placeholder.style.height = '';
        }
      };
      // Rect-based rather than IntersectionObserver: the observer is suspended
      // while a tab is backgrounded and its thresholds never report the
      // fully-scrolled-past state, so geometry on scroll is both simpler and
      // more predictable. Dock only while actually watching — a paused video
      // scrolling away is just a page you've moved past.
      const evaluate = () => {
        const r = placeholder.getBoundingClientRect();
        const gone = r.bottom < 56 || r.top > window.innerHeight - 56;
        const watching = !video.paused && !video.ended;
        setMini(gone && watching && !dismissed);
      };
      window.addEventListener('scroll', evaluate, { passive: true });
      window.addEventListener('resize', evaluate);
      video.addEventListener('timeupdate', evaluate);

      // Pausing in the mini player returns it inline; so does scrolling back.
      video.addEventListener('pause', () => setMini(false));
      video.addEventListener('play', () => { dismissed = false; evaluate(); });

      document.getElementById('mini-expand').addEventListener('click', () => {
        setMini(false);
        placeholder.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      document.getElementById('mini-close').addEventListener('click', () => {
        dismissed = true;
        video.pause();
        setMini(false);
      });
      document.getElementById('mini-title').textContent = title;

      // ---- picture-in-picture: keeps playing when you leave the tab ----
      const pipBtn = document.getElementById('pip');
      if (!document.pictureInPictureEnabled || video.disablePictureInPicture) {
        pipBtn.hidden = true;
      } else {
        pipBtn.addEventListener('click', async () => {
          try {
            if (document.pictureInPictureElement) await document.exitPictureInPicture();
            else await video.requestPictureInPicture();
          } catch { /* browser declined — the inline player still works */ }
        });
        // Leaving the tab mid-play pops out automatically where allowed;
        // browsers that require a gesture just decline and nothing breaks.
        document.addEventListener('visibilitychange', async () => {
          if (document.hidden && !video.paused && !document.pictureInPictureElement) {
            try { await video.requestPictureInPicture(); } catch { /* declined */ }
          }
        });
      }
    }

    (async () => {
      const root = document.getElementById('root');
      const token = new URLSearchParams(location.search).get('t') || '';
      if (!token) { root.innerHTML = '<p class="state">This link is missing its recording code.</p>'; return; }
      try {
        const resp = await fetch(`${SUPABASE_URL}/functions/v1/recruit-watch?t=${encodeURIComponent(token)}`);
        const data = await resp.json();
        if (!resp.ok) {
          root.innerHTML = '<p class="state">This recording link is no longer valid. Ask in the Recruiting Society channel for a fresh one.</p>';
          return;
        }
        const rateButtons = RATES.map(r =>
          `<button type="button" role="menuitemradio" data-rate="${r}" aria-checked="false">${r}×</button>`).join('');
        root.innerHTML = `
          <h1>${esc(data.title)}</h1>
          <p class="when">${esc(fmtWhen(data.when))}</p>
          ${data.url ? `
            <div id="player-slot">
              <div class="player" id="player">
                <div class="mini-bar">
                  <span class="mini-bar__title" id="mini-title"></span>
                  <button type="button" id="mini-expand">Back to page</button>
                  <button type="button" id="mini-close" aria-label="Close mini player">✕</button>
                </div>
                <div class="overlay">
                  <span class="speed">
                    <button type="button" class="ov-btn" id="speed-btn" aria-haspopup="true" aria-expanded="false">1&times;</button>
                    <span class="speed-menu" id="speed-menu" role="menu">${rateButtons}</span>
                  </span>
                  <button type="button" class="ov-btn" id="pip" title="Pop out into a floating window">&#9974;</button>
                </div>
                <video id="v" controls playsinline preload="metadata" src="${esc(data.url)}"></video>
              </div>
            </div>`
            : `<p class="state">${esc(data.reason || 'No recording available for this call.')}</p>`}
          ${data.summary ? `<div class="card"><h2>Call summary</h2><div class="summary">${mdLite(data.summary)}</div></div>` : ''}
          <p class="foot">Anyone with this link can watch. Housemates: open the
            <a href="/applications/">applicant inbox</a> for notes, votes, and the full profile.</p>`;
        if (data.url) wirePlayer(data.title || 'Agape call');
      } catch {
        root.innerHTML = '<p class="state">Couldn’t load the recording. Try again in a minute.</p>';
      }
    })();
  </script>
</body>
</html>
