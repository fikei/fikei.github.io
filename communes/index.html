<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SF Commune Atlas — ctrl.rodeo</title>
<meta name="description" content="A playful interactive map of San Francisco's co-ops, communes, and intentional communities — from the Diggers to Haight Street Commons.">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root {
  --bg: #0a0a0a;
  --panel: #111;
  --panel-2: #181818;
  --border: #2a2a2a;
  --text: #f0f0f0;
  --muted: #888;
  --accent: #ffd166;      /* warm lamp-light yellow */
  --active: #6ee7a0;      /* alive green */
  --historical: #b48cf2;  /* ghost purple */
  --closed: #f27a7a;      /* faded red */
  --mono: 'SF Mono', 'Fira Code', ui-monospace, Menlo, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  overflow: hidden;
}

/* ---------- layout ---------- */
#app { display: flex; height: 100vh; height: 100dvh; }
#sidebar {
  width: 380px;
  min-width: 380px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 1002;
}
#map { flex: 1; background: #0a0a0a; }

/* ---------- header ---------- */
header { padding: 18px 18px 12px; border-bottom: 1px solid var(--border); }
header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
header h1 .blink { color: var(--accent); animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
header .sub { color: var(--muted); font-size: 11px; margin-top: 4px; line-height: 1.5; }
header .sub a { color: var(--accent); text-decoration: none; }
header .sub a:hover { text-decoration: underline; }

/* ---------- controls ---------- */
#controls { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
#search {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 6px;
  outline: none;
}
#search:focus { border-color: var(--accent); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--mono);
  font-size: 10px;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  user-select: none;
}
.chip:hover { border-color: var(--text); color: var(--text); }
.chip.on { border-color: var(--accent); color: var(--accent); background: rgba(255, 209, 102, .08); }
.chip.on.c-active { border-color: var(--active); color: var(--active); background: rgba(110, 231, 160, .08); }
.chip.on.c-historical { border-color: var(--historical); color: var(--historical); background: rgba(180, 140, 242, .08); }
.chip.on.c-closed { border-color: var(--closed); color: var(--closed); background: rgba(242, 122, 122, .08); }
#lucky {
  align-self: flex-start;
  background: var(--accent);
  color: #111;
  border: none;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 11px;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: transform .1s;
}
#lucky:hover { transform: rotate(-2deg) scale(1.04); }
#lucky:active { transform: scale(.96); }

/* ---------- house list ---------- */
#count { padding: 8px 18px 0; font-size: 10px; color: var(--muted); }
#list { flex: 1; overflow-y: auto; padding: 8px 10px 20px; }
#list::-webkit-scrollbar { width: 8px; }
#list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.house-card {
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: all .12s;
}
.house-card:hover { background: var(--panel-2); border-color: var(--border); }
.house-card.selected { background: var(--panel-2); border-color: var(--accent); }
.house-card .top { display: flex; align-items: baseline; gap: 8px; }
.house-card .emoji { font-size: 15px; }
.house-card .name { font-size: 13px; font-weight: 700; }
.house-card .meta { font-size: 10px; color: var(--muted); margin-top: 3px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.active { background: var(--active); box-shadow: 0 0 6px var(--active); }
.dot.historical { background: var(--historical); }
.dot.closed { background: var(--closed); }
.dot.unknown { background: var(--muted); }

/* ---------- leaflet dark theming ---------- */
.leaflet-container { font-family: var(--mono); }
.leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border) !important; }
.leaflet-control-attribution { background: rgba(10,10,10,.7) !important; color: #666 !important; font-size: 9px !important; }
.leaflet-control-attribution a { color: #888 !important; }

/* ---------- markers ---------- */
.house-marker { background: none; border: none; }
.house-marker .pin {
  font-size: 22px;
  line-height: 1;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.6));
  transition: transform .15s;
  transform-origin: bottom center;
  display: inline-block;
  cursor: pointer;
}
.house-marker:hover .pin { transform: scale(1.35) rotate(-6deg); }
.house-marker.hist .pin { opacity: .75; filter: grayscale(.3) drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.house-marker.sel .pin { animation: bounce .5s ease infinite alternate; }
@keyframes bounce { from { transform: translateY(0) scale(1.3); } to { transform: translateY(-6px) scale(1.3); } }

/* ---------- detail panel ---------- */
#detail {
  position: absolute;
  right: 14px;
  top: 14px;
  width: 360px;
  max-width: calc(100vw - 420px);
  max-height: calc(100vh - 28px);
  overflow-y: auto;
  background: rgba(17,17,17,.96);
  border: 1px solid var(--border);
  border-radius: 12px;
  z-index: 1001;
  padding: 18px;
  display: none;
  backdrop-filter: blur(6px);
  box-shadow: 0 8px 40px rgba(0,0,0,.5);
}
#detail.open { display: block; animation: pop .18s ease; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }
#detail .close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; font-family: var(--mono); }
#detail .close:hover { color: var(--text); }
#detail .d-emoji { font-size: 34px; }
#detail h2 { font-size: 17px; margin: 6px 0 2px; }
#detail .d-status { font-size: 10px; margin-bottom: 10px; }
#detail .d-vibe { display: inline-block; font-size: 10px; color: var(--accent); border: 1px dashed var(--accent); border-radius: 999px; padding: 3px 9px; margin-bottom: 12px; }
#detail .d-desc { font-size: 12px; line-height: 1.7; color: #ccc; }
#detail .d-facts { margin: 14px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#detail .fact { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
#detail .fact .k { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
#detail .fact .v { font-size: 12px; margin-top: 3px; }
#detail .d-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
#detail .d-links a {
  font-size: 10px; color: var(--text); text-decoration: none;
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
  transition: all .12s;
}
#detail .d-links a:hover { border-color: var(--accent); color: var(--accent); }
#detail .d-approx { font-size: 9px; color: var(--muted); margin-top: 12px; font-style: italic; }

/* ---------- toast ---------- */
#toast {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--accent); color: var(--accent);
  font-size: 11px; padding: 8px 14px; border-radius: 999px; z-index: 1003;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
#toast.show { opacity: 1; }

/* ---------- mobile ---------- */
#mobile-toggle { display: none; }
@media (max-width: 760px) {
  #sidebar {
    position: absolute; inset: auto 0 0 0; height: 55%;
    width: 100%; min-width: 0;
    border-right: none; border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    transition: transform .25s ease;
  }
  #sidebar.hidden { transform: translateY(calc(100% - 46px)); }
  #app { display: block; }
  #map { position: absolute; inset: 0; }
  #detail { right: 8px; left: 8px; top: 8px; width: auto; max-width: none; max-height: 42vh; }
  #mobile-toggle {
    display: block; width: 100%; background: var(--panel); border: none; color: var(--muted);
    font-family: var(--mono); font-size: 10px; padding: 14px 0 6px; cursor: pointer;
  }
  #mobile-toggle::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 8px; }
}
</style>
  <script defer src="/analytics/track.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <button id="mobile-toggle" aria-label="Toggle list">house list</button>
    <header>
      <h1>SF COMMUNE ATLAS <span class="blink">▮</span></h1>
      <div class="sub">co-ops, communes &amp; intentional communities of San Francisco — seeded from <a href="https://www.haightstreetcommons.org" target="_blank" rel="noopener">Haight Street Commons</a>. locations are neighborhood-approximate out of respect for residents.</div>
    </header>
    <div id="controls">
      <input id="search" type="search" placeholder="search houses, vibes, neighborhoods…" autocomplete="off">
      <div class="chip-row" id="status-chips"></div>
      <div class="chip-row" id="vibe-chips"></div>
      <button id="lucky">⚂ take me somewhere</button>
    </div>
    <div id="count"></div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
  <div id="detail"></div>
  <div id="toast"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script>
const VERSION = '1.0.0';
console.log(`[communes] v${VERSION} - SF Commune Atlas`);

/* ============ setup ============ */
const map = L.map('map', { zoomControl: true, attributionControl: true })
  .setView([37.7679, -122.4383], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 19
}).addTo(map);

const HOUSES = window.COMMUNE_DATA.houses;
const STATUS_META = {
  active:     { label: 'active',     cls: 'c-active' },
  historical: { label: 'historical', cls: 'c-historical' },
  closed:     { label: 'closed',     cls: 'c-closed' },
  unknown:    { label: 'unknown',    cls: '' },
};

const state = {
  q: '',
  statuses: new Set(['active', 'historical', 'closed', 'unknown']),
  vibe: null,
  selected: null,
};

/* ============ markers ============ */
const markers = {};
function makeMarker(h) {
  const hist = h.status !== 'active';
  const icon = L.divIcon({
    className: `house-marker ${hist ? 'hist' : ''}`,
    html: `<span class="pin">${h.emoji}</span>`,
    iconSize: [26, 26],
    iconAnchor: [13, 24],
  });
  const m = L.marker([h.lat, h.lng], { icon, title: h.name, riseOnHover: true });
  m.on('click', () => select(h.id, { fly: false }));
  return m;
}
HOUSES.forEach(h => { markers[h.id] = makeMarker(h); });

/* ============ filtering ============ */
function visibleHouses() {
  const q = state.q.trim().toLowerCase();
  return HOUSES.filter(h => {
    if (!state.statuses.has(h.status)) return false;
    if (state.vibe && !h.tags.includes(state.vibe)) return false;
    if (q) {
      const hay = `${h.name} ${h.neighborhood} ${h.vibe} ${h.description} ${h.tags.join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const vis = visibleHouses();
  const visIds = new Set(vis.map(h => h.id));
  HOUSES.forEach(h => {
    const m = markers[h.id];
    if (visIds.has(h.id)) { if (!map.hasLayer(m)) m.addTo(map); }
    else if (map.hasLayer(m)) m.remove();
  });
  document.getElementById('count').textContent =
    `${vis.length} of ${HOUSES.length} houses on the map`;
  const list = document.getElementById('list');
  list.innerHTML = vis.map(h => `
    <div class="house-card ${state.selected === h.id ? 'selected' : ''}" data-id="${h.id}">
      <div class="top"><span class="emoji">${h.emoji}</span><span class="name">${h.name}</span></div>
      <div class="meta"><span class="dot ${h.status}"></span>${h.neighborhood}${h.founded ? ` · est. ${h.founded}` : ''}${h.residents ? ` · ~${h.residents} people` : ''}</div>
    </div>`).join('');
  list.querySelectorAll('.house-card').forEach(el =>
    el.addEventListener('click', () => select(el.dataset.id, { fly: true })));
}

/* ============ selection / detail ============ */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function select(id, { fly }) {
  const h = HOUSES.find(x => x.id === id);
  if (!h) return;
  state.selected = id;
  Object.entries(markers).forEach(([mid, m]) => {
    const el = m.getElement();
    if (el) el.classList.toggle('sel', mid === id);
  });
  if (fly) map.flyTo([h.lat, h.lng], Math.max(map.getZoom(), 15), { duration: 0.8 });
  const sm = STATUS_META[h.status] || STATUS_META.unknown;
  const d = document.getElementById('detail');
  d.innerHTML = `
    <button class="close" aria-label="Close">✕</button>
    <div class="d-emoji">${h.emoji}</div>
    <h2>${esc(h.name)}</h2>
    <div class="d-status"><span class="dot ${h.status}"></span>${sm.label}${h.closedYear ? ` (${h.founded || '?'}–${h.closedYear})` : ''} · ${esc(h.neighborhood)}</div>
    <div class="d-vibe">${esc(h.vibe)}</div>
    <div class="d-desc">${esc(h.description)}</div>
    <div class="d-facts">
      ${h.founded ? `<div class="fact"><div class="k">founded</div><div class="v">${h.founded}</div></div>` : ''}
      ${h.residents ? `<div class="fact"><div class="k">residents</div><div class="v">~${h.residents}</div></div>` : ''}
      ${h.inHSC === 'yes' ? `<div class="fact"><div class="k">network</div><div class="v">Haight St Commons</div></div>` : ''}
      ${h.funFact ? `<div class="fact" style="grid-column:1/-1"><div class="k">fun fact</div><div class="v">${esc(h.funFact)}</div></div>` : ''}
    </div>
    ${h.links && h.links.length ? `<div class="d-links">${h.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div>` : ''}
    ${h.coordsApprox ? `<div class="d-approx">📍 location is approximate (neighborhood-level)</div>` : ''}
  `;
  d.classList.add('open');
  d.querySelector('.close').addEventListener('click', () => {
    d.classList.remove('open');
    state.selected = null;
    render();
  });
  render();
}

/* ============ chips ============ */
function buildChips() {
  const sc = document.getElementById('status-chips');
  sc.innerHTML = Object.entries(STATUS_META).map(([k, v]) =>
    `<span class="chip on ${v.cls}" data-status="${k}">● ${v.label} (${HOUSES.filter(h => h.status === k).length})</span>`).join('');
  sc.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => {
    const s = el.dataset.status;
    if (state.statuses.has(s)) { state.statuses.delete(s); el.classList.remove('on'); }
    else { state.statuses.add(s); el.classList.add('on'); }
    render();
  }));

  const tagCounts = {};
  HOUSES.forEach(h => h.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
  const topTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t]) => t);
  const vc = document.getElementById('vibe-chips');
  vc.innerHTML = topTags.map(t => `<span class="chip" data-tag="${t}">${t}</span>`).join('');
  vc.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => {
    const t = el.dataset.tag;
    if (state.vibe === t) { state.vibe = null; el.classList.remove('on'); }
    else {
      state.vibe = t;
      vc.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
    }
    render();
  }));
}

/* ============ lucky button ============ */
const LUCKY_LINES = [
  'ooh, nice pick:', 'the dice say:', 'destiny called:', 'pack your bags for:',
  'a wild house appears:', 'the commune gods chose:', 'tonight we dine at:',
];
document.getElementById('lucky').addEventListener('click', () => {
  const vis = visibleHouses();
  if (!vis.length) return;
  const h = vis[Math.floor(Math.random() * vis.length)];
  select(h.id, { fly: true });
  const t = document.getElementById('toast');
  t.textContent = `${LUCKY_LINES[Math.floor(Math.random() * LUCKY_LINES.length)]} ${h.name} ${h.emoji}`;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
});

/* ============ search + mobile ============ */
document.getElementById('search').addEventListener('input', e => {
  state.q = e.target.value;
  render();
});
document.getElementById('mobile-toggle').addEventListener('click', () =>
  document.getElementById('sidebar').classList.toggle('hidden'));

/* ============ go ============ */
buildChips();
render();
</script>
</body>
</html>
