<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoy — Daily Reflection Flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; display: flex; justify-content: center; padding: 60px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body.embedded { padding: 0; background: transparent; }
  body.embedded .phone__label { display: none; }

  .phone { width: 402px; background: #1C1C1E; border-radius: 48px; padding: 6px; flex-shrink: 0; }
  .phone-inner { border-radius: 42px; overflow: hidden; position: relative; width: 390px; height: 844px; background: white; }
  .phone__label { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #666560; margin-top: 16px; }

  .screen { position: absolute; inset: 0; width: 390px; height: 844px; background: white; opacity: 0; pointer-events: none; display: flex; flex-direction: column; overflow: hidden; }
  .screen.active { opacity: 1; pointer-events: auto; z-index: 2; }
  .screen.slide-up { animation: slideUp 0.5s cubic-bezier(0.32,0.72,0,1) forwards; }
  .screen.slide-down { animation: slideDown 0.5s cubic-bezier(0.32,0.72,0,1) forwards; }

  @keyframes slideUp { from { opacity: 1; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideDown { from { opacity: 1; transform: translateY(0); } to { opacity: 1; transform: translateY(100%); } }

  /* Status bar — light blue gradient from Paper */
  .status-bar { background: linear-gradient(180deg, oklab(92.4% -0.009 -0.014) 0%, oklab(95% -0.007 -0.008) 100%); border-radius: 30px 30px 0 0; height: 100px; padding: 12px 26px 0; display: flex; flex-direction: column; flex-shrink: 0; }
  .status-top { display: flex; justify-content: space-between; align-items: center; }
  .status-time { font-family: "SF Pro", system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #191919; }
  .status-icons { font-family: "SF Pro", system-ui, sans-serif; font-size: 12px; color: #191919; }
  .breath-row { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; }
  .breath-dot { width: 24px; height: 24px; border-radius: 12px; background: #2A3C56; flex-shrink: 0; }

  /* Card */
  .card { flex: 1; background: white; border-radius: 20px 20px 0 0; margin-top: -8px; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 20px; padding: 24px 36px; overflow-y: auto; scroll-behavior: smooth; }
  .card::-webkit-scrollbar { display: none; }
  .card-fade-out { animation: cardFadeOut 0.35s ease forwards; }
  .card-fade-in { animation: cardFadeIn 0.35s ease forwards; }
  @keyframes cardFadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes cardFadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Nav */
  .nav { display: flex; justify-content: space-between; align-items: center; }
  .nav span { font-family: "SF Pro Text", system-ui, sans-serif; font-size: 20px; color: #191919; line-height: 24px; }

  /* Typography */
  .heading { font-family: "SF Pro", system-ui, sans-serif; font-size: 28px; font-weight: 510; letter-spacing: -0.5px; line-height: 34px; color: #191919; }
  .section-title { font-family: "SF Pro", system-ui, sans-serif; font-size: 20px; font-weight: 510; letter-spacing: -0.5px; line-height: 24px; color: #191919; }
  .label-bold { font-family: "SF Pro Text", system-ui, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.41px; line-height: 22px; color: #191919; }
  .text-item { font-family: "SF Pro Text", system-ui, sans-serif; font-size: 17px; letter-spacing: -0.41px; line-height: 22px; color: #221D1D; }
  .text-sub { font-family: "SF Pro Text", system-ui, sans-serif; font-size: 15px; letter-spacing: -0.41px; line-height: 18px; color: #B2B2B2; }
  .text-sm { font-family: "SF Pro Text", system-ui, sans-serif; font-size: 13px; letter-spacing: -0.41px; line-height: 16px; color: #666; text-align: center; }

  /* Plan items */
  .checklist-item { display: flex; align-items: center; justify-content: space-between; background: #F5F5F5; border-radius: 20px; padding: 12px 16px; }
  .checklist-left { display: flex; align-items: center; gap: 12px; }
  .checklist-dot { width: 40px; height: 40px; border-radius: 9999px; flex-shrink: 0; }
  .checklist-check { width: 28px; height: 28px; border-radius: 14px; border: 2px solid #D6D6D6; flex-shrink: 0; transition: all 0.3s ease; }
  .checklist-check.checked { background: #6FCC9F; border-color: #6FCC9F; }

  /* Segmented bar */
  .seg-bar { display: flex; gap: 4px; }
  .seg-bar > div { flex: 1; height: 10px; border-radius: 4px; background: #F5F5F5; transition: background 0.4s ease; }

  /* Callout */
  .callout { display: flex; align-items: center; gap: 12px; border-radius: 26px; padding: 14px 20px; }
  .callout-warm { background: #FEF3E2; }
  .callout-icon { width: 28px; height: 28px; border-radius: 14px; background: #E8D5B0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: "SF Pro Text", sans-serif; font-size: 13px; color: #78613A; }

  /* CTA */
  .cta { background: #2A3C56; border-radius: 26px; padding: 16px; text-align: center; }
  .cta-text { font-family: "SF Pro Text", system-ui, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.41px; line-height: 22px; color: white; }

  /* Likert dots */
  .likert-row { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 8px; }
  .likert-dots { display: flex; gap: 20px; }
  .likert-dot { width: 54px; height: 54px; border-radius: 27px; flex-shrink: 0; transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; }
  .likert-dot.selected { transform: scale(1.1); box-shadow: 0 0 0 3px rgba(42,60,86,0.3); }

  /* Animated elements */
  .anim { opacity: 0; transform: translateY(10px); }
  .anim.show { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease, transform 0.4s ease; }

  @keyframes tapPulse { 0% { transform: scale(1); } 50% { transform: scale(0.96); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
  .pulse { animation: tapPulse 0.3s ease; }

  /* Home styles */
  .home-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; flex: 1; padding: 0 40px; }

  @media (max-width: 480px) {
    body:not(.embedded) { padding: 24px 0; }
    body:not(.embedded) .phone { transform: scale(0.85); transform-origin: top center; }
  }
</style>
</head>
<body>

<div>
  <div class="phone">
    <div class="phone-inner">

      <!-- SCREEN 0: Home -->
      <div class="screen active" id="screen0" style="background:white;border-radius:30px;">
        <div style="display:flex;flex-direction:column;flex-shrink:0;padding:14px 26px 0;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-family:'SF Pro',system-ui,sans-serif;font-size:15px;font-weight:600;color:#191919;">9:41</span>
            <div style="display:flex;gap:6px;align-items:center;">
              <span style="font-family:'SF Pro',system-ui,sans-serif;font-size:12px;font-weight:600;color:#191919;">||||</span>
              <span style="font-family:'SF Pro',system-ui,sans-serif;font-size:14px;color:#191919;">▲</span>
              <div style="width:24px;height:11px;border-radius:3px;background:#191919;"></div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding-top:20px;">
            <div style="width:28px;height:28px;border-radius:14px;background:#2A3C56;position:relative;">
              <div style="width:8px;height:8px;border-radius:4px;background:#6FCC9F;border:2px solid white;position:absolute;right:-2px;top:-2px;"></div>
            </div>
            <span style="font-family:'SF Pro Text',system-ui,sans-serif;font-size:17px;font-weight:600;color:#191919;letter-spacing:-0.41px;">Home</span>
            <div style="width:36px;height:36px;border-radius:18px;border:2px solid #2A3C56;display:flex;align-items:center;justify-content:center;">
              <div style="width:12px;height:12px;border-radius:6px;border:1.5px solid #2A3C56;"></div>
            </div>
          </div>
        </div>
        <div class="home-content">
          <div style="width:220px;height:220px;border-radius:110px;background:#FAF5EB;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative;">
            <div style="width:90px;height:45px;border-radius:45px 45px 0 0;background:#E8A830;position:absolute;top:82px;"></div>
            <div style="width:4px;height:18px;border-radius:2px;background:#E8A830;position:absolute;top:58px;left:108px;"></div>
            <div style="width:4px;height:14px;border-radius:2px;background:#E8A830;position:absolute;top:62px;left:88px;transform:rotate(-25deg);"></div>
            <div style="width:4px;height:14px;border-radius:2px;background:#E8A830;position:absolute;top:62px;left:128px;transform:rotate(25deg);"></div>
            <div style="display:flex;flex-direction:column;gap:8px;align-items:center;position:absolute;top:132px;">
              <div style="width:130px;height:5px;border-radius:3px;background:#A8D4E2;"></div>
              <div style="width:100px;height:5px;border-radius:3px;background:#BEE0EC;"></div>
              <div style="width:70px;height:5px;border-radius:3px;background:#D0EAF2;"></div>
            </div>
          </div>
          <span style="font-family:'SF Pro Display',system-ui,sans-serif;font-size:34px;font-weight:600;line-height:41px;text-align:center;color:#191919;">Good morning, Charlie.</span>
          <div class="cta" style="padding:18px 56px;border-radius:30px;" id="homeCta">
            <span class="cta-text">Let's check-in</span>
          </div>
          <span style="font-family:'SF Pro Text',system-ui,sans-serif;font-size:17px;color:#191919;letter-spacing:-0.41px;">Yesterday, you got:</span>
          <div style="display:flex;gap:32px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <div style="width:44px;height:44px;border-radius:22px;background:#ECEAE6;display:flex;align-items:center;justify-content:center;"><span style="font-size:18px;">🔥</span></div>
              <div style="display:flex;flex-direction:column;gap:2px;">
                <span style="font-family:'SF Pro',system-ui,sans-serif;font-size:26px;font-weight:700;color:#191919;letter-spacing:-0.5px;line-height:28px;">5.9</span>
                <span style="font-family:'SF Pro Text',system-ui,sans-serif;font-size:15px;color:#B2B2B2;letter-spacing:-0.41px;">Fat Burn</span>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <div style="width:44px;height:44px;border-radius:22px;background:#ECEAE6;display:flex;align-items:center;justify-content:center;"><span style="font-family:'SF Pro Text',sans-serif;font-size:18px;color:#5A7080;">✓</span></div>
              <div style="display:flex;flex-direction:column;gap:2px;">
                <span style="font-family:'SF Pro',system-ui,sans-serif;font-size:26px;font-weight:700;color:#191919;letter-spacing:-0.5px;line-height:28px;">4 days</span>
                <span style="font-family:'SF Pro Text',system-ui,sans-serif;font-size:15px;color:#B2B2B2;letter-spacing:-0.41px;">Check-in Streak</span>
              </div>
            </div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-around;align-items:flex-start;padding:10px 0 28px;border-top:1px solid #F0F0F0;flex-shrink:0;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><span style="font-family:'SF Pro Text',sans-serif;font-size:20px;color:#2A3C56;">⌂</span><span style="font-family:'SF Pro Text',sans-serif;font-size:10px;font-weight:600;color:#2A3C56;">Home</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><span style="font-family:'SF Pro Text',sans-serif;font-size:20px;color:#B2B2B2;">📊</span><span style="font-family:'SF Pro Text',sans-serif;font-size:10px;color:#B2B2B2;">Journey</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><span style="font-family:'SF Pro Text',sans-serif;font-size:20px;color:#B2B2B2;">🍴</span><span style="font-family:'SF Pro Text',sans-serif;font-size:10px;color:#B2B2B2;">Food</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><span style="font-family:'SF Pro Text',sans-serif;font-size:20px;color:#B2B2B2;">💬</span><span style="font-family:'SF Pro Text',sans-serif;font-size:10px;color:#B2B2B2;">Support</span></div>
        </div>
      </div>

    </div>
  </div>
  <p class="phone__label">02 — Daily Reflection Flow</p>
</div>

<script>
(function() {
  function wait(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

  async function runAnimation() {
    await wait(2500);
    document.getElementById('homeCta').classList.add('pulse');
  }

  var paused = window.location.search.indexOf('paused') > -1;
  if (paused) document.body.classList.add('embedded');

  var started = false;
  function start() { if (started) return; started = true; runAnimation(); }

  if (paused) {
    window.addEventListener('message', function(e) { if (e.data === 'start') start(); });
  } else { start(); }
})();
</script>

</body>
</html>
