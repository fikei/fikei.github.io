<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board</title>
  <style>
/* ============================================
   Board - Swiss Grid + Web 1.0 Typography
   ============================================ */

:root {
  /* Typography - Web 1.0 choices */
  --font-serif: Georgia, "Times New Roman", Times, serif;
  --font-mono: "Courier New", Courier, monospace;
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;
  --line-height-tight: 1.2;
  --line-height-normal: 1.6;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* Grid */
  --grid-gap: 16px;

  /* Dark mode (default) */
  --bg: #111;
  --fg: #fff;
  --surface: #1a1a1a;
  --border: #fff;
  --muted: #888;
  --subtle: #333;
}

:root.light {
  --bg: #fff;
  --fg: #000;
  --surface: #fff;
  --border: #000;
  --muted: #888;
  --subtle: #e0e0e0;
}

/* Theme toggle */
.theme-toggle {
  position: fixed;
  top: var(--space-4);
  right: var(--space-4);
  width: 32px;
  height: 18px;
  background: transparent;
  border: 1px solid var(--fg);
  cursor: pointer;
  z-index: 100;
  padding: 2px;
  transition: background 0.2s ease;
}

.theme-toggle__knob {
  width: 12px;
  height: 12px;
  background: var(--fg);
  transition: transform 0.2s ease;
  transform: translateX(0);
}

:root.light .theme-toggle {
  background: var(--fg);
}

:root.light .theme-toggle__knob {
  background: var(--bg);
  transform: translateX(14px);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
}

body {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
  color: var(--fg);
  background: var(--bg);
  transition: background 0.3s ease, color 0.3s ease;
}

/* ============================================
   Floating Add Button
   ============================================ */
.fab {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  width: 24px;
  height: 24px;
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  background: var(--fg);
  color: var(--bg);
  border: none;
  cursor: pointer;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab:hover {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
}

/* ============================================
   Filters
   ============================================ */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-4);
  border-bottom: 1px solid var(--subtle);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

.filter-token {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: var(--space-1) var(--space-3);
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--fg);
  cursor: pointer;
}

.filter-token:hover {
  text-decoration: underline;
}

.filter-token--active {
  background: var(--fg);
  color: var(--bg);
}

/* ============================================
   Grid
   ============================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--grid-gap);
  padding: var(--space-4);
}

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}

/* ============================================
   Grid Item
   ============================================ */
.grid-item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  background: var(--subtle);
  border: 1px solid var(--fg);
  transition: transform 0.1s, opacity 0.1s;
}

.grid-item.dragging {
  opacity: 0.4;
  transform: scale(0.95);
}

.grid-item.drag-before {
  transform: translateX(8px);
  box-shadow: -4px 0 0 0 var(--fg);
}

.grid-item.drag-after {
  transform: translateX(-8px);
  box-shadow: 4px 0 0 0 var(--fg);
}

.grid-item__image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(1.1);
  transition: filter 0.2s;
}

.grid-item:hover .grid-item__image {
  filter: grayscale(0%);
}

.grid-item__overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: var(--space-3);
  background: var(--bg);
  border-top: 1px solid var(--fg);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__overlay {
  opacity: 1;
}

@media (hover: none) {
  .grid-item__overlay {
    opacity: 1;
    padding: var(--space-2);
  }
}

.grid-item__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-sm);
  font-weight: normal;
  line-height: var(--line-height-tight);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-item__domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  margin-top: 2px;
  text-decoration: underline;
}

.grid-item__category {
  position: absolute;
  top: 0;
  left: 0;
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 2px 6px;
  background: var(--bg);
  border-right: 1px solid var(--fg);
  border-bottom: 1px solid var(--fg);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__category {
  opacity: 1;
}

/* Placeholder */
.grid-item--placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--placeholder .grid-item__initial {
  font-family: var(--font-serif);
  font-size: var(--font-size-2xl);
  color: var(--bg);
}

/* ============================================
   Empty State
   ============================================ */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 100px);
}

.empty-state__box {
  border: 1px solid var(--fg);
  padding: var(--space-6);
  max-width: 320px;
  text-align: center;
}

.empty-state__text {
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  font-weight: bold;
  color: var(--fg);
  line-height: var(--line-height-normal);
}

/* ============================================
   Modal
   ============================================ */
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0.15s;
}

.modal--visible {
  opacity: 1;
  visibility: visible;
}

.modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

.modal__content {
  position: relative;
  width: calc(100% - 32px);
  max-width: 480px;
  max-height: calc(100vh - 32px);
  background: var(--bg);
  border: 2px solid var(--fg);
  overflow-y: auto;
}

.modal--small .modal__content {
  max-width: 300px;
}

.modal__header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: var(--space-4);
  border-bottom: 1px solid var(--fg);
}

.modal__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
}

.modal__close {
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.modal__close:hover {
  text-decoration: underline;
}

/* ============================================
   Add Form
   ============================================ */
.add-form {
  padding: var(--space-4);
}

.add-form__input {
  width: 100%;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  border: 1px solid var(--fg);
  resize: vertical;
}

.add-form__input:focus {
  outline: 2px solid var(--fg);
  outline-offset: 1px;
}

.add-form__status {
  min-height: 20px;
  padding: var(--space-2) 0;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.add-form__status--error {
  font-weight: bold;
}

.add-form__submit {
  width: 100%;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: var(--fg);
  color: var(--bg);
  border: 2px solid var(--fg);
  cursor: pointer;
}

.add-form__submit:hover {
  background: var(--bg);
  color: var(--fg);
  text-decoration: underline;
}

/* ============================================
   Overlay (Detail View)
   ============================================ */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0.15s;
}

.overlay--visible {
  opacity: 1;
  visibility: visible;
}

.overlay__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
}

.overlay__content {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

@media (min-width: 900px) {
  .overlay__content {
    max-width: 560px;
    margin: var(--space-8) auto;
    height: auto;
    max-height: calc(100vh - 64px);
    border: 2px solid var(--fg);
  }
}

.overlay__close {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  z-index: 10;
  width: 32px;
  height: 32px;
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  background: var(--bg);
  border: 1px solid var(--fg);
  cursor: pointer;
}

.overlay__image {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  filter: grayscale(100%);
  border-bottom: 1px solid var(--fg);
}

.overlay__details {
  flex: 1;
  padding: var(--space-6);
  overflow-y: auto;
}

.overlay__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-xl);
  font-weight: normal;
  line-height: var(--line-height-tight);
  margin-bottom: var(--space-2);
}

.overlay__domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-decoration: underline;
  margin-bottom: var(--space-4);
}

.overlay__description {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
  margin-bottom: var(--space-6);
}

.overlay__meta {
  display: flex;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.overlay__category {
  padding: 2px 8px;
  background: var(--fg);
  color: var(--bg);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.overlay__date {
  color: var(--muted);
}

.overlay__actions {
  display: flex;
  gap: var(--space-2);
}

.overlay__link,
.overlay__action {
  flex: 1;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  text-align: center;
  text-decoration: none;
  border: 1px solid var(--fg);
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
}

.overlay__link:hover,
.overlay__action:hover {
  background: var(--fg);
  color: var(--bg);
}

.overlay__action--danger {
  border-color: var(--muted);
  color: var(--muted);
}

/* ============================================
   Category List
   ============================================ */
.category-list {
  padding: var(--space-2);
}

.category-list__item {
  display: block;
  width: 100%;
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  text-align: left;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: none;
  border: none;
  border-bottom: 1px solid var(--subtle);
  cursor: pointer;
}

.category-list__item:hover {
  background: var(--subtle);
  text-decoration: underline;
}

.category-list__item--active {
  font-weight: bold;
}

/* ============================================
   Toast
   ============================================ */
.toast-container {
  position: fixed;
  bottom: var(--space-4);
  left: var(--space-4);
  right: var(--space-4);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  pointer-events: none;
}

.toast {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  padding: var(--space-3);
  background: var(--fg);
  color: var(--bg);
  border: 1px solid var(--fg);
  pointer-events: auto;
}

.toast--error {
  background: var(--bg);
  color: var(--fg);
  border: 2px solid var(--fg);
}

/* ============================================
   Dev Menu
   ============================================ */
.dev-menu {
  position: fixed;
  top: var(--space-4);
  right: var(--space-4);
  z-index: 200;
  background: var(--bg);
  border: 2px solid var(--fg);
  padding: var(--space-2);
  display: none;
}

.dev-menu--visible {
  display: block;
}

.dev-menu__title {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: var(--space-2);
  border-bottom: 1px solid var(--fg);
  margin-bottom: var(--space-2);
}

.dev-menu__btn {
  display: block;
  width: 100%;
  padding: var(--space-2) var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-align: left;
  background: none;
  border: none;
  cursor: pointer;
}

.dev-menu__btn:hover {
  background: var(--subtle);
}

.dev-menu__btn--danger {
  color: var(--fg);
  font-weight: bold;
}
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle"><div class="theme-toggle__knob"></div></button>

  <nav class="filters" id="filters">
    <button class="filter-token filter-token--active" data-category="all">All</button>
  </nav>

  <main class="grid" id="grid"></main>

  <button class="fab" id="addBtn">+</button>

  <!-- Add Modal -->
  <div class="modal" id="addModal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__content">
      <div class="modal__header">
        <h2 class="modal__title">Add Links</h2>
        <button class="modal__close" data-close>&times;</button>
      </div>
      <form id="addForm" class="add-form">
        <textarea id="linkInput" class="add-form__input" placeholder="https://example.com

Paste one or many links. Notes are ignored." rows="6"></textarea>
        <div class="add-form__status" id="formStatus"></div>
        <button type="submit" class="add-form__submit">Add</button>
      </form>
    </div>
  </div>

  <!-- Detail Overlay -->
  <div class="overlay" id="overlay">
    <div class="overlay__backdrop" data-close></div>
    <div class="overlay__content">
      <button class="overlay__close" data-close>&times;</button>
      <img class="overlay__image" id="overlayImage" src="" alt="">
      <div class="overlay__details">
        <h2 class="overlay__title" id="overlayTitle"></h2>
        <p class="overlay__domain" id="overlayDomain"></p>
        <p class="overlay__description" id="overlayDescription"></p>
        <div class="overlay__meta">
          <span class="overlay__category" id="overlayCategory"></span>
          <span class="overlay__date" id="overlayDate"></span>
        </div>
        <div class="overlay__actions">
          <a class="overlay__link" id="overlayLink" href="" target="_blank">Visit</a>
          <button class="overlay__action" id="overlayRecategorize">Move</button>
          <button class="overlay__action overlay__action--danger" id="overlayDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal modal--small" id="categoryModal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__content">
      <div class="modal__header">
        <h2 class="modal__title">Move to Category</h2>
        <button class="modal__close" data-close>&times;</button>
      </div>
      <div class="category-list" id="categoryList"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Dev Menu -->
  <div class="dev-menu" id="devMenu">
    <div class="dev-menu__title">Dev Menu (Ctrl+Shift+D)</div>
    <button class="dev-menu__btn" id="devExport">Export Data</button>
    <button class="dev-menu__btn" id="devRefetch">Refetch All Images</button>
    <button class="dev-menu__btn dev-menu__btn--danger" id="devClearAll">Clear All Data</button>
  </div>

  <!-- Confirm Modal -->
  <div class="modal modal--small" id="confirmModal">
    <div class="modal__backdrop"></div>
    <div class="modal__content">
      <div class="modal__header">
        <h2 class="modal__title" id="confirmTitle">Confirm</h2>
      </div>
      <div style="padding: var(--space-4);">
        <p id="confirmMessage" style="margin-bottom: var(--space-4); font-family: var(--font-serif);"></p>
        <div style="display: flex; gap: var(--space-2);">
          <button class="overlay__action" id="confirmCancel" style="flex: 1;">Cancel</button>
          <button class="overlay__action overlay__action--danger" id="confirmOk" style="flex: 1; background: var(--fg); color: var(--bg);">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script>
// ============================================
// Things I Like - Single File App
// ============================================

(function() {
  'use strict';

  // ============================================
  // URL Parser
  // ============================================
  const URL_REGEX = /(?:https?:\/\/)?(?:www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&//=]*)/gi;

  function extractUrls(text) {
    if (!text) return [];
    const matches = text.match(URL_REGEX) || [];
    return matches.map(normalizeUrl).filter(Boolean).filter((u, i, a) => a.indexOf(u) === i);
  }

  function normalizeUrl(url) {
    if (!url) return null;
    let n = url.trim().toLowerCase();
    if (!n.startsWith('http://') && !n.startsWith('https://')) {
      n = 'https://' + n;
    }
    n = n.replace(/\/+$/, '');
    try { new URL(n); return n; } catch { return null; }
  }

  function extractDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
  }

  function generateId(url) {
    let h = 0;
    for (let i = 0; i < url.length; i++) {
      h = ((h << 5) - h) + url.charCodeAt(i);
      h = h & h;
    }
    return Math.abs(h).toString(36);
  }

  // ============================================
  // Metadata Fetcher
  // ============================================
  const CORS_PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?'
  ];
  const FETCH_TIMEOUT = 15000; // 15 seconds
  const MAX_RETRIES = 2;

  // Strip tracking parameters to make URLs shorter/faster
  function cleanUrl(url) {
    try {
      const u = new URL(url);
      const dominated = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'utm_id',
        'fbclid', 'gclid', 'tw_source', 'tw_adid', 'sl_source_ad_platform', 'sl_source_campaign_id',
        'sl_source_placement', 'sl_source_ad_id', 'adset_name', 'ad_name', 'campaign_id', 'ad_id', 'media_type'];
      for (const p of dominated) u.searchParams.delete(p);
      return u.toString();
    } catch { return url; }
  }

  async function fetchWithTimeout(url, timeout) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      return res;
    } catch (e) {
      clearTimeout(id);
      throw e;
    }
  }

  async function fetchMetadata(url) {
    const domain = extractDomain(url);
    const meta = { title: domain, description: '', image: null, domain };

    // Clean URL to remove tracking params (makes fetch faster)
    const fetchUrl = cleanUrl(url);

    let html = null;
    let lastError = null;

    // Try each proxy with retries
    for (const proxy of CORS_PROXIES) {
      for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
        try {
          const res = await fetchWithTimeout(proxy + encodeURIComponent(fetchUrl), FETCH_TIMEOUT);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          html = await res.text();
          break;
        } catch (e) {
          lastError = e;
          if (attempt < MAX_RETRIES) {
            await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
          }
        }
      }
      if (html) break;
    }

    if (!html) {
      meta.title = generateTitleFromUrl(url);
      return meta;
    }

    try {
      // Title
      const ogTitle = html.match(/<meta[^>]*property=["']og:title["'][^>]*content=["']([^"']*)["']/i) ||
                      html.match(/<meta[^>]*content=["']([^"']*)["'][^>]*property=["']og:title["']/i);
      const title = html.match(/<title[^>]*>([^<]*)<\/title>/i);
      if (ogTitle) meta.title = decodeEntities(ogTitle[1]);
      else if (title) meta.title = decodeEntities(title[1]);

      // Description
      const ogDesc = html.match(/<meta[^>]*property=["']og:description["'][^>]*content=["']([^"']*)["']/i) ||
                     html.match(/<meta[^>]*content=["']([^"']*)["'][^>]*property=["']og:description["']/i);
      const desc = html.match(/<meta[^>]*name=["']description["'][^>]*content=["']([^"']*)["']/i);
      if (ogDesc) meta.description = decodeEntities(ogDesc[1]);
      else if (desc) meta.description = decodeEntities(desc[1]);

      // Image - try multiple patterns with more flexible regex
      let ogImg = html.match(/<meta[^>]*property\s*=\s*["']og:image["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                  html.match(/<meta[^>]*content\s*=\s*["']([^"']+)["'][^>]*property\s*=\s*["']og:image["']/i);

      // Try twitter:image
      if (!ogImg) {
        ogImg = html.match(/<meta[^>]*name\s*=\s*["']twitter:image["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                html.match(/<meta[^>]*content\s*=\s*["']([^"']+)["'][^>]*name\s*=\s*["']twitter:image["']/i) ||
                html.match(/<meta[^>]*name\s*=\s*["']twitter:image:src["'][^>]*content\s*=\s*["']([^"']+)["']/i);
      }

      // Try og:image:url and og:image:secure_url
      if (!ogImg) {
        ogImg = html.match(/<meta[^>]*property\s*=\s*["']og:image:url["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                html.match(/<meta[^>]*property\s*=\s*["']og:image:secure_url["'][^>]*content\s*=\s*["']([^"']+)["']/i);
      }

      // Try itemprop image (schema.org)
      if (!ogImg) {
        ogImg = html.match(/<meta[^>]*itemprop\s*=\s*["']image["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                html.match(/<link[^>]*rel\s*=\s*["']image_src["'][^>]*href\s*=\s*["']([^"']+)["']/i);
      }

      // Fallback: try to find first significant image tag
      if (!ogImg) {
        const imgMatch = html.match(/<img[^>]*src\s*=\s*["']([^"']+)["'][^>]*>/gi);
        if (imgMatch) {
          for (const img of imgMatch.slice(0, 5)) {
            const src = img.match(/src\s*=\s*["']([^"']+)["']/i);
            if (src && src[1] && !src[1].includes('logo') && !src[1].includes('icon') && !src[1].includes('sprite')) {
              ogImg = [null, src[1]];
              break;
            }
          }
        }
      }

      if (ogImg) {
        let img = ogImg[1];
        // Skip logos, favicons, icons
        const imgLower = img.toLowerCase();
        if (imgLower.includes('logo') || imgLower.includes('favicon') || imgLower.includes('icon') || imgLower.includes('sprite') || imgLower.includes('profile')) {
          // Try to find a product image instead
          const productImg = html.match(/<img[^>]*class\s*=\s*["'][^"']*product[^"']*["'][^>]*src\s*=\s*["']([^"']+)["']/i) ||
                            html.match(/<img[^>]*src\s*=\s*["']([^"']+)["'][^>]*class\s*=\s*["'][^"']*product[^"']*["']/i) ||
                            html.match(/<img[^>]*data-src\s*=\s*["']([^"']+)["']/i);
          if (productImg && productImg[1]) {
            img = productImg[1];
          } else {
            // Try first significant image that's not a logo
            const imgMatch = html.match(/<img[^>]*src\s*=\s*["']([^"']+)["'][^>]*>/gi);
            if (imgMatch) {
              for (const imgTag of imgMatch.slice(0, 10)) {
                const src = imgTag.match(/src\s*=\s*["']([^"']+)["']/i);
                if (src && src[1]) {
                  const srcLower = src[1].toLowerCase();
                  if (!srcLower.includes('logo') && !srcLower.includes('favicon') && !srcLower.includes('icon') && !srcLower.includes('sprite') && !srcLower.includes('profile') && !srcLower.includes('avatar')) {
                    img = src[1];
                    break;
                  }
                }
              }
            }
          }
        }
        if (!img.startsWith('http')) {
          try { img = new URL(img, url).href; } catch {}
        }
        // Final check - don't use if still a logo
        const finalLower = img.toLowerCase();
        if (!finalLower.includes('logo') && !finalLower.includes('favicon') && !finalLower.includes('icon')) {
          meta.image = img;
        }
      }
    } catch (parseErr) {
      // Parse error - continue with defaults
    }

    return meta;
  }

  function decodeEntities(text) {
    const t = document.createElement('textarea');
    t.innerHTML = text;
    return t.value.trim();
  }

  function generateTitleFromUrl(url) {
    try {
      const u = new URL(url);
      const p = u.pathname.replace(/^\/|\/$/g, '').replace(/[-_]/g, ' ').replace(/\.[^.]+$/, '');
      if (p) return p.split('/').pop().replace(/\b\w/g, c => c.toUpperCase());
      return u.hostname.replace(/^www\./, '');
    } catch { return url; }
  }

  // ============================================
  // Categorizer
  // ============================================
  const PATTERNS = {
    wear: {
      kw: ['jacket', 'shirt', 'pants', 'jeans', 'dress', 'coat', 'sweater', 'hoodie', 'tee', 't-shirt', 'shorts', 'skirt', 'blazer', 'suit', 'windbreaker', 'outerwear', 'knitwear', 'denim', 'trousers', 'vest', 'cardigan', 'beanie', 'hat', 'cap', 'scarf', 'gloves', 'bag', 'backpack', 'tote', 'jewelry', 'jewellery', 'ring', 'necklace', 'earring', 'bracelet', 'pendant', 'chain', 'gold', 'silver', 'sterling', 'signet', 'hoop', 'cuff', 'bangle', 'shoe', 'shoes', 'sneaker', 'sneakers', 'boot', 'boots', 'sandal', 'loafer', 'oxford', 'runner', 'trainer', 'footwear', 'heel', 'flat'],
      domains: ['ssense.com', 'endclothing.com', 'mrporter.com', 'grailed.com', 'farfetch.com', 'matchesfashion.com', 'net-a-porter.com', 'mejuri.com', 'catbirdnyc.com', 'auratenewyork.com', 'stockx.com', 'goat.com', 'nike.com', 'adidas.com', 'newbalance.com']
    },
    watch: {
      kw: ['video', 'music', 'podcast', 'album', 'song', 'movie', 'film', 'stream', 'listen', 'playlist', 'track', 'artist', 'band', 'concert', 'episode', 'series', 'show'],
      domains: ['youtube.com', 'youtu.be', 'spotify.com', 'soundcloud.com', 'vimeo.com', 'bandcamp.com', 'tiktok.com', 'netflix.com']
    },
    use: {
      kw: ['app', 'software', 'tool', 'github', 'npm', 'library', 'framework', 'api', 'code', 'extension', 'plugin', 'developer', 'visualizer', 'utility', 'product'],
      domains: ['github.com', 'gitlab.com', 'npmjs.com', 'producthunt.com']
    },
    eat: {
      kw: ['restaurant', 'cafe', 'bar', 'food', 'dining', 'menu', 'recipe', 'cook', 'cuisine', 'meal', 'dish', 'chef', 'reservation', 'brunch', 'dinner', 'lunch'],
      domains: ['yelp.com', 'tripadvisor.com', 'opentable.com', 'doordash.com', 'ubereats.com', 'resy.com']
    },
    go: {
      kw: ['hotel', 'travel', 'map', 'city', 'venue', 'booking', 'destination', 'trip', 'flight', 'stay', 'vacation', 'visit', 'explore'],
      domains: ['google.com/maps', 'airbnb.com', 'booking.com', 'expedia.com']
    },
    follow: {
      kw: ['profile', 'portfolio', 'about', 'bio', 'founder', 'creator', 'designer', 'author', 'interview', 'person'],
      domains: ['linkedin.com', 'twitter.com', 'x.com', 'instagram.com', 'behance.net', 'dribbble.com']
    },
    read: {
      kw: ['article', 'essay', 'blog', 'opinion', 'thought', 'idea', 'research', 'paper', 'guide', 'tutorial', 'learn', 'book', 'review', 'news', 'story'],
      domains: ['medium.com', 'substack.com', 'wikipedia.org', 'news.ycombinator.com', 'nytimes.com', 'theguardian.com']
    }
  };

  function categorize(link) {
    const text = `${link.title || ''} ${link.description || ''} ${link.url || ''}`.toLowerCase();
    let best = 'uncategorized', maxScore = 0;

    for (const [cat, p] of Object.entries(PATTERNS)) {
      let score = 0;
      // Domain match gives 0.5
      for (const d of p.domains) {
        if ((link.domain || '').includes(d) || (link.url || '').includes(d)) {
          score += 0.5;
          break;
        }
      }
      // Keyword match gives 0.15 each (so 2 matches = 0.3 which passes threshold)
      for (const k of p.kw) {
        if (text.includes(k)) score += 0.15;
      }
      score = Math.min(score, 1);
      if (score > maxScore) { maxScore = score; best = cat; }
    }

    // Lower threshold to 0.15 (single keyword match is enough)
    return { category: maxScore >= 0.15 ? best : 'uncategorized', confidence: maxScore };
  }

  function detectClusters(items) {
    if (!items || items.length < 3) return [];
    const domainGroups = {};
    for (const item of items) {
      const d = item.domain || 'unknown';
      if (!domainGroups[d]) domainGroups[d] = [];
      domainGroups[d].push(item);
    }
    const clusters = [];
    for (const [domain, list] of Object.entries(domainGroups)) {
      if (list.length >= 3) {
        clusters.push({ name: domain.split('.')[0], items: list });
      }
    }
    return clusters;
  }

  // ============================================
  // Storage
  // ============================================
  const STORAGE_KEY = 'things-i-like';

  function load() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) {
        const data = JSON.parse(d);
        // Ensure linkOrder exists
        if (!data.linkOrder) data.linkOrder = data.links.map(l => l.id);
        return data;
      }
    } catch {}
    return { links: [], categories: { uncategorized: { pinned: true } }, linkOrder: [] };
  }

  function save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getAllLinks() { return load().links; }
  function getCategories() { return load().categories; }

  function findByUrl(url) {
    const n = url.toLowerCase().replace(/\/+$/, '');
    return getAllLinks().find(l => l.url.toLowerCase().replace(/\/+$/, '') === n);
  }

  function addLink(link) {
    const existing = findByUrl(link.url);
    const data = load();

    if (existing) {
      // Update existing item, but preserve existing data if new data is worse
      const i = data.links.findIndex(l => l.id === existing.id);
      if (i !== -1) {
        // Preserve existing image/description/title if new ones are empty
        const mergedImage = link.image || existing.image;
        const mergedDescription = link.description || existing.description;
        const mergedTitle = (link.title && link.title !== link.domain) ? link.title : existing.title;

        data.links[i] = {
          ...existing,
          ...link,
          image: mergedImage,
          description: mergedDescription,
          title: mergedTitle,
          id: existing.id, // Keep original ID
          addedAt: existing.addedAt, // Keep original add date
          updatedAt: new Date().toISOString()
        };
      }
      if (!data.categories[link.category]) {
        data.categories[link.category] = { pinned: false };
      }
      save(data);
      return { success: true, updated: true };
    }

    data.links.push({ ...link, addedAt: new Date().toISOString() });
    // Add to beginning of order (newest first)
    if (!data.linkOrder) data.linkOrder = [];
    data.linkOrder.unshift(link.id);
    if (!data.categories[link.category]) {
      data.categories[link.category] = { pinned: false };
    }
    save(data);
    return { success: true };
  }

  function updateLink(id, updates) {
    const data = load();
    const i = data.links.findIndex(l => l.id === id);
    if (i === -1) throw new Error('Not found');
    data.links[i] = { ...data.links[i], ...updates };
    if (updates.category && !data.categories[updates.category]) {
      data.categories[updates.category] = { pinned: false };
    }
    save(data);
  }

  function deleteLink(id) {
    console.log('[deleteLink] Deleting id:', id);
    const data = load();
    const before = data.links.length;
    data.links = data.links.filter(l => l.id !== id);
    const after = data.links.length;
    console.log('[deleteLink] Links before:', before, 'after:', after);
    if (data.linkOrder) data.linkOrder = data.linkOrder.filter(i => i !== id);
    save(data);
    console.log('[deleteLink] Saved');
  }

  function reorderLinks(fromId, toId, position = 'before') {
    const data = load();
    if (!data.linkOrder) data.linkOrder = data.links.map(l => l.id);
    const fromIdx = data.linkOrder.indexOf(fromId);
    let toIdx = data.linkOrder.indexOf(toId);
    if (fromIdx === -1 || toIdx === -1) return;
    // Remove from old position
    data.linkOrder.splice(fromIdx, 1);
    // Recalculate target index after removal
    toIdx = data.linkOrder.indexOf(toId);
    // Insert at new position (after target if position is 'after')
    const insertIdx = position === 'after' ? toIdx + 1 : toIdx;
    data.linkOrder.splice(insertIdx, 0, fromId);
    save(data);
  }

  function createCategory(name) {
    const data = load();
    const n = name.toLowerCase().replace(/\s+/g, '-');
    if (data.categories[n]) throw new Error('Category exists');
    data.categories[n] = { pinned: false };
    save(data);
    return n;
  }

  function bulkMove(ids, category) {
    const data = load();
    for (const id of ids) {
      const i = data.links.findIndex(l => l.id === id);
      if (i !== -1) data.links[i].category = category;
    }
    if (!data.categories[category]) data.categories[category] = { pinned: false };
    save(data);
  }

  // ============================================
  // App State
  // ============================================
  let currentFilter = 'all';
  let selectedLink = null;

  // ============================================
  // DOM
  // ============================================
  const $ = id => document.getElementById(id);
  const grid = $('grid');
  const filters = $('filters');
  const addModal = $('addModal');
  const addForm = $('addForm');
  const linkInput = $('linkInput');
  const formStatus = $('formStatus');
  const overlay = $('overlay');
  const categoryModal = $('categoryModal');
  const categoryList = $('categoryList');
  const toastContainer = $('toastContainer');

  // ============================================
  // Render
  // ============================================
  function renderFilters() {
    const cats = getCategories();
    const links = getAllLinks();
    const counts = { all: links.length };
    for (const l of links) counts[l.category] = (counts[l.category] || 0) + 1;

    let html = `<button class="filter-token ${currentFilter === 'all' ? 'filter-token--active' : ''}" data-category="all">All</button>`;

    const sorted = Object.entries(cats)
      .filter(([n]) => counts[n] > 0 && n !== 'uncategorized')
      .sort((a, b) => (b[1].pinned ? 1 : 0) - (a[1].pinned ? 1 : 0) || (counts[b[0]] || 0) - (counts[a[0]] || 0));

    for (const [name] of sorted) {
      const c = counts[name] || 0;
      const active = currentFilter === name ? 'filter-token--active' : '';
      const badge = name === 'uncategorized' && c > 0 ? ` (${c})` : '';
      html += `<button class="filter-token ${active}" data-category="${name}">${cap(name)}${badge}</button>`;
    }

    filters.innerHTML = html;
  }

  function renderGrid() {
    const allLinks = getAllLinks();
    const links = currentFilter === 'all' ? allLinks : allLinks.filter(l => l.category === currentFilter);

    if (links.length === 0) {
      grid.innerHTML = `<div class="empty-state">
        <div class="empty-state__box">
          <p class="empty-state__text">
            Save links you like. Paste URLs anywhere on this page or click + to add.<br><br>
            Links are auto-categorized and stored locally in your browser.
          </p>
        </div>
      </div>`;
      return;
    }

    // Sort by saved order, fallback to date
    const data = load();
    const order = data.linkOrder || [];
    const sorted = [...links].sort((a, b) => {
      const aIdx = order.indexOf(a.id);
      const bIdx = order.indexOf(b.id);
      if (aIdx === -1 && bIdx === -1) return new Date(b.addedAt) - new Date(a.addedAt);
      if (aIdx === -1) return 1;
      if (bIdx === -1) return -1;
      return aIdx - bIdx;
    });

    let html = '';

    for (const l of sorted) {
      const hasImg = l.image && l.image.length > 0;
      const initial = l.title ? l.title.charAt(0).toUpperCase() : '?';

      if (hasImg) {
        html += `<article class="grid-item" data-id="${l.id}" draggable="true">
          <img class="grid-item__image" src="${l.image}" alt="" loading="lazy">
          <div class="grid-item__overlay"><h3 class="grid-item__title">${esc(l.title)}</h3><p class="grid-item__domain">${esc(l.domain)}</p></div>
          <span class="grid-item__category">${cap(l.category)}</span>
        </article>`;
      } else {
        html += `<article class="grid-item grid-item--placeholder" data-id="${l.id}" draggable="true">
          <span class="grid-item__initial">${initial}</span>
          <div class="grid-item__overlay"><h3 class="grid-item__title">${esc(l.title)}</h3><p class="grid-item__domain">${esc(l.domain)}</p></div>
          <span class="grid-item__category">${cap(l.category)}</span>
        </article>`;
      }
    }

    grid.innerHTML = html;
  }

  // ============================================
  // Events
  // ============================================
  $('addBtn').onclick = () => openModal(addModal);

  addForm.onsubmit = async (e) => {
    e.preventDefault();
    const text = linkInput.value.trim();
    if (!text) return;

    const urls = extractUrls(text);
    if (urls.length === 0) {
      showStatus('No valid URLs found', true);
      return;
    }

    showStatus(`Processing ${urls.length} link${urls.length > 1 ? 's' : ''}...`);
    let added = 0, updated = 0, failed = 0;

    for (const url of urls) {
      try {
        const meta = await fetchMetadata(url);
        const cat = categorize(meta);
        const linkObj = { id: generateId(url), url, ...meta, category: cat.category, confidence: cat.confidence };
        const result = addLink(linkObj);
        if (result.success) {
          if (result.updated) updated++;
          else added++;
        }
      } catch (err) {
        failed++;
      }
    }

    const parts = [];
    if (added > 0) parts.push(`Added ${added}`);
    if (updated > 0) parts.push(`Updated ${updated}`);
    if (failed > 0) parts.push(`${failed} failed`);

    if (added > 0 || updated > 0) {
      showStatus(parts.join(', '));
      linkInput.value = '';
      renderFilters();
      renderGrid();
      checkClusters();
      setTimeout(() => { closeModal(addModal); showStatus(''); }, 800);
    } else if (failed > 0) {
      showStatus(parts.join(', '), true);
    }
  };

  filters.onclick = (e) => {
    const t = e.target.closest('.filter-token');
    if (t) {
      currentFilter = t.dataset.category;
      renderFilters();
      renderGrid();
    }
  };

  grid.onclick = (e) => {
    const item = e.target.closest('.grid-item');
    if (item && !isDragging) openDetail(item.dataset.id);
  };

  // Drag and drop reordering
  let draggedId = null;
  let isDragging = false;
  let dropPosition = null; // 'before' or 'after'

  function clearDragClasses() {
    grid.querySelectorAll('.drag-before, .drag-after').forEach(el => {
      el.classList.remove('drag-before', 'drag-after');
    });
  }

  grid.ondragstart = (e) => {
    const item = e.target.closest('.grid-item');
    if (!item) return;
    draggedId = item.dataset.id;
    isDragging = true;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedId);
  };

  grid.ondragend = (e) => {
    const item = e.target.closest('.grid-item');
    if (item) item.classList.remove('dragging');
    clearDragClasses();
    draggedId = null;
    dropPosition = null;
    setTimeout(() => { isDragging = false; }, 100);
  };

  grid.ondragover = (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const item = e.target.closest('.grid-item');
    if (item && item.dataset.id !== draggedId) {
      // Determine if dropping before or after based on mouse position
      const rect = item.getBoundingClientRect();
      const midX = rect.left + rect.width / 2;
      const isBefore = e.clientX < midX;

      clearDragClasses();
      item.classList.add(isBefore ? 'drag-before' : 'drag-after');
      dropPosition = isBefore ? 'before' : 'after';
    }
  };

  grid.ondragleave = (e) => {
    const item = e.target.closest('.grid-item');
    if (item) {
      item.classList.remove('drag-before', 'drag-after');
    }
  };

  grid.ondrop = (e) => {
    e.preventDefault();
    const targetItem = e.target.closest('.grid-item');
    if (!targetItem || !draggedId) return;
    clearDragClasses();
    const targetId = targetItem.dataset.id;
    if (draggedId !== targetId) {
      reorderLinks(draggedId, targetId, dropPosition);
      renderGrid();
    }
  };

  $('overlayRecategorize').onclick = () => { closeModal(overlay); openCategorySelect(); };
  $('overlayDelete').onclick = async (e) => {
    e.stopPropagation();
    if (!selectedLink) return;
    const confirmed = await showConfirm('Delete this link?', 'Delete');
    if (confirmed) {
      deleteLink(selectedLink.id);
      closeModal(overlay);
      renderFilters();
      renderGrid();
      toast('Deleted');
    }
  };

  document.querySelectorAll('[data-close]').forEach(el => {
    el.onclick = (e) => {
      const m = e.target.closest('.modal, .overlay');
      if (m) closeModal(m);
    };
  });

  document.onkeydown = (e) => {
    if (e.key === 'Escape') closeAll();
    // Ctrl+Shift+D toggles dev menu
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'd') {
      e.preventDefault();
      $('devMenu').classList.toggle('dev-menu--visible');
    }
  };

  // ============================================
  // Dev Menu
  // ============================================
  $('devClearAll').onclick = async () => {
    const first = await showConfirm('Delete ALL links and categories? This cannot be undone.', 'Clear All Data');
    if (!first) return;
    const second = await showConfirm('Are you sure? This will clear everything.', 'Final Warning');
    if (second) {
      localStorage.removeItem(STORAGE_KEY);
      renderFilters();
      renderGrid();
      $('devMenu').classList.remove('dev-menu--visible');
      toast('All data cleared');
    }
  };

  $('devExport').onclick = () => {
    const data = load();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'things-i-like-backup.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Data exported');
  };

  $('devRefetch').onclick = async () => {
    const links = getAllLinks().filter(l => !l.image);
    if (links.length === 0) {
      toast('No links missing images');
      return;
    }
    toast(`Refetching ${links.length} links...`);
    $('devMenu').classList.remove('dev-menu--visible');

    let updated = 0;
    for (const link of links) {
      try {
        const meta = await fetchMetadata(link.url);
        if (meta.image) {
          updateLink(link.id, { image: meta.image });
          updated++;
        }
      } catch (e) {
        // Fetch failed, continue
      }
    }
    renderGrid();
    toast(`Updated ${updated} of ${links.length} links`);
  };

  // ============================================
  // Helpers
  // ============================================
  function openModal(m) { m.classList.add('modal--visible', 'overlay--visible'); }
  function closeModal(m) { m.classList.remove('modal--visible', 'overlay--visible'); }
  function closeAll() { [addModal, overlay, categoryModal, confirmModal].forEach(closeModal); }

  // Custom confirm dialog (native confirm() is blocked in some contexts)
  const confirmModal = $('confirmModal');
  const confirmTitle = $('confirmTitle');
  const confirmMessage = $('confirmMessage');
  const confirmOkBtn = $('confirmOk');
  const confirmCancelBtn = $('confirmCancel');

  function showConfirm(message, title = 'Confirm') {
    return new Promise((resolve) => {
      confirmTitle.textContent = title;
      confirmMessage.textContent = message;
      openModal(confirmModal);

      const cleanup = () => {
        confirmOkBtn.onclick = null;
        confirmCancelBtn.onclick = null;
        closeModal(confirmModal);
      };

      confirmOkBtn.onclick = () => { cleanup(); resolve(true); };
      confirmCancelBtn.onclick = () => { cleanup(); resolve(false); };
    });
  }

  function openDetail(id) {
    console.log('[openDetail] Opening id:', id);
    const l = getAllLinks().find(x => x.id === id);
    if (!l) {
      console.log('[openDetail] Link not found');
      return;
    }
    selectedLink = l;
    console.log('[openDetail] selectedLink set to:', l.id, l.title);
    $('overlayImage').src = l.image || '';
    $('overlayImage').style.display = l.image ? 'block' : 'none';
    $('overlayTitle').textContent = l.title;
    $('overlayDomain').textContent = l.domain;
    $('overlayDescription').textContent = l.description || '';
    $('overlayCategory').textContent = cap(l.category);
    $('overlayDate').textContent = new Date(l.addedAt).toLocaleDateString();
    $('overlayLink').href = l.url;
    openModal(overlay);
  }

  function openCategorySelect() {
    const cats = getCategories();
    let html = '';
    for (const n of Object.keys(cats)) {
      const active = selectedLink && selectedLink.category === n ? 'category-list__item--active' : '';
      html += `<button class="category-list__item ${active}" data-cat="${n}">${cap(n)}</button>`;
    }
    html += `<button class="category-list__item" data-cat="__new__">+ New category</button>`;
    categoryList.innerHTML = html;

    categoryList.onclick = (e) => {
      const btn = e.target.closest('.category-list__item');
      if (!btn) return;
      const cat = btn.dataset.cat;
      if (cat === '__new__') {
        const name = prompt('Category name:');
        if (name && name.trim()) {
          const n = createCategory(name.trim());
          recategorize(n);
        }
      } else {
        recategorize(cat);
      }
    };

    openModal(categoryModal);
  }

  function recategorize(cat) {
    if (!selectedLink) return;
    updateLink(selectedLink.id, { category: cat });
    closeModal(categoryModal);
    renderFilters();
    renderGrid();
    toast('Moved to ' + cap(cat));
  }

  function checkClusters() {
    const uncat = getAllLinks().filter(l => l.category === 'uncategorized');
    const clusters = detectClusters(uncat);
    if (clusters.length > 0) {
      const c = clusters[0];
      setTimeout(() => {
        if (confirm(`Found ${c.items.length} links from "${c.name}".\n\nCreate category?`)) {
          const n = createCategory(c.name);
          bulkMove(c.items.map(i => i.id), n);
          renderFilters();
          renderGrid();
          toast(`Created "${cap(n)}"`);
        }
      }, 500);
    }
  }

  function showStatus(msg, err) {
    formStatus.textContent = msg;
    formStatus.className = 'add-form__status' + (err ? ' add-form__status--error' : '');
  }

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' toast--error' : '');
    t.textContent = msg;
    toastContainer.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ============================================
  // Direct paste processing
  // ============================================
  async function processLinks(text) {
    const urls = extractUrls(text);

    if (urls.length === 0) {
      toast('No valid URLs found', true);
      return;
    }

    toast(`Processing ${urls.length} link${urls.length > 1 ? 's' : ''}...`);

    let added = 0, updated = 0, failed = 0;
    for (const url of urls) {
      try {
        const meta = await fetchMetadata(url);
        const cat = categorize(meta);
        const linkObj = { id: generateId(url), url, ...meta, category: cat.category, confidence: cat.confidence };
        const result = addLink(linkObj);
        if (result.success) {
          if (result.updated) updated++;
          else added++;
        }
      } catch (err) {
        failed++;
      }
    }

    const parts = [];
    if (added > 0) parts.push(`${added} added`);
    if (updated > 0) parts.push(`${updated} updated`);
    if (failed > 0) parts.push(`${failed} failed`);

    if (added > 0 || updated > 0) {
      toast(parts.join(', '));
      renderFilters();
      renderGrid();
      checkClusters();
    } else if (failed > 0) {
      toast(parts.join(', '), true);
    }
  }

  // ============================================
  // Re-categorize uncategorized items
  // ============================================
  function recategorizeUncategorized() {
    const uncategorized = getAllLinks().filter(l => l.category === 'uncategorized');
    if (uncategorized.length === 0) return;

    let moved = 0;
    for (const link of uncategorized) {
      const cat = categorize(link);
      if (cat.category !== 'uncategorized') {
        updateLink(link.id, { category: cat.category, confidence: cat.confidence });
        moved++;
      }
    }

    if (moved > 0) {
      renderFilters();
      renderGrid();
      toast(`Recategorized ${moved} item${moved > 1 ? 's' : ''}`);
    }
  }

  // ============================================
  // Theme Toggle
  // ============================================
  const themeToggle = $('themeToggle');
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'light') {
    document.documentElement.classList.add('light');
  }

  themeToggle.onclick = () => {
    const isLight = document.documentElement.classList.toggle('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  };

  // ============================================
  // Init
  // ============================================
  renderFilters();
  renderGrid();

  // Re-check uncategorized items on load
  recategorizeUncategorized();

  // Listen for paste anywhere on page
  document.addEventListener('paste', (e) => {
    // Don't intercept if pasting into textarea/input
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

    const text = e.clipboardData.getData('text');
    if (text && extractUrls(text).length > 0) {
      e.preventDefault();
      processLinks(text);
    }
  });

})();
  </script>
</body>
</html>
