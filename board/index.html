<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board</title>

  <!-- Space Grotesk Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
/* ============================================
   Board - Swiss Grid + Web 1.0 Typography
   ============================================ */

:root {
  /* Typography - Space Grotesk */
  --font-primary: "Space Grotesk", sans-serif;
  --font-serif: "Space Grotesk", sans-serif;
  --font-mono: "Space Grotesk", sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;
  --line-height-tight: 1.2;
  --line-height-normal: 1.6;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* Grid */
  --grid-gap: 16px;

  /* Dark mode (default) */
  --bg: #111;
  --fg: #fff;
  --surface: #1a1a1a;
  --border: #fff;
  --muted: #888;
  --subtle: #333;
}

:root.light {
  --bg: #fff;
  --fg: #000;
  --surface: #fff;
  --border: #000;
  --muted: #888;
  --subtle: #e0e0e0;
}

/* Progress bar */
.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--subtle);
  z-index: 1000;
  display: none;
}

.progress-bar--visible {
  display: block;
}

.progress-bar__fill {
  height: 100%;
  background: var(--fg);
  width: 0%;
  transition: width 0.2s ease;
}

.progress-status {
  position: fixed;
  top: var(--space-4);
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--fg);
  padding: var(--space-2) var(--space-4);
  z-index: 1000;
  display: none;
}

.progress-status--visible {
  display: block;
}

/* Auth bar */
.auth-bar {
  position: fixed;
  top: var(--space-4);
  right: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  z-index: 100;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.auth-bar__user {
  color: var(--muted);
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.auth-bar__btn {
  padding: var(--space-1) var(--space-3);
  background: transparent;
  border: 1px solid var(--fg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.auth-bar__btn:hover {
  background: var(--fg);
  color: var(--bg);
}

/* Auth modal */
.auth-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.auth-modal--visible {
  display: flex;
}

.auth-modal__content {
  background: var(--bg);
  border: 1px solid var(--fg);
  padding: var(--space-6);
  max-width: 320px;
  width: 90%;
}

.auth-modal__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-lg);
  margin-bottom: var(--space-4);
}

.auth-modal__input {
  width: 100%;
  padding: var(--space-3);
  border: 1px solid var(--fg);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  margin-bottom: var(--space-4);
  box-sizing: border-box;
}

.auth-modal__input:focus {
  outline: none;
  box-shadow: 0 0 0 1px var(--fg);
}

.auth-modal__submit {
  width: 100%;
  padding: var(--space-3);
  background: var(--fg);
  color: var(--bg);
  border: 1px solid var(--fg);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: opacity 0.15s;
}

.auth-modal__submit:hover {
  opacity: 0.9;
}

.auth-modal__submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.auth-modal__status {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  margin-top: var(--space-3);
  text-align: center;
}

.auth-modal__status--error {
  color: #c00;
}

.auth-modal__close {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  background: none;
  border: none;
  color: var(--fg);
  font-size: var(--font-size-lg);
  cursor: pointer;
  padding: var(--space-2);
}

/* Theme toggle */
.theme-toggle {
  position: fixed;
  bottom: var(--space-4);
  left: var(--space-4);
  width: 32px;
  height: 18px;
  background: transparent;
  border: 1px solid var(--fg);
  cursor: pointer;
  z-index: 100;
  padding: 2px;
  transition: background 0.2s ease;
}

.theme-toggle__knob {
  width: 12px;
  height: 12px;
  background: var(--fg);
  transition: transform 0.2s ease;
  transform: translateX(0);
}

:root.light .theme-toggle {
  background: var(--fg);
}

:root.light .theme-toggle__knob {
  background: var(--bg);
  transform: translateX(14px);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
}

body {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
  color: var(--fg);
  background: var(--bg);
  transition: background 0.3s ease, color 0.3s ease;
}

/* ============================================
   Floating Add Button
   ============================================ */
.fab {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  width: 24px;
  height: 24px;
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  background: var(--fg);
  color: var(--bg);
  border: none;
  cursor: pointer;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab:hover {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
}

/* ============================================
   Filters
   ============================================ */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-4);
  border-bottom: 1px solid var(--subtle);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

.filter-token {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: var(--space-1) var(--space-3);
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--fg);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.filter-token:hover {
  background: var(--fg);
  color: var(--bg);
}

.filter-token--active {
  background: var(--fg);
  color: var(--bg);
}

/* ============================================
   Grid
   ============================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--grid-gap);
  padding: var(--space-4);
}

@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(5, 1fr); }
}

/* ============================================
   Grid Item
   ============================================ */
.grid-item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  background: var(--subtle);
  border: 1px solid var(--fg);
  transition: transform 0.1s, opacity 0.1s;
}

.grid-item.dragging {
  opacity: 0.4;
  transform: scale(0.95);
}

.grid-item.drag-before {
  transform: translateX(8px);
  box-shadow: -4px 0 0 0 var(--fg);
}

.grid-item.drag-after {
  transform: translateX(-8px);
  box-shadow: 4px 0 0 0 var(--fg);
}

.grid-item__image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(1.1);
  transition: filter 0.2s;
}

.grid-item:hover .grid-item__image {
  filter: grayscale(0%);
}

.grid-item__overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: var(--space-3);
  background: var(--bg);
  border-top: 1px solid var(--fg);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__overlay {
  opacity: 1;
}

@media (hover: none) {
  .grid-item__overlay {
    opacity: 1;
    padding: var(--space-2);
  }
}

.grid-item__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-sm);
  font-weight: normal;
  line-height: var(--line-height-tight);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-item__domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  margin-top: 2px;
  text-decoration: underline;
}

.grid-item__category {
  position: absolute;
  top: 0;
  left: 0;
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 2px 6px;
  background: var(--bg);
  border-right: 1px solid var(--fg);
  border-bottom: 1px solid var(--fg);
  opacity: 0;
  transition: opacity 0.15s;
}

.grid-item:hover .grid-item__category {
  opacity: 1;
}

/* Placeholder */
.grid-item--placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--placeholder .grid-item__initial {
  font-family: var(--font-serif);
  font-size: var(--font-size-2xl);
  color: var(--bg);
}

/* Expanded States - Shared */
.grid-item--expanded-medium,
.grid-item--expanded-large {
  aspect-ratio: auto;
  padding: var(--space-4);
  background: var(--bg);
  position: relative;
}

.grid-item--expanded-medium .grid-item__overlay,
.grid-item--expanded-large .grid-item__overlay {
  display: none;
}

.grid-item--expanded-medium .grid-item__category,
.grid-item--expanded-large .grid-item__category {
  opacity: 1;
}

.grid-item--expanded-medium .grid-item__image,
.grid-item--expanded-large .grid-item__image {
  filter: grayscale(0%);
}

.grid-item--expanded-medium .grid-item__details,
.grid-item--expanded-large .grid-item__details {
  display: flex;
}

/* Medium State: 2×2 */
.grid-item--expanded-medium {
  grid-column: span 2;
  grid-row: span 2;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr auto;
  gap: var(--space-3);
}

.grid-item--expanded-medium .grid-item__image {
  grid-row: 1 / 2;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid-item--expanded-medium .grid-item__initial-wrap {
  grid-row: 1 / 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--expanded-medium .grid-item__details {
  grid-row: 1 / 2;
  flex-direction: column;
  gap: var(--space-2);
}

.grid-item--expanded-medium .grid-item__actions {
  grid-column: 1 / -1;
  grid-row: 2;
}

.grid-item--expanded-medium .grid-item__details-description {
  -webkit-line-clamp: 2;
}

/* Large State: 3×2 */
.grid-item--expanded-large {
  grid-column: span 3;
  grid-row: span 2;
  display: grid;
  grid-template-columns: 1fr 2fr;
  grid-template-rows: 1fr auto;
  gap: var(--space-4);
}

.grid-item--expanded-large .grid-item__image {
  grid-row: 1 / 3;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid-item--expanded-large .grid-item__initial-wrap {
  grid-row: 1 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fg);
}

.grid-item--expanded-large .grid-item__details {
  grid-row: 1 / 2;
  flex-direction: column;
  gap: var(--space-3);
}

.grid-item--expanded-large .grid-item__actions {
  grid-row: 2;
}

.grid-item--expanded-large .grid-item__details-description {
  -webkit-line-clamp: 4;
}

/* Resize Handle */
.grid-item__resize {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 24px;
  height: 24px;
  cursor: nwse-resize;
  display: none;
  align-items: flex-end;
  justify-content: flex-end;
  padding: 4px;
}

.grid-item--expanded-medium .grid-item__resize,
.grid-item--expanded-large .grid-item__resize {
  display: flex;
}

.grid-item__resize::before {
  content: '';
  width: 12px;
  height: 12px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
}

.grid-item__resize:hover::before {
  border-color: var(--fg);
}

/* Shared detail styles */
.grid-item__details {
  display: none;
  flex-direction: column;
  gap: var(--space-3);
}

.grid-item__details-title {
  font-family: var(--font-serif);
  font-size: var(--font-size-lg);
  font-weight: normal;
  line-height: var(--line-height-tight);
}

.grid-item__details-domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  text-decoration: underline;
}

.grid-item__details-description {
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  color: var(--muted);
  line-height: var(--line-height-normal);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-item__details-meta {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--muted);
  display: flex;
  gap: var(--space-3);
}

.grid-item__actions {
  display: flex;
  gap: var(--space-2);
  margin-top: auto;
}

.grid-item__action {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: var(--space-2) var(--space-3);
  background: transparent;
  border: 1px solid var(--fg);
  color: var(--fg);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, color 0.15s;
}

.grid-item__action:hover {
  background: var(--fg);
  color: var(--bg);
}

.grid-item__action--danger {
  border-color: #c00;
  color: #c00;
}

.grid-item__action--danger:hover {
  background: #c00;
  color: #fff;
}

/* Responsive: Mobile */
@media (max-width: 599px) {
  /* On mobile, both states become full-width stacked */
  .grid-item--expanded-medium,
  .grid-item--expanded-large {
    grid-column: 1 / -1;
    grid-row: span 1;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
  }

  .grid-item--expanded-medium .grid-item__image,
  .grid-item--expanded-large .grid-item__image,
  .grid-item--expanded-medium .grid-item__initial-wrap,
  .grid-item--expanded-large .grid-item__initial-wrap {
    grid-row: 1;
    aspect-ratio: 16/9;
    height: auto;
  }

  .grid-item--expanded-medium .grid-item__details,
  .grid-item--expanded-large .grid-item__details {
    grid-row: 2;
  }

  .grid-item--expanded-medium .grid-item__actions,
  .grid-item--expanded-large .grid-item__actions {
    grid-column: 1;
    grid-row: 3;
  }

  /* Hide resize on mobile - use tap to toggle */
  .grid-item__resize {
    display: none !important;
  }
}

/* ============================================
   Empty State
   ============================================ */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 100px);
}

.empty-state__box {
  border: 1px solid var(--fg);
  padding: var(--space-6);
  max-width: 320px;
  text-align: center;
}

.empty-state__text {
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  color: var(--fg);
  line-height: var(--line-height-normal);
}

/* ============================================
   Modal
   ============================================ */
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0.15s;
}

.modal--visible {
  opacity: 1;
  visibility: visible;
}

.modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

.modal__content {
  position: relative;
  width: calc(100% - 32px);
  max-width: 480px;
  max-height: calc(100vh - 32px);
  background: var(--bg);
  border: 2px solid var(--fg);
  overflow-y: auto;
}

.modal--small .modal__content {
  max-width: 300px;
}

.modal__header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: var(--space-4);
  border-bottom: 1px solid var(--fg);
}

.modal__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
}

.modal__close {
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.modal__close:hover {
  text-decoration: underline;
}

/* ============================================
   Add Form
   ============================================ */
.add-form {
  padding: var(--space-4);
}

.add-form__input {
  width: 100%;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--font-size-sm);
  border: 1px solid var(--fg);
  resize: vertical;
}

.add-form__input:focus {
  outline: 2px solid var(--fg);
  outline-offset: 1px;
}

.add-form__status {
  min-height: 20px;
  padding: var(--space-2) 0;
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
}

.add-form__status--error {
  font-weight: bold;
}

.add-form__submit {
  width: 100%;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: var(--fg);
  color: var(--bg);
  border: 1px solid var(--fg);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.add-form__submit:hover {
  background: var(--bg);
  color: var(--fg);
}

/* ============================================
   Overlay (Detail View)
   ============================================ */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s, visibility 0.15s;
}

.overlay--visible {
  opacity: 1;
  visibility: visible;
}

.overlay__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
}

.overlay__content {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

@media (min-width: 900px) {
  .overlay__content {
    max-width: 560px;
    margin: var(--space-8) auto;
    height: auto;
    max-height: calc(100vh - 64px);
    border: 2px solid var(--fg);
  }
}

.overlay__close {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  z-index: 10;
  width: 32px;
  height: 32px;
  font-family: var(--font-mono);
  font-size: var(--font-size-lg);
  background: var(--bg);
  border: 1px solid var(--fg);
  cursor: pointer;
}

.overlay__image {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  filter: grayscale(100%);
  border-bottom: 1px solid var(--fg);
}

.overlay__details {
  flex: 1;
  padding: var(--space-6);
  overflow-y: auto;
}

.overlay__title {
  font-family: var(--font-serif);
  font-size: var(--font-size-xl);
  font-weight: normal;
  line-height: var(--line-height-tight);
  margin-bottom: var(--space-2);
}

.overlay__domain {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-decoration: underline;
  margin-bottom: var(--space-4);
}

.overlay__description {
  font-family: var(--font-serif);
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
  margin-bottom: var(--space-6);
}

.overlay__meta {
  display: flex;
  gap: var(--space-4);
  margin-bottom: var(--space-6);

    const domain = extractDomain(url);

    const fetchUrl = cleanUrl(url);

    let html = null;
    let lastError = null;

    // Try each proxy with retries

      // Description

                     html.match(/<meta[^>]*content=["']([^"']*)["'][^>]*property=["']og:description["']/i);

      else if (desc) meta.description = decodeEntities(desc[1]);

      // Image - try multiple patterns with more flexible regex
      let ogImg = html.match(/<meta[^>]*property\s*=\s*["']og:image["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                  html.match(/<meta[^>]*content\s*=\s*["']([^"']+)["'][^>]*property\s*=\s*["']og:image["']/i);

      // Try itemprop image (schema.org)

        ogImg = html.match(/<meta[^>]*itemprop\s*=\s*["']image["'][^>]*content\s*=\s*["']([^"']+)["']/i) ||
                html.match(/<link[^>]*rel\s*=\s*["']image_src["'][^>]*href\s*=\s*["']([^"']+)["']/i);
      }

      // Fallback: try to find first significant image tag
      if (!ogImg) {
        const imgMatch = html.match(/<img[^>]*src\s*=\s*["']([^"']+)["'][^>]*>/gi);
        if (imgMatch) {
          for (const img of imgMatch.slice(0, 5)) {
            const src = img.match(/src\s*=\s*["']([^"']+)["']/i);

            if (imgMatch) {

  function decodeEntities(text) {

  function categorize(link) {
    const text = `${link.title || ''} ${link.description || ''} ${link.url || ''}`.toLowerCase();
    let best = 'uncategorized', maxScore = 0;

    for (const [cat, p] of Object.entries(PATTERNS)) {
      let score = 0;
      // Domain match gives 0.5
      for (const d of p.domains) {
        if ((link.domain || '').includes(d) || (link.url || '').includes(d)) {
          score += 0.5;
          break;
        }
      }
      // Keyword match gives 0.15 each (so 2 matches = 0.3 which passes threshold)
      for (const k of p.kw) {
        if (text.includes(k)) score += 0.15;
      }
      score = Math.min(score, 1);
      if (score > maxScore) { maxScore = score; best = cat; }
    }

    // Lower threshold to 0.15 (single keyword match is enough)
    return { category: maxScore >= 0.15 ? best : 'uncategorized', confidence: maxScore };
  }

  function detectClusters(items) {
    if (!items || items.length < 3) return [];
    const domainGroups = {};
    for (const item of items) {
      const d = item.domain || 'unknown';
      if (!domainGroups[d]) domainGroups[d] = [];
      domainGroups[d].push(item);
    }
    const clusters = [];
    for (const [domain, list] of Object.entries(domainGroups)) {
      if (list.length >= 3) {

    }
    return clusters;

        id: link.id,
        user_id: currentUser.id,
        url: link.url,
        title: link.title,
        description: link.description,
        image: link.image,
        domain: link.domain,
        category: link.category,
        confidence: link.confidence,
        created_at: link.addedAt,
        updated_at: link.updatedAt || null
      });
    } catch (e) { console.error('Supabase sync error:', e); }
  }

  async function syncOrderToSupabase(orderIds) {
    if (!currentUser) return;
    try {
      await supabase.from('link_order').upsert({
        user_id: currentUser.id,
        order_ids: orderIds
      });
    } catch (e) { console.error('Supabase order sync error:', e); }
  }

  async function deleteLinkFromSupabase(id) {
    if (!currentUser) return;
    try {
      await supabase.from('links').delete().eq('id', id).eq('user_id', currentUser.id);
    } catch (e) { console.error('Supabase delete error:', e); }
  }

  async function fetchFromSupabase() {
    if (!currentUser) return null;
    try {
      const [linksRes, orderRes, expandedRes] = await Promise.all([
        supabase.from('links').select('*').eq('user_id', currentUser.id),
        supabase.from('link_order').select('order_ids').eq('user_id', currentUser.id).single(),
        supabase.from('expanded_cards').select('cards').eq('user_id', currentUser.id).single()
      ]);

      const links = (linksRes.data || []).map(l => ({
        id: l.id,
        url: l.url,
        title: l.title,
        description: l.description,
        image: l.image,
        domain: l.domain,
        category: l.category,
        confidence: l.confidence,
        addedAt: l.created_at,
        updatedAt: l.updated_at
      }));

      const categories = { uncategorized: { pinned: true } };
      links.forEach(l => {
        if (l.category && !categories[l.category]) {
          categories[l.category] = { pinned: false };
        }
      });

      const linkOrder = orderRes.data?.order_ids || links.map(l => l.id);
      const expanded = expandedRes.data?.cards || {};

      return { links, categories, linkOrder, expanded };
    } catch (e) {
      console.error('Supabase fetch error:', e);
      return null;
    }
  }

  async function migrateLocalToSupabase() {
    if (!currentUser) return;
    const local = load();
    if (local.links.length === 0) return;

    // Check if user already has data in Supabase
    const { count } = await supabase.from('links').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);

    if (count > 0) {
      // User has cloud data, ask if they want to merge
      const merge = await showConfirm(
        `You have ${local.links.length} local links and ${count} cloud links. Merge local data to cloud?`,
        'Sync Data'
      );
      if (!merge) return;
    }

    // Upload all local links
    toast('Syncing to cloud...');
    for (const link of local.links) {
      await syncLinkToSupabase(link);
    }
    await syncOrderToSupabase(local.linkOrder);

    // Sync expanded cards
    const expanded = loadExpandedCards();
    if (Object.keys(expanded).length > 0) {
      await supabase.from('expanded_cards').upsert({
        user_id: currentUser.id,
        cards: expanded
      });
    }

    toast(`Synced ${local.links.length} links to cloud`);
  }

  function getAllLinks() { return load().links; }
  function getCategories() { return load().categories; }

  function findByUrl(url) {
    const n = url.toLowerCase().replace(/\/+$/, '');
    return getAllLinks().find(l => l.url.toLowerCase().replace(/\/+$/, '') === n);
  }

  function addLink(link) {
    const existing = findByUrl(link.url);
    const data = load();

    if (existing) {
      const i = data.links.findIndex(l => l.id === existing.id);
      if (i !== -1) {
        const mergedImage = link.image || existing.image;
        const mergedDescription = link.description || existing.description;
        const mergedTitle = (link.title && link.title !== link.domain) ? link.title : existing.title;

        data.links[i] = {
          ...existing,
          ...link,
          image: mergedImage,
          description: mergedDescription,
          title: mergedTitle,
          id: existing.id,
          addedAt: existing.addedAt,
          updatedAt: new Date().toISOString()
        };
        syncLinkToSupabase(data.links[i]); // Background sync
      }
      if (!data.categories[link.category]) {
        data.categories[link.category] = { pinned: false };
      }
      save(data);
      return { success: true, updated: true };
    }

    const newLink = { ...link, addedAt: new Date().toISOString() };
    data.links.push(newLink);
    if (!data.linkOrder) data.linkOrder = [];
    data.linkOrder.unshift(link.id);
    if (!data.categories[link.category]) {
      data.categories[link.category] = { pinned: false };
    }
    save(data);
    syncLinkToSupabase(newLink); // Background sync
    syncOrderToSupabase(data.linkOrder); // Background sync
    return { success: true };
  }

  function updateLink(id, updates) {
    const data = load();
    const i = data.links.findIndex(l => l.id === id);
    if (i === -1) throw new Error('Not found');
    data.links[i] = { ...data.links[i], ...updates, updatedAt: new Date().toISOString() };
    if (updates.category && !data.categories[updates.category]) {
      data.categories[updates.category] = { pinned: false };
    }
    save(data);
    syncLinkToSupabase(data.links[i]); // Background sync
  }

  function deleteLink(id) {
    const data = load();
    data.links = data.links.filter(l => l.id !== id);
    if (data.linkOrder) data.linkOrder = data.linkOrder.filter(i => i !== id);
    save(data);
    deleteLinkFromSupabase(id); // Background sync
    syncOrderToSupabase(data.linkOrder);
  }

  function reorderLinks(fromId, toId, position = 'before') {
    const data = load();
    if (!data.linkOrder) data.linkOrder = data.links.map(l => l.id);
    const fromIdx = data.linkOrder.indexOf(fromId);
    let toIdx = data.linkOrder.indexOf(toId);
    if (fromIdx === -1 || toIdx === -1) return;
    data.linkOrder.splice(fromIdx, 1);
    toIdx = data.linkOrder.indexOf(toId);
    const insertIdx = position === 'after' ? toIdx + 1 : toIdx;
    data.linkOrder.splice(insertIdx, 0, fromId);
    save(data);
    syncOrderToSupabase(data.linkOrder); // Background sync
  }

  function createCategory(name) {
    const data = load();
    const n = name.toLowerCase().replace(/\s+/g, '-');
    if (data.categories[n]) throw new Error('Category exists');
    data.categories[n] = { pinned: false };
    save(data);
    return n;
  }

  function bulkMove(ids, category) {
    const data = load();
    for (const id of ids) {
      const i = data.links.findIndex(l => l.id === id);
      if (i !== -1) {
        data.links[i].category = category;
        syncLinkToSupabase(data.links[i]); // Background sync
      }
    }
    if (!data.categories[category]) data.categories[category] = { pinned: false };
    save(data);
  }

  // ============================================
  // App State
  // ============================================
  let currentFilter = 'all';
  let selectedLink = null;
  let expandedCards = loadExpandedCards(); // { [id]: 'medium' | 'large' }

  // ============================================
  // DOM
  // ============================================
  const $ = id => document.getElementById(id);
  const grid = $('grid');
  const filters = $('filters');
  const addModal = $('addModal');
  const addForm = $('addForm');
  const linkInput = $('linkInput');
  const formStatus = $('formStatus');
  const overlay = $('overlay');
  const categoryModal = $('categoryModal');
  const categoryList = $('categoryList');
  const toastContainer = $('toastContainer');

  // Auth DOM
  const authBar = $('authBar');
  const authUser = $('authUser');
  const authBtn = $('authBtn');
  const authModal = $('authModal');
  const authForm = $('authForm');
  const authEmail = $('authEmail');
  const authSubmit = $('authSubmit');
  const authStatus = $('authStatus');

  // Progress DOM
  const progressBar = $('progressBar');
  const progressFill = $('progressFill');
  const progressStatus = $('progressStatus');

  // Progress helpers
  function showProgress(current, total, url) {
    progressBar.classList.add('progress-bar--visible');
    progressStatus.classList.add('progress-status--visible');
    const pct = Math.round((current / total) * 100);
    progressFill.style.width = pct + '%';
    const domain = extractDomain(url);
    progressStatus.textContent = `Processing ${current}/${total}: ${domain}`;
  }

  function hideProgress() {
    progressBar.classList.remove('progress-bar--visible');
    progressStatus.classList.remove('progress-status--visible');
    progressFill.style.width = '0%';
  }

  // ============================================
  // Render
  // ============================================
  function renderFilters() {
    const cats = getCategories();
    const links = getAllLinks();
    const counts = { all: links.length };
    for (const l of links) counts[l.category] = (counts[l.category] || 0) + 1;

    let html = `<button class="filter-token ${currentFilter === 'all' ? 'filter-token--active' : ''}" data-category="all">All</button>`;

    const sorted = Object.entries(cats)
      .filter(([n]) => counts[n] > 0 && n !== 'uncategorized')
      .sort((a, b) => (b[1].pinned ? 1 : 0) - (a[1].pinned ? 1 : 0) || (counts[b[0]] || 0) - (counts[a[0]] || 0));

    for (const [name] of sorted) {
      const c = counts[name] || 0;
      const active = currentFilter === name ? 'filter-token--active' : '';
      const badge = name === 'uncategorized' && c > 0 ? ` (${c})` : '';
      html += `<button class="filter-token ${active}" data-category="${name}">${cap(name)}${badge}</button>`;
    }

    filters.innerHTML = html;
  }

  function renderGrid() {
    const allLinks = getAllLinks();
    const links = currentFilter === 'all' ? allLinks : allLinks.filter(l => l.category === currentFilter);

    if (links.length === 0) {
      grid.innerHTML = `<div class="empty-state">
        <div class="empty-state__box">
          <p class="empty-state__text">
            Save links you like. Paste URLs anywhere on this page or click + to add.<br><br>
            Links are auto-categorized and stored locally in your browser.
          </p>
        </div>
      </div>`;
      return;
    }

    // Sort by saved order, fallback to date
    const data = load();
    const order = data.linkOrder || [];
    const sorted = [...links].sort((a, b) => {
      const aIdx = order.indexOf(a.id);
      const bIdx = order.indexOf(b.id);
      if (aIdx === -1 && bIdx === -1) return new Date(b.addedAt) - new Date(a.addedAt);
      if (aIdx === -1) return 1;
      if (bIdx === -1) return -1;
      return aIdx - bIdx;
    });

    let html = '';

    for (const l of sorted) {
      const hasImg = l.image && l.image.length > 0;
      const initial = l.title ? l.title.charAt(0).toUpperCase() : '?';
      const expansionState = expandedCards[l.id]; // 'medium', 'large', or undefined
      const expandedClass = expansionState ? ` grid-item--expanded-${expansionState}` : '';
      const isExpanded = !!expansionState;
      const dateStr = new Date(l.addedAt).toLocaleDateString();

      const detailsHtml = `
        <div class="grid-item__details">
          <h2 class="grid-item__details-title">${esc(l.title)}</h2>
          <p class="grid-item__details-domain">${esc(l.domain)}</p>
          ${l.description ? `<p class="grid-item__details-description">${esc(l.description)}</p>` : ''}
          <div class="grid-item__details-meta">
            <span>${cap(l.category)}</span>
            <span>${dateStr}</span>
          </div>
          <div class="grid-item__actions">
            <a href="${l.url}" target="_blank" rel="noopener" class="grid-item__action" data-action="visit">Visit</a>
            <button class="grid-item__action" data-action="category">Category</button>
            <button class="grid-item__action grid-item__action--danger" data-action="delete">Delete</button>
          </div>
        </div>
        <div class="grid-item__resize" data-action="resize"></div>`;

      if (hasImg) {
        html += `<article class="grid-item${expandedClass}" data-id="${l.id}" draggable="true">
          <img class="grid-item__image" src="${l.image}" alt="" loading="lazy">
          <div class="grid-item__overlay"><h3 class="grid-item__title">${esc(l.title)}</h3><p class="grid-item__domain">${esc(l.domain)}</p></div>
          <span class="grid-item__category">${cap(l.category)}</span>
          ${detailsHtml}
        </article>`;
      } else {
        html += `<article class="grid-item grid-item--placeholder${expandedClass}" data-id="${l.id}" draggable="true">
          ${isExpanded ? `<div class="grid-item__initial-wrap"><span class="grid-item__initial">${initial}</span></div>` : `<span class="grid-item__initial">${initial}</span>`}
          <div class="grid-item__overlay"><h3 class="grid-item__title">${esc(l.title)}</h3><p class="grid-item__domain">${esc(l.domain)}</p></div>
          <span class="grid-item__category">${cap(l.category)}</span>
          ${detailsHtml}
        </article>`;
      }
    }

    grid.innerHTML = html;
  }

  // ============================================
  // Events
  // ============================================
  $('addBtn').onclick = () => openModal(addModal);

  addForm.onsubmit = async (e) => {
    e.preventDefault();
    const text = linkInput.value.trim();
    if (!text) return;

    const urls = extractUrls(text);
    if (urls.length === 0) {
      showStatus('No valid URLs found', true);
      return;
    }

    // Close modal immediately so user can watch links appear
    linkInput.value = '';
    closeModal(addModal);
    showStatus('');

    let added = 0, updated = 0, failed = 0;
    const total = urls.length;

    for (let i = 0; i < urls.length; i++) {
      const url = urls[i];
      showProgress(i + 1, total, url);
      try {
        const meta = await fetchMetadata(url);
        const cat = categorize(meta);
        const linkObj = { id: generateId(url), url, ...meta, category: cat.category, confidence: cat.confidence };
        const result = addLink(linkObj);
        if (result.success) {
          if (result.updated) updated++;
          else added++;
          // Render immediately after each successful add
          renderFilters();
          renderGrid();
        }
      } catch (err) {
        failed++;
      }
    }

    hideProgress();

    // Show summary toast at end
    const parts = [];
    if (added > 0) parts.push(`Added ${added}`);
    if (updated > 0) parts.push(`Updated ${updated}`);
    if (failed > 0) parts.push(`${failed} failed`);
    if (parts.length > 0) {
      toast(parts.join(', '));
    }
    checkClusters();
  };

  filters.onclick = (e) => {
    const t = e.target.closest('.filter-token');
    if (t) {
      currentFilter = t.dataset.category;
      renderFilters();
      renderGrid();
    }
  };

  grid.onclick = async (e) => {
    // Handle action buttons in expanded card
    const action = e.target.closest('[data-action]');
    if (action) {
      e.stopPropagation();
      const item = e.target.closest('.grid-item');
      const id = item?.dataset.id;
      if (!id) return;

      const actionType = action.dataset.action;
      if (actionType === 'visit') {
        // Let the link handle itself
        return;
      } else if (actionType === 'resize') {
        // Toggle between medium and large
        const currentState = expandedCards[id];
        if (currentState === 'medium') {
          expandedCards[id] = 'large';
        } else {
          expandedCards[id] = 'medium';
        }
        saveExpandedCards(expandedCards);
        renderGrid();
        return;
      } else if (actionType === 'category') {
        selectedLink = getAllLinks().find(l => l.id === id);
        openCategorySelect();
      } else if (actionType === 'delete') {
        const confirmed = await showConfirm('Delete this link?', 'Delete');
        if (confirmed) {
          deleteLink(id);
          delete expandedCards[id];
          saveExpandedCards(expandedCards);
          renderFilters();
          renderGrid();
          toast('Deleted');
        }
      }
      return;
    }

    // Toggle expansion (collapsed ↔ medium)
    const item = e.target.closest('.grid-item');
    if (item && !isDragging) {
      const id = item.dataset.id;
      if (expandedCards[id]) {
        // Collapse
        delete expandedCards[id];
      } else {
        // Expand to medium
        expandedCards[id] = 'medium';
      }
      saveExpandedCards(expandedCards);
      renderGrid();
    }
  };

  // Drag and drop reordering
  let draggedId = null;
  let isDragging = false;
  let dropPosition = null; // 'before' or 'after'

  function clearDragClasses() {
    grid.querySelectorAll('.drag-before, .drag-after').forEach(el => {
      el.classList.remove('drag-before', 'drag-after');
    });
  }

  grid.ondragstart = (e) => {
    const item = e.target.closest('.grid-item');
    if (!item) return;
    draggedId = item.dataset.id;
    isDragging = true;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedId);
  };

  grid.ondragend = (e) => {
    const item = e.target.closest('.grid-item');
    if (item) item.classList.remove('dragging');
    clearDragClasses();
    draggedId = null;
    dropPosition = null;
    setTimeout(() => { isDragging = false; }, 100);
  };

  grid.ondragover = (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const item = e.target.closest('.grid-item');
    if (item && item.dataset.id !== draggedId) {
      // Determine if dropping before or after based on mouse position
      const rect = item.getBoundingClientRect();
      const midX = rect.left + rect.width / 2;
      const isBefore = e.clientX < midX;

      clearDragClasses();
      item.classList.add(isBefore ? 'drag-before' : 'drag-after');
      dropPosition = isBefore ? 'before' : 'after';
    }
  };

  grid.ondragleave = (e) => {
    const item = e.target.closest('.grid-item');
    if (item) {
      item.classList.remove('drag-before', 'drag-after');
    }
  };

  grid.ondrop = (e) => {
    e.preventDefault();
    const targetItem = e.target.closest('.grid-item');
    if (!targetItem || !draggedId) return;
    clearDragClasses();
    const targetId = targetItem.dataset.id;
    if (draggedId !== targetId) {
      reorderLinks(draggedId, targetId, dropPosition);
      renderGrid();
    }
  };

  // Drag-to-resize functionality
  let resizeState = null;
  const RESIZE_THRESHOLD = 50; // pixels to trigger size change

  grid.onmousedown = (e) => {
    const handle = e.target.closest('.grid-item__resize');
    if (!handle) return;
    e.preventDefault();
    const item = e.target.closest('.grid-item');
    if (!item) return;
    resizeState = {
      id: item.dataset.id,
      startX: e.clientX,
      startY: e.clientY,
      currentState: expandedCards[item.dataset.id] || 'medium'
    };
    document.body.style.cursor = 'nwse-resize';
  };

  document.onmousemove = (e) => {
    if (!resizeState) return;
    const deltaX = e.clientX - resizeState.startX;
    // Visual feedback could be added here
  };

  document.onmouseup = (e) => {
    if (!resizeState) return;
    const deltaX = e.clientX - resizeState.startX;
    const id = resizeState.id;

    // Determine new size based on drag distance
    if (deltaX > RESIZE_THRESHOLD && resizeState.currentState === 'medium') {
      expandedCards[id] = 'large';
      saveExpandedCards(expandedCards);
      renderGrid();
    } else if (deltaX < -RESIZE_THRESHOLD && resizeState.currentState === 'large') {
      expandedCards[id] = 'medium';
      saveExpandedCards(expandedCards);
      renderGrid();
    }

    resizeState = null;
    document.body.style.cursor = '';
  };

  $('overlayRecategorize').onclick = () => { closeModal(overlay); openCategorySelect(); };
  $('overlayDelete').onclick = async (e) => {
    e.stopPropagation();
    if (!selectedLink) return;
    const confirmed = await showConfirm('Delete this link?', 'Delete');
    if (confirmed) {
      deleteLink(selectedLink.id);
      closeModal(overlay);
      renderFilters();
      renderGrid();
      toast('Deleted');
    }
  };

  document.querySelectorAll('[data-close]').forEach(el => {
    el.onclick = (e) => {
      const m = e.target.closest('.modal, .overlay');
      if (m) closeModal(m);
    };
  });

  document.onkeydown = (e) => {
    if (e.key === 'Escape') closeAll();
    // Ctrl+Shift+D toggles dev menu
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'd') {
      e.preventDefault();
      $('devMenu').classList.toggle('dev-menu--visible');
    }
  };

  // ============================================
  // Dev Menu
  // ============================================
  $('devClearAll').onclick = async () => {
    const first = await showConfirm('Delete ALL links and categories? This cannot be undone.', 'Clear All Data');
    if (!first) return;
    const second = await showConfirm('Are you sure? This will clear everything.', 'Final Warning');
    if (second) {
      // Clear localStorage
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(EXPANDED_KEY);
      expandedCards = {};

      // Clear Supabase if logged in
      if (currentUser) {
        await supabase.from('links').delete().eq('user_id', currentUser.id);
        await supabase.from('link_order').delete().eq('user_id', currentUser.id);
        await supabase.from('expanded_cards').delete().eq('user_id', currentUser.id);
      }

      renderFilters();
      renderGrid();
      $('devMenu').classList.remove('dev-menu--visible');
      toast('All data cleared');
    }
  };

  $('devExport').onclick = () => {
    const data = load();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'things-i-like-backup.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Data exported');
  };

  $('devRefetch').onclick = async () => {
    const links = getAllLinks().filter(l => !l.image);
    if (links.length === 0) {
      toast('No links missing images');
      return;
    }
    toast(`Refetching ${links.length} links...`);
    $('devMenu').classList.remove('dev-menu--visible');

    let updated = 0;
    for (const link of links) {
      try {
        const meta = await fetchMetadata(link.url);
        if (meta.image) {
          updateLink(link.id, { image: meta.image });
          updated++;
        }
      } catch (e) {
        // Fetch failed, continue
      }
    }
    renderGrid();
    toast(`Updated ${updated} of ${links.length} links`);
  };

  // ============================================
  // Helpers
  // ============================================
  function openModal(m) { m.classList.add('modal--visible', 'overlay--visible'); }
  function closeModal(m) { m.classList.remove('modal--visible', 'overlay--visible'); }
  function closeAll() { [addModal, overlay, categoryModal, confirmModal].forEach(closeModal); }

  // Custom confirm dialog (native confirm() is blocked in some contexts)
  const confirmModal = $('confirmModal');
  const confirmTitle = $('confirmTitle');
  const confirmMessage = $('confirmMessage');
  const confirmOkBtn = $('confirmOk');
  const confirmCancelBtn = $('confirmCancel');

  function showConfirm(message, title = 'Confirm') {
    return new Promise((resolve) => {
      confirmTitle.textContent = title;
      confirmMessage.textContent = message;
      openModal(confirmModal);

      const cleanup = () => {
        confirmOkBtn.onclick = null;
        confirmCancelBtn.onclick = null;
        closeModal(confirmModal);
      };

      confirmOkBtn.onclick = () => { cleanup(); resolve(true); };
      confirmCancelBtn.onclick = () => { cleanup(); resolve(false); };
    });
  }

  function openDetail(id) {
    console.log('[openDetail] Opening id:', id);
    const l = getAllLinks().find(x => x.id === id);
    if (!l) {
      console.log('[openDetail] Link not found');
      return;
    }
    selectedLink = l;
    console.log('[openDetail] selectedLink set to:', l.id, l.title);
    $('overlayImage').src = l.image || '';
    $('overlayImage').style.display = l.image ? 'block' : 'none';
    $('overlayTitle').textContent = l.title;
    $('overlayDomain').textContent = l.domain;
    $('overlayDescription').textContent = l.description || '';
    $('overlayCategory').textContent = cap(l.category);
    $('overlayDate').textContent = new Date(l.addedAt).toLocaleDateString();
    $('overlayLink').href = l.url;
    openModal(overlay);
  }

  function openCategorySelect() {
    const cats = getCategories();
    let html = '';
    for (const n of Object.keys(cats)) {
      const active = selectedLink && selectedLink.category === n ? 'category-list__item--active' : '';
      html += `<button class="category-list__item ${active}" data-cat="${n}">${cap(n)}</button>`;
    }
    html += `<button class="category-list__item" data-cat="__new__">+ New category</button>`;
    categoryList.innerHTML = html;

    categoryList.onclick = (e) => {
      const btn = e.target.closest('.category-list__item');
      if (!btn) return;
      const cat = btn.dataset.cat;
      if (cat === '__new__') {
        const name = prompt('Category name:');
        if (name && name.trim()) {
          const n = createCategory(name.trim());
          recategorize(n);
        }
      } else {
        recategorize(cat);
      }
    };

    openModal(categoryModal);
  }

  function recategorize(cat) {
    if (!selectedLink) return;
    updateLink(selectedLink.id, { category: cat });
    closeModal(categoryModal);
    renderFilters();
    renderGrid();
    toast('Moved to ' + cap(cat));
  }

  function checkClusters() {
    const uncat = getAllLinks().filter(l => l.category === 'uncategorized');
    const clusters = detectClusters(uncat);
    if (clusters.length > 0) {
      const c = clusters[0];
      setTimeout(() => {
        if (confirm(`Found ${c.items.length} links from "${c.name}".\n\nCreate category?`)) {
          const n = createCategory(c.name);
          bulkMove(c.items.map(i => i.id), n);
          renderFilters();
          renderGrid();
          toast(`Created "${cap(n)}"`);
        }
      }, 500);
    }
  }

  function showStatus(msg, err) {
    formStatus.textContent = msg;
    formStatus.className = 'add-form__status' + (err ? ' add-form__status--error' : '');
  }

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' toast--error' : '');
    t.textContent = msg;
    toastContainer.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ============================================
  // Direct paste processing
  // ============================================
  async function processLinks(text) {
    const urls = extractUrls(text);

    if (urls.length === 0) {
      toast('No valid URLs found', true);
      return;
    }

    let added = 0, updated = 0, failed = 0;
    const total = urls.length;

    for (let i = 0; i < urls.length; i++) {
      const url = urls[i];
      showProgress(i + 1, total, url);
      try {
        const meta = await fetchMetadata(url);
        const cat = categorize(meta);
        const linkObj = { id: generateId(url), url, ...meta, category: cat.category, confidence: cat.confidence };
        const result = addLink(linkObj);
        if (result.success) {
          if (result.updated) updated++;
          else added++;
          // Render immediately after each successful add
          renderFilters();
          renderGrid();
        }
      } catch (err) {
        failed++;
      }
    }

    hideProgress();

    // Show summary toast at end
    const parts = [];
    if (added > 0) parts.push(`${added} added`);
    if (updated > 0) parts.push(`${updated} updated`);
    if (failed > 0) parts.push(`${failed} failed`);
    if (parts.length > 0) {
      toast(parts.join(', '));
    }
    checkClusters();
  }

  // ============================================
  // Re-categorize uncategorized items
  // ============================================
  function recategorizeUncategorized() {
    const uncategorized = getAllLinks().filter(l => l.category === 'uncategorized');
    if (uncategorized.length === 0) return;

    let moved = 0;
    for (const link of uncategorized) {
      const cat = categorize(link);
      if (cat.category !== 'uncategorized') {
        updateLink(link.id, { category: cat.category, confidence: cat.confidence });
        moved++;
      }
    }

    if (moved > 0) {
      renderFilters();
      renderGrid();
      toast(`Recategorized ${moved} item${moved > 1 ? 's' : ''}`);
    }
  }

  // ============================================
  // Theme Toggle
  // ============================================
  const themeToggle = $('themeToggle');
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'light') {
    document.documentElement.classList.add('light');
  }

  themeToggle.onclick = () => {
    const isLight = document.documentElement.classList.toggle('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  };

  // ============================================
  // Auth Functions
  // ============================================
  function updateAuthUI() {
    if (currentUser) {
      authUser.textContent = currentUser.email;
      authBtn.textContent = 'Logout';
    } else {
      authUser.textContent = '';
      authBtn.textContent = 'Login';
    }
  }

  let authCountdownInterval = null;

  function clearAuthCountdown() {
    if (authCountdownInterval) {
      clearInterval(authCountdownInterval);
      authCountdownInterval = null;
    }
  }

  function startAuthCountdown(seconds) {
    clearAuthCountdown();
    authSubmit.disabled = true;

    let remaining = seconds;
    authStatus.textContent = `Wait ${remaining}s`;
    authStatus.className = 'auth-modal__status auth-modal__status--error';

    authCountdownInterval = setInterval(() => {
      remaining--;
      if (remaining > 0) {
        authStatus.textContent = `Wait ${remaining}s`;
      } else {
        clearAuthCountdown();
        authStatus.textContent = 'Try again';
        authStatus.className = 'auth-modal__status';
        authSubmit.disabled = false;
      }
    }, 1000);
  }

  async function handleLogin(email) {
    clearAuthCountdown();
    authSubmit.disabled = true;
    authStatus.textContent = 'Sending magic link...';
    authStatus.className = 'auth-modal__status';

    try {
      const redirectUrl = window.location.origin + window.location.pathname;
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: redirectUrl
        }
      });

      if (error) throw error;

      authStatus.textContent = 'Check your email for the magic link!';
      authEmail.value = '';
      authSubmit.disabled = false;
    } catch (e) {
      const msg = e.message || 'Failed to send magic link';

      // Check for rate limit / security cooldown (e.g., "...after 45 seconds")
      const secMatch = msg.match(/after\s+(\d+)\s+second/i);
      if (secMatch) {
        const waitSecs = parseInt(secMatch[1], 10);
        startAuthCountdown(waitSecs);
      } else {
        authStatus.textContent = msg;
        authStatus.className = 'auth-modal__status auth-modal__status--error';
        authSubmit.disabled = false;
      }
    }
  }

  async function handleLogout() {
    await supabase.auth.signOut();
    currentUser = null;
    updateAuthUI();
    toast('Logged out');
  }

  async function onAuthStateChange(event, session) {
    const wasLoggedOut = !currentUser;
    currentUser = session?.user || null;
    updateAuthUI();

    if (currentUser && wasLoggedOut) {
      // Just logged in - close modal and sync
      authModal.classList.remove('auth-modal--visible');
      toast('Logged in as ' + currentUser.email);

      // Check for local data to migrate
      const localData = load();
      if (localData.links.length > 0) {
        await migrateLocalToSupabase();
      }

      // Fetch from Supabase and update local cache
      const cloudData = await fetchFromSupabase();
      if (cloudData) {
        save({ links: cloudData.links, categories: cloudData.categories, linkOrder: cloudData.linkOrder });
        expandedCards = cloudData.expanded;
        localStorage.setItem(EXPANDED_KEY, JSON.stringify(expandedCards));
        renderFilters();
        renderGrid();
      }
    }
  }

  // Auth event handlers
  authBtn.onclick = () => {
    if (currentUser) {
      handleLogout();
    } else {
      authModal.classList.add('auth-modal--visible');
      authEmail.focus();
    }
  };

  authForm.onsubmit = (e) => {
    e.preventDefault();
    const email = authEmail.value.trim();
    if (email) handleLogin(email);
  };

  authModal.onclick = (e) => {
    if (e.target === authModal) {
      authModal.classList.remove('auth-modal--visible');
      clearAuthCountdown();
      authStatus.textContent = '';
      authStatus.className = 'auth-modal__status';
      authSubmit.disabled = false;
    }
  };

  // ============================================
  // Init
  // ============================================
  async function init() {
    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.classList.add('light');
    }

    // Listen for auth changes FIRST (before getSession)
    supabase.auth.onAuthStateChange(onAuthStateChange);

    // Check if this is a magic link callback (has tokens in hash)
    const hash = window.location.hash;
    if (hash.includes('access_token') || hash.includes('error')) {
      // Give Supabase a moment to process hash tokens on mobile
      await new Promise(r => setTimeout(r, 200));

      // Clean up the URL after processing
      if (window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    }

    // Check for existing session
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      updateAuthUI();

      // Fetch from Supabase
      const cloudData = await fetchFromSupabase();
      if (cloudData && cloudData.links.length > 0) {
        save({ links: cloudData.links, categories: cloudData.categories, linkOrder: cloudData.linkOrder });
        expandedCards = cloudData.expanded;
        localStorage.setItem(EXPANDED_KEY, JSON.stringify(expandedCards));
      }
    }

    // Render
    renderFilters();
    renderGrid();

    // Re-check uncategorized items on load
    recategorizeUncategorized();
  }

  init();

  // Listen for paste anywhere on page
  document.addEventListener('paste', (e) => {
    // Don't intercept if pasting into textarea/input
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

    const text = e.clipboardData.getData('text');
    if (text && extractUrls(text).length > 0) {
      e.preventDefault();
      processLinks(text);
    }
  });

})();
  </script>
</body>
</html>
