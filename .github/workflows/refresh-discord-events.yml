name: Refresh Discord Events Cache

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of days to look back for messages'
        required: false
        default: '7'
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh all cached Discord channels
        run: |
          LOOKBACK="${{ github.event.inputs.lookback_days || '7' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/scrape-discord-events" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"refresh-all\", \"lookbackDays\": $LOOKBACK}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Refresh failed with HTTP $HTTP_CODE"
            exit 1
          fi
          REFRESHED=$(echo "$BODY" | jq -r '.refreshed // 0')
          echo "Refreshed $REFRESHED channel(s)"
          ERRORS=$(echo "$BODY" | jq -r '.results[]? | select(.error) | "\(.guildId)/\(.channelId): \(.error)"')
          if [ -n "$ERRORS" ]; then
            echo "::warning::Some channels had errors:"
            echo "$ERRORS"
          fi
