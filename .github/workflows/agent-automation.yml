name: AI Agent Automation

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    types: [opened, synchronize, ready_for_review]
  schedule:
    # Daily synthesis at 9 AM UTC
    - cron: '0 9 * * *'
    # Weekly improvement analysis on Fridays at 4 PM UTC
    - cron: '0 16 * * 5'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to run'
        required: true
        default: 'status-update'
        type: choice
        options:
          - status-update
          - organizational
          - project-management
          - chief-of-staff
          - security-compliance
          - continuous-improvement
          - all

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  # Sync to Notion on every push
  notion-sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Full Structure with Content
        if: env.SUPABASE_URL != ''
        run: |
          echo "🔄 Syncing to Notion with file contents..."

          # Function to read file and escape for JSON
          read_file() {
            if [ -f "$1" ]; then
              # Read first 80 lines, escape for JSON
              head -80 "$1" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'
            else
              echo '""'
            fi
          }

          # Build the structure with content
          VISION=$(read_file "docs/VISION-AND-ROADMAP.md")
          DECISION_LOG=$(read_file "docs/DECISION-LOG.md")
          PRD_THINGS=$(read_file "docs/PRD-things-i-like.md")
          PRD_COLLAB=$(read_file "docs/PRD-collaborative-boards.md")
          PRD_CONTENT=$(read_file "docs/PRD-content-type-and-image-systems.md")
          PRD_CORP=$(read_file "docs/PRD-unified-corporate-management.md")
          BOARDS_README=$(read_file "boards/README.md")
          SOUNDSCAPE_README=$(read_file "soundscape/README.md")
          SYSTEMIC_README=$(read_file "systemic/README.md")
          FAVICON_README=$(read_file "favicon/README.md")
          DESIGN_README=$(read_file "design-system/README.md")
          BACKLOG=$(read_file "BACKLOG.md")
          SPRINT=$(read_file "docs/EXECUTION-SPRINT.md")
          SHIPPED=$(read_file "docs/EXECUTION-SHIPPED.md")
          BLOCKED=$(read_file "docs/EXECUTION-BLOCKED.md")
          ARCHITECTURE=$(read_file "docs/INFRA-ARCHITECTURE.md")
          DEPLOYMENT=$(read_file "docs/INFRA-DEPLOYMENT.md")
          SECURITY=$(read_file "docs/INFRA-SECURITY.md")
          COSTS=$(read_file "COSTS.md")

          # Create the structure JSON
          cat > /tmp/structure.json << STRUCTURE_EOF
          {
            "action": "sync-structure",
            "structure": {
              "root": "Ctrl Rodeo",
              "sections": [
                {
                  "title": "Strategy",
                  "icon": "🎯",
                  "children": [
                    {"title": "Vision & Roadmap", "icon": "📄", "content": $VISION},
                    {
                      "title": "PRDs",
                      "icon": "📄",
                      "children": [
                        {"title": "Things I Like (Boards)", "icon": "📋", "content": $PRD_THINGS},
                        {"title": "Collaborative Boards", "icon": "📋", "content": $PRD_COLLAB},
                        {"title": "Content Type System", "icon": "📋", "content": $PRD_CONTENT},
                        {"title": "Corporate Management", "icon": "📋", "content": $PRD_CORP}
                      ]
                    },
                    {"title": "Decision Log (ADRs)", "icon": "📄", "content": $DECISION_LOG}
                  ]
                },
                {
                  "title": "Product",
                  "icon": "📦",
                  "children": [
                    {
                      "title": "Boards",
                      "icon": "📋",
                      "children": [
                        {"title": "Overview", "icon": "📄", "content": $BOARDS_README},
                        {"title": "Features", "icon": "⭐"},
                        {"title": "Changelog", "icon": "📝"},
                        {"title": "Human TODOs", "icon": "👤"}
                      ]
                    },
                    {
                      "title": "Design System",
                      "icon": "🎨",
                      "children": [
                        {"title": "Overview", "icon": "📄", "content": $DESIGN_README},
                        {"title": "Features", "icon": "⭐"},
                        {"title": "Changelog", "icon": "📝"},
                        {"title": "Human TODOs", "icon": "👤"}
                      ]
                    }
                  ]
                },
                {
                  "title": "Execution",
                  "icon": "🔨",
                  "children": [
                    {"title": "Global Backlog", "icon": "📊", "content": $BACKLOG},
                    {"title": "Current Sprint", "icon": "🏃", "content": $SPRINT},
                    {"title": "Recently Shipped", "icon": "✅", "content": $SHIPPED},
                    {"title": "Blocked/Waiting", "icon": "🚧", "content": $BLOCKED}
                  ]
                },
                {
                  "title": "Infrastructure",
                  "icon": "🏗",
                  "children": [
                    {
                      "title": "Architecture",
                      "icon": "📐",
                      "children": [
                        {"title": "System Overview", "icon": "🗺️", "content": $ARCHITECTURE}
                      ]
                    },
                    {
                      "title": "Deployment",
                      "icon": "🚀",
                      "children": [
                        {"title": "Overview", "icon": "📄", "content": $DEPLOYMENT}
                      ]
                    },
                    {"title": "Security", "icon": "🔒", "content": $SECURITY},
                    {"title": "Monitoring", "icon": "📈"}
                  ]
                },
                {
                  "title": "AI Agents",
                  "icon": "🤖",
                  "children": [
                    {"title": "Agent Definitions", "icon": "📋"},
                    {"title": "Workflows", "icon": "🔄"},
                    {"title": "Logs/Reports", "icon": "📊"}
                  ]
                },
                {
                  "title": "Playground",
                  "icon": "🧪",
                  "children": [
                    {
                      "title": "Soundscape",
                      "icon": "🎵",
                      "children": [
                        {"title": "Overview", "icon": "📄", "content": $SOUNDSCAPE_README}
                      ]
                    },
                    {
                      "title": "Systemic",
                      "icon": "🔧",
                      "children": [
                        {"title": "Overview", "icon": "📄", "content": $SYSTEMIC_README}
                      ]
                    },
                    {
                      "title": "Favicon",
                      "icon": "🎨",
                      "children": [
                        {"title": "Overview", "icon": "📄", "content": $FAVICON_README}
                      ]
                    }
                  ]
                },
                {
                  "title": "Operations",
                  "icon": "📅",
                  "children": [
                    {"title": "Costs", "icon": "💰", "content": $COSTS},
                    {"title": "Calendar", "icon": "📆"},
                    {"title": "Meeting Notes", "icon": "📝"},
                    {"title": "Admin", "icon": "⚙️"}
                  ]
                }
              ]
            }
          }
          STRUCTURE_EOF

          # Send to Supabase
          response=$(curl -s -X POST "$SUPABASE_URL/functions/v1/notion-sync" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/structure.json)

          echo "Response: $response"

          # Parse results
          created=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('created',[])))" 2>/dev/null || echo "?")
          updated=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('updated',[])))" 2>/dev/null || echo "?")
          skipped=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('skipped',[])))" 2>/dev/null || echo "?")

          echo "📊 Results: Created=$created, Updated=$updated, Skipped=$skipped"

          if echo "$response" | grep -q '"success":true'; then
            echo "✅ Notion sync successful"
          else
            echo "⚠️ Notion sync completed with some errors"
          fi

  # Triggered on every push - quick status and security check
  on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Run Status Update Agent
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ');
            console.log('Changed files:', changedFiles);

            // Log status update
            console.log('📊 Status Update Agent triggered');
            console.log(`Branch: ${context.ref}`);
            console.log(`Commit: ${context.sha.substring(0, 7)}`);
            console.log(`Files changed: ${changedFiles.length}`);

      - name: Run Security Scan
        if: contains(steps.changed-files.outputs.all_changed_files, 'supabase/') || contains(steps.changed-files.outputs.all_changed_files, '.env')
        run: |
          echo "🔒 Security & Compliance Agent triggered"
          echo "Scanning for sensitive data patterns..."
          # Check for potential secrets in changed files
          if grep -r -E "(api[_-]?key|secret|password|token)" --include="*.ts" --include="*.js" supabase/ 2>/dev/null | grep -v "process.env" | grep -v "Deno.env"; then
            echo "⚠️ Warning: Potential hardcoded secrets detected"
          else
            echo "✅ No hardcoded secrets detected"
          fi

  # Triggered on PRs - organizational and project management review
  on-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Organizational Agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('📋 Organizational Agent triggered for PR #' + context.payload.pull_request.number);

            // Check for documentation
            const fs = require('fs');
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '';

            let suggestions = [];

            // Check if PR has description
            if (prBody.length < 50) {
              suggestions.push('- Consider adding a more detailed PR description');
            }

            // Check for related docs
            if (prTitle.toLowerCase().includes('feature') && !prBody.includes('PRD')) {
              suggestions.push('- Link to relevant PRD document if this is a new feature');
            }

            if (suggestions.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## 📋 Organizational Agent Review\n\n${suggestions.join('\n')}\n\n---\n*Automated review by AI Agent Workforce*`
              });
            }

      - name: Check Documentation Standards
        run: |
          echo "📝 Checking documentation standards..."

          # Check CLAUDE.md exists
          if [ -f "CLAUDE.md" ]; then
            echo "✅ CLAUDE.md exists"
          else
            echo "❌ CLAUDE.md missing"
          fi

          # Check docs directory structure
          for prefix in PRD TECH PROJECT-PLAN; do
            count=$(ls docs/${prefix}-*.md 2>/dev/null | wc -l)
            echo "📄 ${prefix} documents: ${count}"
          done

  # Daily synthesis by Chief of Staff
  daily-synthesis:
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Chief of Staff Daily Synthesis
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🎯 Chief of Staff Agent - Daily Synthesis');
            console.log('Date:', new Date().toISOString().split('T')[0]);

            // This would call the Supabase edge function in production
            console.log('Gathering inputs from Status Update and Organizational agents...');
            console.log('Generating daily synthesis report...');

      - name: Create Daily Summary Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];

            // Check if issue already exists for today
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'daily-synthesis',
              state: 'open'
            });

            const todayIssue = existingIssues.data.find(i => i.title.includes(today));

            if (!todayIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Daily Synthesis - ${today}`,
                body: `## Chief of Staff Daily Report\n\n### Status\n- [ ] Review pending\n\n### Key Updates\n*Auto-generated - update with actual status*\n\n### Action Items\n- [ ] Review and update\n\n---\n*Generated by AI Agent Workforce*`,
                labels: ['daily-synthesis', 'automated']
              });
            }

  # Weekly improvement analysis
  weekly-improvement:
    if: github.event_name == 'schedule' && github.event.schedule == '0 16 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Continuous Improvement Analysis
        run: |
          echo "📈 Continuous Improvement Agent - Weekly Analysis"
          echo "================================================"

          # Git metrics for the week
          echo ""
          echo "## Commits this week"
          git log --oneline --since="1 week ago" | head -20

          echo ""
          echo "## Files most changed"
          git log --since="1 week ago" --name-only --pretty=format: | sort | uniq -c | sort -rn | head -10

          echo ""
          echo "## Contributors"
          git log --since="1 week ago" --pretty=format:"%an" | sort | uniq -c | sort -rn

      - name: Create Weekly Report Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const weekStart = new Date();
            weekStart.setDate(weekStart.getDate() - 7);
            const weekEnd = new Date();

            const title = `📈 Weekly Improvement Report - ${weekStart.toISOString().split('T')[0]} to ${weekEnd.toISOString().split('T')[0]}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## Continuous Improvement Weekly Analysis\n\n### Metrics Summary\n*See action logs for detailed metrics*\n\n### Opportunities Identified\n- [ ] Review and prioritize\n\n### Experiments to Consider\n- [ ] Define experiments based on data\n\n---\n*Generated by AI Agent Workforce*`,
              labels: ['weekly-improvement', 'automated']
            });

  # Manual agent trigger
  manual-trigger:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Selected Agent
        run: |
          echo "🤖 Running agent: ${{ inputs.agent }}"

          case "${{ inputs.agent }}" in
            "status-update")
              echo "📊 Status Update Agent"
              echo "Current branch: $(git branch --show-current)"
              echo "Last commit: $(git log -1 --oneline)"
              ;;
            "organizational")
              echo "📋 Organizational Agent"
              echo "Checking documentation standards..."
              ;;
            "project-management")
              echo "📅 Project Management Agent"
              echo "Reviewing backlog and PRDs..."
              ;;
            "chief-of-staff")
              echo "🎯 Chief of Staff Agent"
              echo "Generating synthesis..."
              ;;
            "security-compliance")
              echo "🔒 Security & Compliance Agent"
              echo "Running security scan..."
              ;;
            "continuous-improvement")
              echo "📈 Continuous Improvement Agent"
              echo "Analyzing patterns..."
              ;;
            "all")
              echo "🚀 Running all agents..."
              ;;
          esac

      - name: Call Agent Handler (Production)
        if: env.SUPABASE_URL != ''
        run: |
          echo "Calling Supabase edge function..."
          # In production, this would call:
          # curl -X POST "$SUPABASE_URL/functions/v1/agent-handler" \
          #   -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
          #   -H "Content-Type: application/json" \
          #   -d '{"agent": "${{ inputs.agent }}", "trigger": "manual"}'
