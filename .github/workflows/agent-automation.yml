name: AI Agent Automation

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
      - docs-sync
  pull_request:
    types: [opened, synchronize, ready_for_review]
  schedule:
    # Daily synthesis at 9 AM UTC
    - cron: '0 9 * * *'
    # Weekly health check + improvement analysis on Fridays at 4 PM UTC
    - cron: '0 16 * * 5'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to run'
        required: false
        default: 'status-update'
        type: choice
        options:
          - status-update
          - organizational
          - project-management
          - chief-of-staff
          - security-compliance
          - continuous-improvement
          - health-check
          - all
      force_full_sync:
        description: 'Force full Notion sync (all pages)'
        required: false
        type: boolean
        default: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  # Sync to Notion
  # - docs-sync branch: always sync (dedicated docs branch)
  # - master/main: only when doc files changed
  # - claude/*: only when doc files changed
  # - manual: always sync
  notion-sync:
    if: >-
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/docs-sync' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/claude/')
      )) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for diff

      - name: Check if docs changed
        id: docs-filter
        run: |
          # docs-sync branch and manual trigger always sync
          if [ "${{ github.ref }}" = "refs/heads/docs-sync" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "✅ Always sync on docs-sync branch or manual trigger"
            exit 0
          fi

          # For other branches, only sync if doc-related files changed
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DOC_CHANGES=$(git diff --name-only HEAD~1 HEAD -- '*.md' 'notion-structure.json' 'docs/' | wc -l)
          else
            DOC_CHANGES=1
          fi

          if [ "$DOC_CHANGES" -gt 0 ]; then
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "✅ $DOC_CHANGES doc files changed — will sync"
          else
            echo "should_sync=false" >> $GITHUB_OUTPUT
            echo "⏭️ No doc files changed — skipping Notion sync"
          fi

      - name: Detect Changed Files
        if: steps.docs-filter.outputs.should_sync == 'true'
        id: changes
        env:
          FORCE_SYNC: ${{ inputs.force_full_sync }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "🔍 Detecting changed files..."

          # Manual trigger - only full sync if force_full_sync is true
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_SYNC" = "true" ]; then
              echo "🔄 Manual trigger with force_full_sync - will sync all pages"
              echo "structure_changed=true" >> $GITHUB_OUTPUT
              git ls-files > /tmp/changed_files.txt
            else
              echo "📋 Manual trigger (no force) - no files changed"
              echo "structure_changed=false" >> $GITHUB_OUTPUT
              echo "" > /tmp/changed_files.txt
            fi
            exit 0
          fi

          # Get list of changed files
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            # First commit - treat all files as changed
            CHANGED=$(git ls-files)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Check if structure config changed (affects page organization, not content)
          if echo "$CHANGED" | grep -q "notion-structure.json"; then
            echo "structure_changed=true" >> $GITHUB_OUTPUT
            echo "📁 Structure config changed - will update page organization"
          else
            echo "structure_changed=false" >> $GITHUB_OUTPUT
          fi

          # Count markdown files changed
          MD_COUNT=$(echo "$CHANGED" | grep -c '\.md$' || echo "0")
          echo "📄 $MD_COUNT markdown files changed"

          # Save changed files for later
          echo "$CHANGED" > /tmp/changed_files.txt

      - name: Detect Moved Pages in Notion
        # DISABLED: GitHub is source of truth, not Notion
        # Re-enable this when bidirectional sync is ready
        if: false
        id: detect-moves
        run: |
          echo "🔍 Checking for pages moved in Notion..."

          if [ ! -f "notion-structure.json" ]; then
            echo "moves_detected=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          structure=$(cat notion-structure.json)
          payload=$(python3 -c "import json; s=json.loads('''$structure'''); print(json.dumps({'action': 'detect-moves', 'structure': s}))")

          response=$(curl -s -X POST "$SUPABASE_URL/functions/v1/notion-sync" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "Detect moves response: $response"

          # Check if any pages were moved
          moved_count=$(echo "$response" | python3 -c "import json,sys; r=json.load(sys.stdin); print(len(r.get('moved', [])))" 2>/dev/null || echo "0")

          if [ "$moved_count" -gt "0" ]; then
            echo "📦 Found $moved_count pages moved in Notion"
            echo "moves_detected=true" >> $GITHUB_OUTPUT
            echo "$response" > /tmp/moved_pages.json
          else
            echo "✅ No moved pages detected"
            echo "moves_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Config for Moved Pages
        if: steps.detect-moves.outputs.moves_detected == 'true'
        run: |
          echo "📝 Auto-updating notion-structure.json to reflect Notion changes..."

          python3 << 'PYEOF'
          import json

          # Load moved pages info
          with open('/tmp/moved_pages.json') as f:
              response = json.load(f)

          moved = response.get('moved', [])
          if not moved:
              print("No moves to process")
              exit(0)

          # Load current structure
          with open('notion-structure.json') as f:
              structure = json.load(f)

          def find_and_remove_page(obj, title, parent_list=None, parent_key=None):
              """Find a page by title and remove it from its parent. Returns the removed page."""
              if isinstance(obj, dict):
                  for key in ['children', 'sections']:
                      if key in obj and isinstance(obj[key], list):
                          for i, child in enumerate(obj[key]):
                              if isinstance(child, dict) and child.get('title') == title:
                                  return obj[key].pop(i)
                              result = find_and_remove_page(child, title, obj[key], key)
                              if result:
                                  return result
              return None

          def find_parent(obj, parent_title):
              """Find a parent page/section by title. Returns the 'children' list to append to."""
              if isinstance(obj, dict):
                  if obj.get('title') == parent_title:
                      if 'children' not in obj:
                          obj['children'] = []
                      return obj['children']
                  for key in ['children', 'sections']:
                      if key in obj and isinstance(obj[key], list):
                          for child in obj[key]:
                              result = find_parent(child, parent_title)
                              if result is not None:
                                  return result
              return None

          changes_made = []
          for m in moved:
              title = m['title']
              old_parent = m['expectedParent']
              new_parent = m['actualParent']

              print(f"Moving '{title}': {old_parent} → {new_parent}")

              # Remove page from old location
              page_data = find_and_remove_page(structure, title)
              if not page_data:
                  print(f"  ⚠️ Could not find '{title}' in structure")
                  continue

              # Find new parent and add page there
              new_parent_children = find_parent(structure, new_parent)
              if new_parent_children is None:
                  # Try finding in sections at root level
                  for section in structure.get('sections', []):
                      if section.get('title') == new_parent:
                          if 'children' not in section:
                              section['children'] = []
                          new_parent_children = section['children']
                          break

              if new_parent_children is not None:
                  new_parent_children.append(page_data)
                  changes_made.append(f"{title}: {old_parent} → {new_parent}")
                  print(f"  ✅ Moved successfully")
              else:
                  print(f"  ⚠️ Could not find parent '{new_parent}' - skipping")
                  # Put it back where it was
                  old_parent_children = find_parent(structure, old_parent)
                  if old_parent_children is not None:
                      old_parent_children.append(page_data)

          if changes_made:
              # Save updated structure
              with open('notion-structure.json', 'w') as f:
                  json.dump(structure, f, indent=2)

              print(f"\n✅ Updated notion-structure.json with {len(changes_made)} moves:")
              for c in changes_made:
                  print(f"  • {c}")

              # Signal that we need to commit
              with open('/tmp/structure_updated', 'w') as f:
                  f.write('true')
          else:
              print("\n⚠️ No changes could be applied automatically")
          PYEOF

      - name: Commit Structure Changes
        if: steps.detect-moves.outputs.moves_detected == 'true'
        run: |
          if [ -f /tmp/structure_updated ]; then
            echo "📤 Committing structure changes..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add notion-structure.json
            git commit -m "Auto-update structure to match Notion page moves

            Pages were reorganized in Notion and structure was updated to match.
            " || echo "No changes to commit"
            git push || echo "Push failed - may need manual intervention"
          else
            echo "No structure changes to commit"
          fi

      - name: Sync Page Structure
        if: env.SUPABASE_URL != '' && steps.docs-filter.outputs.should_sync == 'true'
        run: |
          echo "═══════════════════════════════════════════"
          echo "📁 STRUCTURE SYNC: Create/move pages"
          echo "═══════════════════════════════════════════"
          echo "Creates page hierarchy, no content yet"
          echo ""

          # Sync structure ONLY (no content) - content synced individually in next step
          if [ -f "notion-structure.json" ]; then
            # Build payload WITHOUT file contents - just structure
            python3 << 'PYEOF'
          import json
          import sys

          def log(msg):
              print(msg, file=sys.stderr)

          with open('notion-structure.json') as f:
              structure = json.load(f)

          # Structure-only sync (skipContent: true)
          payload = {
              'action': 'sync-structure',
              'skipContent': True,
              'structure': structure
          }

          with open('/tmp/sync_payload.json', 'w') as f:
              json.dump(payload, f)

          log(f"✅ Structure payload ready ({len(json.dumps(payload)):,} bytes)")
          PYEOF

          else
            echo "📁 Using default structure from function"
            echo '{"action": "sync-structure", "skipContent": true}' > /tmp/sync_payload.json
          fi

          response=$(curl -s -X POST "$SUPABASE_URL/functions/v1/notion-sync" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/sync_payload.json)

          echo "Structure sync response: $response"

          if echo "$response" | grep -q '"success":true'; then
            echo "✅ Structure sync successful"
            # Save response and parse it
            echo "$response" > /tmp/structure_response.json
            python3 << 'PYEOF'
          import json
          with open('/tmp/structure_response.json') as f:
              r = json.load(f)
          created = r.get('created', [])
          print('Created:', created)
          print('Updated:', r.get('updated', []))
          print('Errors:', r.get('errors', []))
          # Save created page titles for content sync
          with open('/tmp/created_pages.txt', 'w') as f:
              for page_path in created:
                  # Extract page title from path like 'Execution > Project Plan > Phase 1'
                  title = page_path.split(' > ')[-1] if ' > ' in page_path else page_path
                  f.write(title + '\n')
          print(str(len(created)) + ' new pages will have content synced')
          PYEOF
          else
            echo "⚠️ Structure sync had issues"
            > /tmp/created_pages.txt
          fi

          # Small delay before cleanup
          echo "⏳ Waiting 5s..."
          sleep 5

      - name: Cleanup Orphaned Pages
        if: env.SUPABASE_URL != '' && steps.docs-filter.outputs.should_sync == 'true'
        run: |
          echo "═══════════════════════════════════════════"
          echo "🧹 CLEANUP: Archive orphaned pages"
          echo "═══════════════════════════════════════════"
          echo "Archives pages not in notion-structure.json"
          echo ""

          if [ ! -f "notion-structure.json" ]; then
            echo "⚠️ notion-structure.json not found, skipping cleanup"
            exit 0
          fi

          # Build cleanup payload with source-aware logic
          # Deletes: AI pages, orphan pages (not in structure), empty human pages
          # Protects: Only explicitly marked human pages with content
          python3 << 'PYEOF' > /tmp/cleanup_payload.json
          import json

          with open('notion-structure.json') as f:
              structure = json.load(f)

          # Extract all page titles and their sources
          # Only pages IN the structure get a source; orphans default to deletable
          def extract_sources(obj, sources=None):
              if sources is None:
                  sources = {}
              if isinstance(obj, dict):
                  if 'title' in obj:
                      sources[obj['title']] = obj.get('source', 'ai')  # Default to ai (deletable)
                  for key in ['children', 'sections']:
                      if key in obj:
                          for child in obj[key]:
                              extract_sources(child, sources)
              return sources

          page_sources = extract_sources(structure)

          payload = {
              'action': 'cleanup',
              'structure': structure,
              'pageSources': page_sources,
              'protectHuman': True
          }
          print(json.dumps(payload))
          PYEOF

          response=$(curl -s -X POST "$SUPABASE_URL/functions/v1/notion-sync" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/cleanup_payload.json)

          echo "Cleanup response: $response"

          if echo "$response" | grep -q '"success":true'; then
            echo "✅ Cleanup complete"
            echo "$response" | python3 -c "import json,sys; r=json.load(sys.stdin); print('Deleted:', r.get('deleted', [])); print('Protected:', r.get('protected', []))" 2>/dev/null || true
          else
            echo "⚠️ Cleanup had issues: $response"
          fi

          # Small delay before content sync
          sleep 5

      - name: Sync Page Content
        if: env.SUPABASE_URL != '' && steps.docs-filter.outputs.should_sync == 'true'
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRUCTURE_CHANGED: ${{ steps.changes.outputs.structure_changed }}
          FORCE_FULL_SYNC: ${{ github.event.inputs.force_full_sync }}
        run: |
          echo "═══════════════════════════════════════════"
          echo "📝 CONTENT SYNC: GitHub → Notion"
          echo "═══════════════════════════════════════════"
          echo "Mode: State-based (compares hashes to stored state)"
          echo ""

          # Wait for Notion to index any newly created pages from structure sync
          if [ "$STRUCTURE_CHANGED" = "true" ]; then
            echo "⏳ Waiting 10s for Notion to index new pages..."
            sleep 10
          fi

          # Track failed pages for retry
          > /tmp/failed_pages.txt

          if [ ! -f "notion-structure.json" ]; then
            echo "⚠️ notion-structure.json not found, skipping content sync"
            exit 0
          fi

          # Step 1: Compute hashes for all .md files and determine what needs syncing
          python3 << 'PYEOF'
          import json
          import os
          import hashlib
          import subprocess

          def extract_pages(obj, pages=None, parent_title=None):
              """Extract pages with their parent info for auto-creation support.
              Returns list of (title, filepath, icon, parent_title)"""
              if pages is None:
                  pages = []
              if isinstance(obj, dict):
                  current_title = obj.get('title')
                  icon = obj.get('icon', '📄')

                  if 'file' in obj and current_title:
                      # This is a content page - record with parent info
                      pages.append((current_title, obj['file'], icon, parent_title))

                  # Recurse into children, using current title as parent
                  for key in ['children', 'sections']:
                      if key in obj:
                          for child in obj[key]:
                              # If this page has a title, it becomes the parent for children
                              child_parent = current_title if current_title else parent_title
                              extract_pages(child, pages, child_parent)
              elif isinstance(obj, list):
                  for item in obj:
                      extract_pages(item, pages, parent_title)
              return pages

          def compute_hash(filepath):
              """Compute SHA-256 hash of file content"""
              try:
                  with open(filepath, 'rb') as f:
                      return hashlib.sha256(f.read()).hexdigest()
              except FileNotFoundError:
                  return None

          with open('notion-structure.json') as f:
              config = json.load(f)

          # Root page is the parent for top-level sections
          root_page = config.get('root', 'Ctrl')
          pages = extract_pages(config, parent_title=root_page)

          # Compute hashes for all pages with files
          content_hashes = {}
          page_info = {}  # filepath -> (title, icon, parent_title)
          for title, filepath, icon, parent_title in pages:
              if filepath and os.path.exists(filepath):
                  content_hashes[filepath] = compute_hash(filepath)
                  page_info[filepath] = (title, icon, parent_title)

          print(f"📊 Computed hashes for {len(content_hashes)} files")

          # Check if force full sync
          force_full_sync = os.environ.get('FORCE_FULL_SYNC', 'false') == 'true'

          if force_full_sync:
              # Sync ALL pages
              pages_to_sync = []
              for filepath, (title, icon, parent_title) in page_info.items():
                  pages_to_sync.append((title, filepath, content_hashes.get(filepath, ''), icon, parent_title))
              print(f"📋 Full sync (force requested): syncing ALL {len(pages_to_sync)} pages")

              # Save as JSON for easier parsing
              with open('/tmp/pages_to_sync.json', 'w') as f:
                  json.dump([{
                      'title': t, 'filepath': fp, 'hash': h, 'icon': i, 'parent': p
                  } for t, fp, h, i, p in pages_to_sync], f)
          else:
              # Call check-changes to find what needs syncing
              print("🔍 Checking state to find pages needing sync...")

              payload = {
                  'action': 'check-changes',
                  'contentHashes': content_hashes
              }

              with open('/tmp/check_payload.json', 'w') as f:
                  json.dump(payload, f)

              # Call the edge function
              result = subprocess.run([
                  'curl', '-s', '-X', 'POST',
                  f"{os.environ['SB_URL']}/functions/v1/notion-sync",
                  '-H', f"Authorization: Bearer {os.environ['SB_KEY']}",
                  '-H', 'Content-Type: application/json',
                  '-d', '@/tmp/check_payload.json'
              ], capture_output=True, text=True)

              try:
                  response = json.loads(result.stdout)
                  needs_sync = set(response.get('needsSync', []))
                  up_to_date = response.get('upToDate', [])

                  print(f"   Needs sync: {len(needs_sync)} pages")
                  print(f"   Up to date: {len(up_to_date)} pages")

                  if needs_sync:
                      print(f"   Pages: {', '.join(list(needs_sync)[:5])}{'...' if len(needs_sync) > 5 else ''}")

                  # Build list of pages to sync with full info
                  pages_to_sync = []
                  for filepath, (title, icon, parent_title) in page_info.items():
                      if filepath in needs_sync:
                          pages_to_sync.append({
                              'title': title,
                              'filepath': filepath,
                              'hash': content_hashes.get(filepath, ''),
                              'icon': icon,
                              'parent': parent_title
                          })

                  with open('/tmp/pages_to_sync.json', 'w') as f:
                      json.dump(pages_to_sync, f)

                  if not pages_to_sync:
                      print("✨ All pages are up to date!")

              except json.JSONDecodeError:
                  print(f"⚠️ Failed to parse check-changes response: {result.stdout[:200]}")
                  # Fall back to syncing nothing (safe default)
                  with open('/tmp/pages_to_sync.json', 'w') as f:
                      json.dump([], f)
          PYEOF

          # Step 2: Sync pages that need updating (using JSON format with parent/icon info)
          python3 -u << 'SYNC_PYEOF'
          import json
          import os
          import subprocess
          import time
          import sys

          def log(msg):
              """Print with immediate flush for GitHub Actions"""
              print(msg, flush=True)

          # Load pages to sync
          try:
              with open('/tmp/pages_to_sync.json') as f:
                  pages_to_sync = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              pages_to_sync = []

          if not pages_to_sync:
              log("✨ No pages need syncing")
              exit(0)

          log(f"\n───────────────────────────────────────────")
          log(f"📤 SYNCING {len(pages_to_sync)} PAGES")
          log(f"───────────────────────────────────────────")
          failed_pages = []

          def sync_page(page, index, total, is_retry=False):
              """Sync a single page, returns True on success"""
              filepath = page['filepath']
              title = page['title']
              hash_val = page['hash']
              icon = page.get('icon', '📄')
              parent = page.get('parent')

              if not os.path.exists(filepath):
                  log(f"[{index}/{total}] ⏭️ {title} — file not found")
                  return True  # Don't retry missing files

              # Read content
              with open(filepath, 'r') as f:
                  content = f.read()[:40000]

              word_count = len(content.split())
              prefix = f"[{index}/{total}]" if not is_retry else "[retry]"
              log(f"{prefix} 📄 {title} ({word_count} words)...")

              # Build payload with parent info for auto-creation
              payload = {
                  'action': 'update-page',
                  'page': {
                      'pageTitle': title,
                      'content': content,
                      'pagePath': filepath,
                      'contentHash': hash_val,
                      'parentPageTitle': parent,
                      'icon': icon
                  }
              }

              # Call the edge function
              result = subprocess.run([
                  'curl', '-s', '-X', 'POST',
                  f"{os.environ['SB_URL']}/functions/v1/notion-sync",
                  '-H', f"Authorization: Bearer {os.environ['SB_KEY']}",
                  '-H', 'Content-Type: application/json',
                  '-d', json.dumps(payload)
              ], capture_output=True, text=True)

              try:
                  response = json.loads(result.stdout)
                  if response.get('success'):
                      # Check if created or updated
                      created = response.get('created', [])
                      updated = response.get('updated', [])
                      if created:
                          log(f"        ✅ Created")
                      elif updated:
                          # Extract block count from update message
                          blocks = updated[0].split('(')[1].split(' ')[0] if '(' in updated[0] else '?'
                          log(f"        ✅ Done ({blocks} blocks)")
                      else:
                          log(f"        ✅ Done")
                      return True
                  else:
                      errors = response.get('errors', [])
                      log(f"        ⚠️ Failed: {errors[0] if errors else 'unknown error'}")
                      return False
              except json.JSONDecodeError:
                  log(f"        ⚠️ Failed: invalid response")
                  return False

          # First pass
          total = len(pages_to_sync)
          for i, page in enumerate(pages_to_sync, 1):
              if not sync_page(page, i, total):
                  failed_pages.append(page)
              time.sleep(2)

          # Retry failed pages up to 3 times
          for retry in range(1, 4):
              if not failed_pages:
                  break
              log(f"\n🔄 Retry {retry}: {len(failed_pages)} failed pages (waiting {retry * 10}s...)")
              time.sleep(retry * 10)

              retry_pages = failed_pages
              failed_pages = []
              for page in retry_pages:
                  if not sync_page(page, 0, 0, is_retry=True):
                      failed_pages.append(page)
                  time.sleep(3)

          # Report any remaining failures
          if failed_pages:
              log(f"\n⚠️ Some pages still failed after 3 retries:")
              for page in failed_pages:
                  log(f"   - {page['title']}")
              log("State NOT updated for these - will retry next run.")
          SYNC_PYEOF

          echo ""
          echo "═══════════════════════════════════════════"
          echo "✅ SYNC COMPLETE"
          echo "═══════════════════════════════════════════"

      - name: Sync Summary
        if: always() && env.SUPABASE_URL != '' && steps.docs-filter.outputs.should_sync == 'true'
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "📊 SYNC SUMMARY"
          echo "═══════════════════════════════════════════"
          echo ""

          # Parse structure response if available
          if [ -f /tmp/structure_response.json ]; then
            python3 << 'PYEOF'
          import json
          try:
              with open('/tmp/structure_response.json') as f:
                  r = json.load(f)
              created = len(r.get('created', []))
              updated = len(r.get('updated', []))
              skipped = len(r.get('skipped', []))
              errors = len(r.get('errors', []))
              deleted = len(r.get('deleted', []))
              protected_pages = len(r.get('protected', []))
              metrics = r.get('metrics', {})

              print("Structure Sync:")
              print(f"  Created:   {created}")
              print(f"  Skipped:   {skipped}")
              if errors:
                  print(f"  Errors:    {errors}")
              if metrics:
                  print(f"  Duration:  {metrics.get('durationMs', '?')}ms")
                  print(f"  API calls: {metrics.get('apiCalls', '?')}")
          except Exception as e:
              print(f"  Could not parse structure response: {e}")
          PYEOF
          fi

          # Count content sync results
          if [ -f /tmp/pages_to_sync.json ]; then
            TOTAL=$(python3 -c "import json; print(len(json.load(open('/tmp/pages_to_sync.json'))))" 2>/dev/null || echo "?")
            echo ""
            echo "Content Sync:"
            echo "  Pages synced: $TOTAL"
          fi

          echo ""
          echo "Root page: $(python3 -c "import json; print(json.load(open('notion-structure.json')).get('root', '?'))" 2>/dev/null || echo "?")"
          echo "Total pages in structure: $(python3 -c "
          import json
          def count(obj):
              c = 0
              if isinstance(obj, dict):
                  if 'title' in obj: c += 1
                  for k in ['children', 'sections']:
                      if k in obj:
                          for child in obj[k]: c += count(child)
              return c
          print(sum(count(s) for s in json.load(open('notion-structure.json')).get('sections', [])))
          " 2>/dev/null || echo "?")"

  # Triggered on every push - quick status and security check
  on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Run Status Update Agent
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ');
            console.log('Changed files:', changedFiles);

            // Log status update
            console.log('📊 Status Update Agent triggered');
            console.log(`Branch: ${context.ref}`);
            console.log(`Commit: ${context.sha.substring(0, 7)}`);
            console.log(`Files changed: ${changedFiles.length}`);

      - name: Run Security Scan
        if: contains(steps.changed-files.outputs.all_changed_files, 'supabase/') || contains(steps.changed-files.outputs.all_changed_files, '.env')
        run: |
          echo "🔒 Security & Compliance Agent triggered"
          echo "Scanning for sensitive data patterns..."
          # Check for potential secrets in changed files
          if grep -r -E "(api[_-]?key|secret|password|token)" --include="*.ts" --include="*.js" supabase/ 2>/dev/null | grep -v "process.env" | grep -v "Deno.env"; then
            echo "⚠️ Warning: Potential hardcoded secrets detected"
          else
            echo "✅ No hardcoded secrets detected"
          fi

  # Triggered on PRs - organizational and project management review
  on-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Organizational Agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('📋 Organizational Agent triggered for PR #' + context.payload.pull_request.number);

            // Check for documentation
            const fs = require('fs');
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '';

            let suggestions = [];

            // Check if PR has description
            if (prBody.length < 50) {
              suggestions.push('- Consider adding a more detailed PR description');
            }

            // Check for related docs
            if (prTitle.toLowerCase().includes('feature') && !prBody.includes('PRD')) {
              suggestions.push('- Link to relevant PRD document if this is a new feature');
            }

            if (suggestions.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## 📋 Organizational Agent Review\n\n${suggestions.join('\n')}\n\n---\n*Automated review by AI Agent Workforce*`
              });
            }

      - name: Check Documentation Standards
        run: |
          echo "📝 Checking documentation standards..."

          # Check CLAUDE.md exists
          if [ -f "CLAUDE.md" ]; then
            echo "✅ CLAUDE.md exists"
          else
            echo "❌ CLAUDE.md missing"
          fi

          # Check docs directory structure
          for prefix in PRD TECH PROJECT-PLAN; do
            count=$(ls docs/${prefix}-*.md 2>/dev/null | wc -l)
            echo "📄 ${prefix} documents: ${count}"
          done

  # Daily synthesis by Chief of Staff
  daily-synthesis:
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Chief of Staff Daily Synthesis
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🎯 Chief of Staff Agent - Daily Synthesis');
            console.log('Date:', new Date().toISOString().split('T')[0]);

            // This would call the Supabase edge function in production
            console.log('Gathering inputs from Status Update and Organizational agents...');
            console.log('Generating daily synthesis report...');

      - name: Create Daily Summary Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];

            // Check if issue already exists for today
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'daily-synthesis',
              state: 'open'
            });

            const todayIssue = existingIssues.data.find(i => i.title.includes(today));

            if (!todayIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Daily Synthesis - ${today}`,
                body: `## Chief of Staff Daily Report\n\n### Status\n- [ ] Review pending\n\n### Key Updates\n*Auto-generated - update with actual status*\n\n### Action Items\n- [ ] Review and update\n\n---\n*Generated by AI Agent Workforce*`,
                labels: ['daily-synthesis', 'automated']
              });
            }

  # Weekly improvement analysis
  weekly-improvement:
    if: github.event_name == 'schedule' && github.event.schedule == '0 16 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Continuous Improvement Analysis
        run: |
          echo "📈 Continuous Improvement Agent - Weekly Analysis"
          echo "================================================"

          # Git metrics for the week
          echo ""
          echo "## Commits this week"
          git log --oneline --since="1 week ago" | head -20

          echo ""
          echo "## Files most changed"
          git log --since="1 week ago" --name-only --pretty=format: | sort | uniq -c | sort -rn | head -10

          echo ""
          echo "## Contributors"
          git log --since="1 week ago" --pretty=format:"%an" | sort | uniq -c | sort -rn

      - name: Create Weekly Report Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const weekStart = new Date();
            weekStart.setDate(weekStart.getDate() - 7);
            const weekEnd = new Date();

            const title = `📈 Weekly Improvement Report - ${weekStart.toISOString().split('T')[0]} to ${weekEnd.toISOString().split('T')[0]}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## Continuous Improvement Weekly Analysis\n\n### Metrics Summary\n*See action logs for detailed metrics*\n\n### Opportunities Identified\n- [ ] Review and prioritize\n\n### Experiments to Consider\n- [ ] Define experiments based on data\n\n---\n*Generated by AI Agent Workforce*`,
              labels: ['weekly-improvement', 'automated']
            });

  # Weekly docs health check (runs alongside weekly-improvement on Fridays)
  docs-health-check:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 16 * * 5') ||
      (github.event_name == 'workflow_dispatch' && inputs.agent == 'health-check')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Docs Health Check
        if: env.SUPABASE_URL != ''
        run: |
          echo "═══════════════════════════════════════════"
          echo "🏥 DOCS HEALTH CHECK"
          echo "═══════════════════════════════════════════"
          echo ""

          if [ ! -f "notion-structure.json" ]; then
            echo "⚠️ notion-structure.json not found, skipping"
            exit 0
          fi

          # Build health check payload
          python3 << 'PYEOF' > /tmp/health_payload.json
          import json
          with open('notion-structure.json') as f:
              structure = json.load(f)
          payload = {
              'action': 'health-check',
              'structure': structure,
              'staleDays': 90,
              'autoFix': False
          }
          print(json.dumps(payload))
          PYEOF

          response=$(curl -s -X POST "$SUPABASE_URL/functions/v1/notion-sync" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/health_payload.json)

          echo "$response" > /tmp/health_response.json

          # Parse and display report
          python3 << 'PYEOF'
          import json
          try:
              with open('/tmp/health_response.json') as f:
                  r = json.load(f)
              report = r.get('healthReport', {})

              print(f"Summary: {report.get('summary', 'N/A')}")
              print(f"")
              print(f"Total pages:  {report.get('totalPages', '?')}")
              print(f"Checked:      {report.get('pagesChecked', '?')}")
              print(f"Healthy:      {report.get('healthy', '?')}")

              stale = report.get('stale', [])
              if stale:
                  print(f"\n⏰ Stale pages ({len(stale)}):")
                  for p in stale:
                      print(f"  - {p['title']} ({p.get('daysSinceEdit', '?')} days)")

              empty = report.get('empty', [])
              if empty:
                  print(f"\n📭 Empty pages ({len(empty)}):")
                  for p in empty:
                      print(f"  - {p['title']} (human: {p.get('isHuman', '?')})")

              orphaned = report.get('orphaned', [])
              if orphaned:
                  print(f"\n👻 Orphaned pages ({len(orphaned)}):")
                  for p in orphaned:
                      print(f"  - {p['title']} (under {p.get('parentTitle', '?')})")

              missing = report.get('missingInNotion', [])
              if missing:
                  print(f"\n❌ Missing in Notion ({len(missing)}):")
                  for p in missing:
                      print(f"  - {p['title']} (expected under {p.get('parentTitle', '?')})")

              dupes = report.get('duplicateTitles', [])
              if dupes:
                  print(f"\n⚠️ Duplicate titles ({len(dupes)}):")
                  for d in dupes:
                      print(f"  - \"{d['title']}\" x{d['count']}")

          except Exception as e:
              print(f"Could not parse health report: {e}")
          PYEOF

      - name: Create Health Report Issue
        if: env.SUPABASE_URL != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().split('T')[0];

            let report = {};
            try {
              const raw = fs.readFileSync('/tmp/health_response.json', 'utf8');
              const response = JSON.parse(raw);
              report = response.healthReport || {};
            } catch (e) {
              console.log('No health report to process');
              return;
            }

            const stale = report.stale || [];
            const empty = report.empty || [];
            const orphaned = report.orphaned || [];
            const missing = report.missingInNotion || [];
            const dupes = report.duplicateTitles || [];
            const totalIssues = stale.length + empty.length + orphaned.length + missing.length;

            // Only create issue if there are problems
            if (totalIssues === 0 && dupes.length === 0) {
              console.log('✅ All pages healthy, no issue needed');
              return;
            }

            let body = `## Docs Health Report — ${today}\n\n`;
            body += `**Summary**: ${report.summary || 'N/A'}\n\n`;

            if (stale.length > 0) {
              body += `### ⏰ Stale Pages (${stale.length})\n`;
              for (const p of stale) {
                body += `- [ ] **${p.title}** — ${p.daysSinceEdit} days since edit\n`;
              }
              body += '\n';
            }

            if (empty.length > 0) {
              body += `### 📭 Empty Pages (${empty.length})\n`;
              for (const p of empty) {
                body += `- [ ] **${p.title}** (${p.isHuman ? 'human' : 'bot'}-created)\n`;
              }
              body += '\n';
            }

            if (orphaned.length > 0) {
              body += `### 👻 Orphaned Pages (${orphaned.length})\n`;
              for (const p of orphaned) {
                body += `- [ ] **${p.title}** under ${p.parentTitle}\n`;
              }
              body += '\n';
            }

            if (missing.length > 0) {
              body += `### ❌ Missing in Notion (${missing.length})\n`;
              for (const p of missing) {
                body += `- [ ] **${p.title}** (expected under ${p.parentTitle})\n`;
              }
              body += '\n';
            }

            if (dupes.length > 0) {
              body += `### ⚠️ Duplicate Titles (${dupes.length})\n`;
              for (const d of dupes) {
                body += `- **"${d.title}"** appears ${d.count}x\n`;
              }
              body += '\n';
            }

            body += '---\n*Generated by Docs Health Check Agent*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🏥 Docs Health Report — ${today}`,
              body: body,
              labels: ['docs-health', 'automated']
            });

  # Manual agent trigger
  manual-trigger:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

