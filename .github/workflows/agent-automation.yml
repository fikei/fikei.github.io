          # curl -X POST "$SUPABASE_URL/functions/v1/agent-handler" \
          #   -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
          #   -H "Content-Type: application/json" \
          #   -d '{"agent": "${{ inputs.agent }}", "trigger": "manual"}'
