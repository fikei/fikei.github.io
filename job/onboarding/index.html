<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>/job</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/auth/ctrl-auth.css">
  <link rel="stylesheet" href="/job/css/base.css?v=2.2.0">
  <link rel="stylesheet" href="/job/css/components.css?v=2.2.0">
  <style>
    /* Full-screen onboarding takeover, pre-auth by default. The sign-in
       modal mounts into #ctrl-auth-root but is only opened by the
       <job-onboarding> component at finalize time. */
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    .onboard-host {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
  </style>
  <script>
    // Pre-render auth check: an authed user with a completed profile who
    // somehow lands on /job/onboarding/ (deep link, refresh, etc) gets
    // bounced to /job/jobs/recommended/ BEFORE the onboarding HTML renders.
    // We read a cached completion flag from localStorage (written by
    // app.js applySignedInState whenever it sees a completed profile),
    // so the check is sync — no flash of onboarding for returning users.
    (function () {
      try {
        if (localStorage.getItem('job:profile:completed') === '1') {
          location.replace('/job/jobs/recommended/');
        }
      } catch (e) { /* fall through to render */ }
    })();
  </script>
  <script src="/job/js/theme.js?v=2.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
  <script src="/auth/ctrl-auth.js"></script>
</head>
<body data-auth-state="loading">

  <div id="ctrl-auth-root" style="display:none;"></div>

  <div class="onboard-host">
    <job-onboarding></job-onboarding>
  </div>

  <script type="module" src="/job/js/app.js?v=2.2.0"></script>
</body>
</html>
