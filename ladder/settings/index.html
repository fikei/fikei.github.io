<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings — Ladder</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/auth/ctrl-auth.css">
  <link rel="stylesheet" href="/ladder/css/base.css?v=2.40.0">
  <link rel="stylesheet" href="/ladder/css/components.css?v=2.40.0">
  <script src="/ladder/js/theme.js?v=2.40.0"></script>

<body data-auth-state="loading">

  <section id="signin-gate" class="gate">
    <div class="gate__card">
      <h1>Ladder</h1>
      <p>Sign in to view settings.</p>
      <button class="btn btn--primary" id="signin-btn">Sign in</button>
      <div id="ctrl-auth-root"></div>
    </div>
  </section>

  <div class="app">
    <ladder-rail></ladder-rail>
    <main class="app__main">
      <header class="page-header">
        <h1>Settings</h1>
        <p>Profile, onboarding, and demo entry points.</p>
      </header>
      <ladder-settings></ladder-settings>
    </main>
  </div>

  <script type="module" src="/ladder/js/app.js?v=2.40.0"></script>
