<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>/ladder — ctrl.rodeo</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/auth/ctrl-auth.css">
  <link rel="stylesheet" href="/ladder/css/base.css?v=2.4.0">
  <script src="/ladder/js/theme.js?v=2.4.0"></script>




  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
  <script src="/auth/ctrl-auth.js"></script>
  <script>
    // Pre-render routing — runs synchronously off localStorage so we never
    // flash the wrong shell at the user:
    //   - No Supabase session → /ladder/onboarding/ (pre-auth chat).
    //   - Session + completed profile → desktop /ladder/jobs/, mobile <ladder-home>.
    //   - Session but no completion flag → fall through to render <ladder-home>;
    //     app.js will reconcile against user_profile and redirect if needed.
    //
    // The `job:profile:completed` flag is written by app.js whenever it
    // confirms a completed profile, so subsequent loads pre-redirect with
    // no network call.
    (function () {
      try {
        // Gmail OAuth callback lands on /ladder/?code=…&state=gmail:… — do NOT
        // pre-route, or location.replace() strips the ?code before app.js can
        // capture it and the token exchange never happens (every refresh then
        // looks "disconnected"). Let app.js handle the callback on this page.
        var _sp = new URLSearchParams(location.search);
        if (_sp.get('code') && (_sp.get('state') || '').indexOf('gmail:') === 0) {
          return;
        }
        var raw = localStorage.getItem('sb-yfhudwakpgzswiylhfbh-auth-token');
        var hasSession = false;
        if (raw) {
          var parsed = JSON.parse(raw);
          hasSession = !!(parsed && parsed.access_token);
        }
        if (!hasSession) { location.replace('/ladder/onboarding/'); return; }
      } catch (e) {
        location.replace('/ladder/onboarding/');
        return;
      }
      // Desktop falls through to the Jobs list view — the rail nav is more
      // information-dense there, so the dashboard home is mobile-only.
      if (window.matchMedia('(min-width: 721px)').matches) {
        location.replace('/ladder/jobs/');
      }
    })();
  </script>
</head>
<body data-auth-state="loading">

  <section id="signin-gate" class="gate">
    <div class="gate__card">
      <h1>/ladder</h1>
      <p>Ian's career knowledge base and pipeline. Sign in to continue.</p>
      <button class="btn btn--primary" id="signin-btn">Sign in</button>
      <div id="ctrl-auth-root"></div>
    </div>
  </section>

  <div class="app">
    <ladder-rail></ladder-rail>
    <main class="app__main">
      <ladder-home></ladder-home>
    </main>
  </div>

  <script type="module" src="/ladder/js/app.js?v=2.4.0"></script>



</body>
</html>
