<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>/ladder</title>
  <meta name="robots" content="noindex">
  <script>
    // Pre-render auth check: an authed user with a completed profile who
    // somehow lands on /ladder/onboarding/ (deep link, refresh, stale cache)
    // gets bounced to /ladder/jobs/recommended/ BEFORE the onboarding HTML
    // renders. The completion flag is written by app.js applySignedInState
    // when it confirms a completed profile, so the check is sync.
    (function () {
      try {
        if (localStorage.getItem('job:profile:completed') === '1') {
          location.replace('/ladder/jobs/recommended/');
        }
      } catch (e) { /* fall through to render */ }
    })();
  </script>
  <link rel="stylesheet" href="/auth/ctrl-auth.css">
  <link rel="stylesheet" href="/ladder/css/base.css?v=2.6.0">
  <link rel="stylesheet" href="/ladder/css/components.css?v=2.6.0">
  <style>
    /* Full-screen onboarding takeover, pre-auth by default. The sign-in
       modal mounts into #ctrl-auth-root but is only opened by the
       <ladder-onboarding> component at finalize time. */
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    .onboard-host {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
  </style>
  <script src="/ladder/js/theme.js?v=2.6.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
  <script src="/auth/ctrl-auth.js"></script>
</head>
<body data-auth-state="loading">

  <div id="ctrl-auth-root" style="display:none;"></div>

  <div class="onboard-host">
    <ladder-onboarding></ladder-onboarding>
  </div>

  <script type="module" src="/ladder/js/app.js?v=2.6.0"></script>
</body>
</html>
