<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SoundScape</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Prompt-steerable audio-reactive visuals, in the browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <canvas id="hydra-canvas"></canvas>

  <!-- Start / loading screen -->
  <div class="start" id="start">
    <div class="start__title">SoundScape</div>
    <div class="start__subtitle">audio-reactive visuals · click start and allow mic</div>
    <div class="start__controls">
      <div class="start__source">
        <label for="source-sel" class="start__source-label">Source</label>
        <select class="select" id="source-sel">
          <option value="__default">system default</option>
          <option value="__synthetic">synthetic (no mic)</option>
        </select>
      </div>
      <button class="btn" id="start-btn">Start</button>
      <div class="start__options">
        <label><input type="checkbox" id="clap-chk" checked> semantic axes</label>
      </div>
    </div>
    <div class="start__progress" id="progress"></div>
    <div class="start__err" id="err"></div>
  </div>

  <!-- Live controls -->
  <div class="status-bar" id="status-bar">
    <span class="status-bar__indicator" id="status-dot"></span>
    <span id="status-text">ready</span>
  </div>

  <button class="corner-btn corner-btn--sidebar" id="sidebar-toggle" title="Controls" aria-label="Toggle controls">
    <span id="sidebar-caret">‹</span>
  </button>
  <button class="corner-btn corner-btn--hud" id="hud-toggle" title="Debug HUD (d)" aria-label="Toggle debug HUD">D</button>
  <button class="corner-btn corner-btn--fullscreen" id="fs-toggle" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__title">Controls</div>

    <section class="section">
      <h3 class="section__title">Prompt</h3>
      <textarea class="prompt__text" id="prompt-text" rows="3" placeholder="e.g. foggy forest at dawn, meditative drift"></textarea>
      <div class="prompt__drop" id="prompt-drop">
        <input type="file" id="prompt-file" accept="image/*" multiple hidden>
        <div class="prompt__drop-hint" id="prompt-drop-hint">drop 1–5 images · or click</div>
        <div class="prompt__thumbs" id="prompt-thumbs"></div>
      </div>
      <div style="display:flex;gap:var(--space-2);margin-top:var(--space-2)">
        <button class="btn" id="compile-btn">Compile</button>
        <button class="btn" id="refine-btn" title="Regenerate with same inputs">Refine</button>
        <label class="prompt__auto" title="re-compile every 45s with slight variation">
          <input type="checkbox" id="auto-compile-chk"> auto
        </label>
      </div>
      <div class="prompt__status" id="prompt-status"></div>
    </section>

    <section class="section">
      <h3 class="section__title">Source</h3>
      <select class="select" id="source-sel-live" style="width:100%"></select>
      <div style="margin-top:var(--space-2);font-size:var(--text-xs);color:var(--gray-600);text-transform:uppercase;letter-spacing:var(--tracking-wide)" id="source-info"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h3 class="section__title">Starting point</h3>
        <button class="btn btn--sm btn--ghost" id="save-preset" title="Snapshot current knobs as a preset">save</button>
      </div>
      <div style="display:flex;gap:var(--space-2);flex-wrap:wrap" id="preset-buttons">
        <button class="btn btn--sm" data-preset="drift">Drift</button>
        <button class="btn btn--sm" data-preset="pulse">Pulse</button>
        <button class="btn btn--sm" data-preset="minimal">Minimal</button>
      </div>
      <div class="hint-line">transitions knob values — no cuts</div>
    </section>

    <section class="section">
      <h3 class="section__title">Transition</h3>
      <select class="select" id="transition-sel" style="width:100%"></select>
    </section>

    <section class="section">
      <div class="section__head">
        <h3 class="section__title">Primitives</h3>
        <button class="btn btn--sm btn--ghost" id="knobs-lock-all" title="Lock / unlock all primitives">lock all</button>
      </div>
      <div id="knobs-panel"></div>
    </section>

    <!--
      Semantic axis sliders removed for now. CLAP still runs and updates
      window.viz.axis[*]; values are visible in the debug HUD (press `d`).
      The bus + compiler output all still flow, so this can be brought
      back as-is. See control/axes.js for the underlying machinery.
    -->
  </aside>

  <div class="hud" id="hud"></div>

  <!-- Runtime -->
  <script src="https://unpkg.com/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script src="visuals/engine.js"></script>

  <script type="module">
    import { startAudio, listInputDevices } from "./audio/features.js";
    import { startClap } from "./audio/clap.js";
    import { DEFAULT_AXES, createAxisBus } from "./control/axes.js";
    import {
      createKnobBus, DEFAULT_KNOBS, KNOB_NAMES, KNOB_PRESETS,
      TRANSITION_MODES, DEFAULT_TRANSITION,
    } from "./control/knobs.js";
    import { AUDIO_SOURCES, SOURCE_GROUPS } from "./control/sources.js";
    import { compilePrompt, fileToImage, hexToNormRGB } from "./llm/compiler.js";

    // ---------- shared /viz/ state ----------
    window.viz = {
      energy: 0, transient: 0, beat_phase: 0, brightness: 0.3, bpm: 120,
      low: 0, mid: 0, high: 0,       // Stage-3.5 frequency-band energies
      axis: {},                      // CLAP semantic axes
      knob: {},                      // continuous primitives (engine.js reads these)
      palette: [],                   // raw hex strings from LLM
      paletteRGB: [],                // parallel [r,g,b] in 0..1
    };
    function setPalette(hexes) {
      if (!Array.isArray(hexes)) return;
      window.viz.palette = hexes.slice();
      window.viz.paletteRGB = hexes.map(hexToNormRGB);
    }

    const $ = (id) => document.getElementById(id);
    const startEl = $("start");
    const startBtn = $("start-btn");
    const sourceSel = $("source-sel");
    const sourceSelLive = $("source-sel-live");
    const sourceInfo = $("source-info");
    const clapChk = $("clap-chk");
    const errEl = $("err");
    const progEl = $("progress");
    const statusBar = $("status-bar");
    const statusDot = $("status-dot");
    const statusText = $("status-text");
    const axesPanel = $("axes-panel");
    const sidebar = $("sidebar");
    const sidebarToggle = $("sidebar-toggle");
    const sidebarCaret = $("sidebar-caret");
    const hudToggle = $("hud-toggle");
    const fsToggle = $("fs-toggle");
    const hud = $("hud");

    // URL flags
    const urlParams = new URLSearchParams(location.search);
    if (urlParams.get("loopback") === "1") sourceSel.value = "__synthetic";
    if (urlParams.get("clap") === "0") clapChk.checked = false;

    // Populate device list at page load (labels will be masked until the
    // first mic-permission grant; after that a reload will show full labels).
    async function refreshDevices(selectedId = null) {
      const devs = await listInputDevices();
      // Rebuild the start-screen dropdown while preserving the special entries.
      const startSpecial = ['__default', '__synthetic'];
      sourceSel.innerHTML =
        `<option value="__default">system default</option>` +
        `<option value="__synthetic">synthetic (no mic)</option>` +
        devs.map((d) => `<option value="${d.deviceId}">${d.label || 'unnamed input'}</option>`).join('');
      sourceSelLive.innerHTML =
        `<option value="__default">system default</option>` +
        devs.map((d) => `<option value="${d.deviceId}">${d.label || 'unnamed input'}</option>`).join('');
      // Preserve selection if possible
      const stored = localStorage.getItem('ss.source');
      if (selectedId) sourceSel.value = selectedId;
      else if (stored) sourceSel.value = stored;
      return devs;
    }
    refreshDevices();
    navigator.mediaDevices?.addEventListener?.('devicechange', () => refreshDevices(sourceSel.value));

    // ---------- knob bus + panel ----------
    // Must declare knobBus before renderKnobPanel runs below — the panel
    // reads knobBus.isLocked() at render time, and `const` bindings live
    // in a temporal dead zone until the declaration is reached.
    const knobBus = createKnobBus(DEFAULT_KNOBS);
    const knobsPanel = $("knobs-panel");
    const knobEls = new Map();
    // Build grouped <option> tags once — same for every knob row.
    function buildSourceOptionsHtml() {
      const byGroup = {};
      for (const [key, s] of Object.entries(AUDIO_SOURCES)) {
        (byGroup[s.group] ||= []).push({ key, ...s });
      }
      let html = "";
      for (const g of SOURCE_GROUPS) {
        const items = byGroup[g.id];
        if (!items || items.length === 0) continue;
        if (g.id === "basic") {
          // "none" at top with no group label
          html += items
            .map((s) => `<option value="${s.key}">${s.label}</option>`)
            .join("");
        } else {
          html += `<optgroup label="${g.label}">`;
          html += items
            .map((s) => `<option value="${s.key}">${s.label}</option>`)
            .join("");
          html += `</optgroup>`;
        }
      }
      return html;
    }
    const sourceOptionsHtml = buildSourceOptionsHtml();

    function renderKnobPanel() {
      knobsPanel.innerHTML = "";
      knobEls.clear();
      for (const name of KNOB_NAMES) {
        const row = document.createElement("div");
        row.className = "knob";
        if (knobBus.isLocked(name)) row.classList.add("is-locked");
        const curSource = knobBus.getSource(name);
        const curIntensity = knobBus.getIntensity(name);
        row.innerHTML = `
          <div class="knob__header">
            <span class="knob__name">
              <button class="knob__lock" data-knob-lock aria-label="lock ${name}" title="lock ${name}">
                <span class="knob__lock-icon">${knobBus.isLocked(name) ? "●" : "○"}</span>
              </button>
              ${name}
            </span>
            <span class="knob__value" data-knob-v>0.50</span>
          </div>
          <div class="knob__track" data-knob-track role="slider"
               aria-label="${name}" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5" tabindex="0">
            <div class="knob__rail"></div>
            <span class="knob__fill" data-knob-f></span>
            <span class="knob__handle" data-knob-h></span>
            <!-- Ghost handle shows the live audio-routed value so you can
                 see how much the source is pushing the knob around its
                 baseline. Hidden when source=none or intensity=0. -->
            <span class="knob__ghost" data-knob-ghost></span>
          </div>
          <div class="knob__route">
            <select class="knob__source" data-knob-source aria-label="${name} audio source">
              ${sourceOptionsHtml}
            </select>
            <div class="knob__intensity" data-knob-intensity-track role="slider"
                 aria-label="${name} intensity" aria-valuemin="0" aria-valuemax="1"
                 aria-valuenow="${curIntensity.toFixed(2)}" tabindex="0"
                 title="how strongly '${curSource}' modulates ${name}">
              <div class="knob__intensity-rail"></div>
              <span class="knob__intensity-fill" data-knob-intensity-fill></span>
            </div>
          </div>
        `;
        knobsPanel.appendChild(row);
        const track = row.querySelector("[data-knob-track]");
        const lockBtn = row.querySelector("[data-knob-lock]");
        const lockIcon = row.querySelector(".knob__lock-icon");
        const sourceSel = row.querySelector("[data-knob-source]");
        const intensityTrack = row.querySelector("[data-knob-intensity-track]");
        const intensityFill = row.querySelector("[data-knob-intensity-fill]");
        sourceSel.value = curSource;
        intensityFill.style.width = (curIntensity * 100) + "%";
        knobEls.set(name, {
          row,
          value: row.querySelector("[data-knob-v]"),
          fill: row.querySelector("[data-knob-f]"),
          handle: row.querySelector("[data-knob-h]"),
          ghost: row.querySelector("[data-knob-ghost]"),
          track,
          lockBtn,
          lockIcon,
          sourceSel,
          intensityTrack,
          intensityFill,
        });
        lockBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const isNowLocked = knobBus.toggleLock(name);
          row.classList.toggle("is-locked", isNowLocked);
          lockIcon.textContent = isNowLocked ? "●" : "○";
          updateLockAllButton();
        });
        sourceSel.addEventListener("change", () => {
          knobBus.setSource(name, sourceSel.value);
          intensityTrack.title =
            `how strongly '${sourceSel.value}' modulates ${name}`;
        });
        wireKnobDrag(track, name);
        wireIntensityDrag(intensityTrack, intensityFill, name);
      }
      updateLockAllButton();
    }

    // Bulk lock/unlock affordance in the section header. Label reflects
    // the current state: "lock all" when everything's unlocked or mixed,
    // "unlock all" when everything's locked.
    const lockAllBtn = $("knobs-lock-all");
    function updateLockAllButton() {
      const all = KNOB_NAMES.every((n) => knobBus.isLocked(n));
      lockAllBtn.textContent = all ? "unlock all" : "lock all";
    }
    lockAllBtn.addEventListener("click", () => {
      const all = KNOB_NAMES.every((n) => knobBus.isLocked(n));
      knobBus.setAllLocked(!all);
      // Sync every row's UI
      for (const name of KNOB_NAMES) {
        const el = knobEls.get(name);
        if (!el) continue;
        const isNowLocked = knobBus.isLocked(name);
        el.row.classList.toggle("is-locked", isNowLocked);
        el.lockIcon.textContent = isNowLocked ? "●" : "○";
      }
      updateLockAllButton();
    });
    function wireKnobDrag(track, name) {
      function setFromPointer(ev) {
        const rect = track.getBoundingClientRect();
        const x = (ev.clientX - rect.left) / rect.width;
        const v = Math.max(0, Math.min(1, x));
        knobBus.setManual(name, v);
      }
      track.addEventListener("pointerdown", (e) => {
        track.setPointerCapture(e.pointerId);
        setFromPointer(e);
      });
      track.addEventListener("pointermove", (e) => {
        if (e.buttons & 1) setFromPointer(e);
      });
      track.addEventListener("keydown", (e) => {
        const step = e.shiftKey ? 0.1 : 0.04;
        const cur = knobBus.getTarget(name) || 0.5;
        let v = cur;
        if (e.key === "ArrowRight" || e.key === "ArrowUp") v = Math.min(1, cur + step);
        else if (e.key === "ArrowLeft" || e.key === "ArrowDown") v = Math.max(0, cur - step);
        else if (e.key === "Home") v = 0;
        else if (e.key === "End") v = 1;
        else return;
        e.preventDefault();
        knobBus.setManual(name, v);
      });
    }

    // Intensity mini-slider: 0..1, clicked+dragged inline. Writes straight
    // through to knobBus.setIntensity which persists to localStorage.
    function wireIntensityDrag(track, fill, name) {
      function setFromPointer(ev) {
        const rect = track.getBoundingClientRect();
        const x = (ev.clientX - rect.left) / rect.width;
        const v = Math.max(0, Math.min(1, x));
        knobBus.setIntensity(name, v);
        fill.style.width = (v * 100) + "%";
        track.setAttribute("aria-valuenow", v.toFixed(2));
      }
      track.addEventListener("pointerdown", (e) => {
        track.setPointerCapture(e.pointerId);
        setFromPointer(e);
      });
      track.addEventListener("pointermove", (e) => {
        if (e.buttons & 1) setFromPointer(e);
      });
      track.addEventListener("keydown", (e) => {
        const step = e.shiftKey ? 0.1 : 0.04;
        const cur = knobBus.getIntensity(name);
        let v = cur;
        if (e.key === "ArrowRight" || e.key === "ArrowUp") v = Math.min(1, cur + step);
        else if (e.key === "ArrowLeft" || e.key === "ArrowDown") v = Math.max(0, cur - step);
        else if (e.key === "Home") v = 0;
        else if (e.key === "End") v = 1;
        else return;
        e.preventDefault();
        knobBus.setIntensity(name, v);
        fill.style.width = (v * 100) + "%";
      });
    }
    renderKnobPanel();

    function paintKnob(name, v) {
      const el = knobEls.get(name);
      if (!el) return;
      el.value.textContent = v.toFixed(2);
      el.fill.style.width = (v * 100) + "%";
      el.handle.style.left = (v * 100) + "%";
      el.track.setAttribute("aria-valuenow", v.toFixed(2));
      // Ghost indicator: show the currently-rendered (routed) value so the
      // user can see how far the audio source is pushing this knob off the
      // baseline. Hide when routing is effectively inactive.
      const routed = window.viz?.knob?.[name];
      const intensity = knobBus.getIntensity(name);
      const source = knobBus.getSource(name);
      if (routed != null && intensity > 0.01 && source !== "none") {
        el.ghost.style.display = "block";
        el.ghost.style.left = (Math.max(0, Math.min(1, routed)) * 100) + "%";
      } else {
        el.ghost.style.display = "none";
      }
    }

    // ---------- axis bus + panel ----------
    const axisBus = createAxisBus(DEFAULT_AXES);
    const axisEls = new Map();

    function renderAxisPanel() {
      // Sidebar slider UI is currently hidden; bail out if the panel was
      // removed. The underlying axisBus and CLAP updates still run — values
      // are observable via window.viz.axis and in the debug HUD.
      if (!axesPanel) return;
      axesPanel.innerHTML = "";
      axisEls.clear();
      for (const ax of axisBus.axes) {
        const root = document.createElement("div");
        root.className = "axis";
        root.innerHTML = `
          <div class="axis__header">
            <span class="axis__name">${ax.name}<span class="axis__manual-dot" title="manual override"></span></span>
            <span class="axis__value" data-axis-v>+0.00</span>
          </div>
          <div class="axis__track" data-axis-track role="slider" aria-label="${ax.name}" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" tabindex="0">
            <div class="axis__track-rail"></div>
            <div class="axis__track-tick"></div>
            <span class="axis__fill" data-axis-f></span>
            <span class="axis__handle" data-axis-h></span>
          </div>
          <div class="axis__prompts">
            <input data-pole="positive" value="${ax.positive.replace(/"/g, "&quot;")}" aria-label="${ax.name} positive pole">
            <input data-pole="negative" value="${ax.negative.replace(/"/g, "&quot;")}" aria-label="${ax.name} negative pole">
          </div>
        `;
        axesPanel.appendChild(root);
        const track = root.querySelector("[data-axis-track]");
        axisEls.set(ax.name, {
          root,
          value: root.querySelector("[data-axis-v]"),
          fill: root.querySelector("[data-axis-f]"),
          handle: root.querySelector("[data-axis-h]"),
          track,
        });
        wireDrag(track, ax.name, root);
      }
    }

    // Pointer-driven manual override. Dragging writes through axisBus.setManual
    // which pins the value for a couple seconds before CLAP resumes. The
    // dot + handle color flip signals "manual override active".
    function wireDrag(track, name, root) {
      let hold = null;
      function setFromPointer(ev) {
        const rect = track.getBoundingClientRect();
        const x = (ev.clientX - rect.left) / rect.width;
        const v = Math.max(-1, Math.min(1, (x - 0.5) * 2));
        axisBus.setManual(name, v);
        track.setAttribute("aria-valuenow", v.toFixed(2));
        track.classList.add("is-manual");
        root.classList.add("is-manual");
        if (hold) clearTimeout(hold);
        hold = setTimeout(() => {
          track.classList.remove("is-manual");
          root.classList.remove("is-manual");
        }, 2800);
      }
      track.addEventListener("pointerdown", (e) => {
        track.setPointerCapture(e.pointerId);
        setFromPointer(e);
      });
      track.addEventListener("pointermove", (e) => {
        if (e.buttons & 1) setFromPointer(e);
      });
      // Keyboard: arrow keys nudge by 0.1, shift for 0.25.
      track.addEventListener("keydown", (e) => {
        const step = e.shiftKey ? 0.25 : 0.1;
        const cur = parseFloat(track.getAttribute("aria-valuenow")) || 0;
        let v = cur;
        if (e.key === "ArrowRight" || e.key === "ArrowUp") v = Math.min(1, cur + step);
        else if (e.key === "ArrowLeft" || e.key === "ArrowDown") v = Math.max(-1, cur - step);
        else if (e.key === "Home") v = -1;
        else if (e.key === "End") v = 1;
        else if (e.key === "0" || e.key === " ") v = 0;
        else return;
        e.preventDefault();
        axisBus.setManual(name, v);
        track.setAttribute("aria-valuenow", v.toFixed(2));
        track.classList.add("is-manual");
        root.classList.add("is-manual");
        if (hold) clearTimeout(hold);
        hold = setTimeout(() => {
          track.classList.remove("is-manual");
          root.classList.remove("is-manual");
        }, 2800);
      });
    }
    renderAxisPanel();

    function paintAxis(name, v) {
      const el = axisEls.get(name);
      if (!el) return;
      el.value.textContent = (v >= 0 ? "+" : "") + v.toFixed(2);
      // Fill goes from center (50%) outward. Positive → right, negative → left.
      const half = Math.abs(v) * 50;
      if (v >= 0) {
        el.fill.style.left = "50%";
        el.fill.style.width = half + "%";
      } else {
        el.fill.style.left = (50 - half) + "%";
        el.fill.style.width = half + "%";
      }
      el.handle.style.left = (50 + v * 50) + "%";
    }

    // ---------- UI wiring ----------
    function openSidebar(open) {
      sidebar.classList.toggle("open", open);
      sidebarToggle.classList.toggle("sidebar-is-open", open);
      sidebarCaret.textContent = open ? "›" : "‹";
    }
    sidebarToggle.addEventListener("click", () => openSidebar(!sidebar.classList.contains("open")));

    let hudOn = false;
    function toggleHud() {
      hudOn = !hudOn;
      hud.classList.toggle("show", hudOn);
    }
    hudToggle.addEventListener("click", toggleHud);
    document.addEventListener("keydown", (e) => {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      if (e.key === "d" || e.key === "D") toggleHud();
      if (e.key === "c" || e.key === "C") openSidebar(!sidebar.classList.contains("open"));
    });

    fsToggle.addEventListener("click", () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    function setStatus(text, ok = true) {
      statusText.textContent = text;
      statusDot.classList.toggle("status-bar__indicator--error", !ok);
      statusBar.classList.add("active");
    }

    // Preset buttons = named knob target sets. Smooth glide, no teardown.
    // Built-in presets live in KNOB_PRESETS; user presets persist to
    // localStorage and are rendered alongside.
    const USER_PRESETS_KEY = "ss.userPresets.v1";
    function loadUserPresets() {
      try {
        const raw = localStorage.getItem(USER_PRESETS_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function saveUserPresets(p) {
      try { localStorage.setItem(USER_PRESETS_KEY, JSON.stringify(p)); } catch (e) {}
    }
    let userPresets = loadUserPresets();

    const presetButtonsEl = document.getElementById("preset-buttons");
    function renderPresetButtons() {
      presetButtonsEl.innerHTML = "";
      // Built-ins first
      for (const name of Object.keys(KNOB_PRESETS)) {
        const b = document.createElement("button");
        b.className = "btn btn--sm";
        b.dataset.preset = name;
        b.textContent = name.charAt(0).toUpperCase() + name.slice(1);
        if (name === currentPreset) b.classList.add("btn--filled");
        presetButtonsEl.appendChild(b);
      }
      // User presets with a delete affordance on long-press / right-click
      for (const name of Object.keys(userPresets)) {
        const b = document.createElement("button");
        b.className = "btn btn--sm";
        b.dataset.preset = name;
        b.dataset.userPreset = "1";
        b.textContent = name;
        b.title = "click to apply · shift-click to delete";
        if (name === currentPreset) b.classList.add("btn--filled");
        presetButtonsEl.appendChild(b);
      }
    }

    let currentPreset = localStorage.getItem("ss.preset") || "drift";
    function applyKnobPreset(name) {
      const targets = KNOB_PRESETS[name] || userPresets[name];
      if (!targets) return;
      currentPreset = name;
      localStorage.setItem("ss.preset", name);
      knobBus.setTargets(targets);
      renderPresetButtons();
    }
    presetButtonsEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-preset]");
      if (!btn) return;
      const name = btn.dataset.preset;
      if (e.shiftKey && btn.dataset.userPreset === "1") {
        // delete
        if (confirm(`delete preset "${name}"?`)) {
          delete userPresets[name];
          saveUserPresets(userPresets);
          if (currentPreset === name) currentPreset = "drift";
          renderPresetButtons();
        }
        return;
      }
      applyKnobPreset(name);
    });
    renderPresetButtons();

    // Save current knob baselines as a named user preset.
    document.getElementById("save-preset").addEventListener("click", () => {
      const suggested = `custom-${Object.keys(userPresets).length + 1}`;
      const name = prompt("name this preset:", suggested);
      if (!name) return;
      const snap = {};
      for (const k of KNOB_NAMES) snap[k] = knobBus.getBaseline(k);
      userPresets[name] = snap;
      saveUserPresets(userPresets);
      currentPreset = name;
      localStorage.setItem("ss.preset", name);
      renderPresetButtons();
    });

    // Transition mode dropdown
    const transitionSel = $("transition-sel");
    transitionSel.innerHTML = Object.entries(TRANSITION_MODES)
      .map(
        ([key, m]) =>
          `<option value="${key}">${m.label}${m.approxMs ? ` · ~${m.approxMs}ms` : " · instant"}</option>`,
      )
      .join("");
    const storedTrans = localStorage.getItem("ss.transition") || DEFAULT_TRANSITION;
    transitionSel.value = storedTrans;
    knobBus.setTransition(storedTrans);
    transitionSel.addEventListener("change", () => {
      knobBus.setTransition(transitionSel.value);
      localStorage.setItem("ss.transition", transitionSel.value);
    });

    let hydraInstance = null;
    function initHydra() {
      const canvas = $("hydra-canvas");
      // Size the canvas to the viewport, tell Hydra to resize its internal
      // framebuffers, and reinstall the engine chain (Hydra drops the
      // chain when resolution changes — buffer size changes are destructive).
      function sizeCanvas() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        if (hydraInstance) {
          try {
            // Hydra exposes setResolution for buffer resize. We pass the
            // CSS pixel size; pixelDensity is baked in.
            if (typeof hydraInstance.setResolution === "function") {
              hydraInstance.setResolution(w, h);
            } else if (hydraInstance.synth && hydraInstance.synth.setResolution) {
              hydraInstance.synth.setResolution(w, h);
            }
            // Reinstall the chain so the new resolution takes effect.
            if (typeof window.loadEngine === "function") window.loadEngine();
          } catch (e) {
            console.warn("[resize] hydra resize failed:", e);
          }
        }
      }
      sizeCanvas();
      window.addEventListener("resize", sizeCanvas);
      // fullscreenchange doesn't always trigger resize on every browser —
      // wire it explicitly so entering/leaving fullscreen updates the canvas.
      document.addEventListener("fullscreenchange", sizeCanvas);
      document.addEventListener("webkitfullscreenchange", sizeCanvas);

      // pixelDensity 0.6 renders the Hydra chain at ~36% of the native
      // pixel count, then CSS upscales. ~2.8× GPU speedup; invisible for
      // the abstract visuals we're producing. Bump to 1.0 if sharpness
      // matters on a specific machine.
      hydraInstance = new Hydra({
        canvas,
        detectAudio: false,
        enableStreamCapture: false,
        pixelDensity: 0.6,
      });
      // One engine, loaded once. All visual change happens through knobs.
      window.loadEngine();
      applyKnobPreset(currentPreset);
    }

    // ---------- runtime refs (set once started) ----------
    let audioHandle = null;  // returned by startAudio
    let clapHandle = null;   // returned by startClap

    // ---------- start handler ----------
    startBtn.addEventListener("click", async () => {
      errEl.textContent = "";
      progEl.textContent = "";
      startBtn.disabled = true;
      startBtn.textContent = "starting…";
      try {
        initHydra();
        const sel = sourceSel.value;
        const loopback = sel === "__synthetic";
        const deviceId = (sel === "__default" || loopback) ? null : sel;
        if (!loopback) localStorage.setItem("ss.source", sel);

        audioHandle = await startAudio({
          loopback, deviceId,
          onStatus: (s) => setStatus(s),
        });
        // refresh labels now that permission was granted
        if (!loopback) {
          await refreshDevices(sel === "__default" ? "__default" : sel);
          sourceSelLive.value = sel === "__default" ? "__default" : sel;
          sourceInfo.textContent = `sr ${audioHandle.ctx.sampleRate} Hz`;
        } else {
          sourceSelLive.innerHTML = `<option>synthetic</option>`;
          sourceSelLive.disabled = true;
          sourceInfo.textContent = `synthetic · ${audioHandle.ctx.sampleRate} Hz`;
        }

        startEl.style.display = "none";

        if (clapChk.checked) {
          setStatus("loading CLAP…");
          progEl.textContent = "";
          clapHandle = await startClap({
            ctx: audioHandle.ctx,
            source: audioHandle.getSource(),
            axes: axisBus.axes,
            onAxis: (name, v) => axisBus.onAxis(name, v),
            onStatus: (s) => setStatus(s),
            onProgress: (p) => {
              if (p && p.status === "progress" && p.progress != null) {
                const pct = Math.round(p.progress);
                const name = (p.file || "").split("/").pop() || "";
                progEl.textContent = `${name} ${pct}%`;
              } else if (p && p.status === "done") {
                progEl.textContent = "";
              }
            },
          }).catch((e) => {
            console.warn("[clap] disabled:", e);
            setStatus("CLAP disabled — fast path only", false);
            return null;
          });
        }
      } catch (e) {
        console.error(e);
        errEl.textContent = (e && e.message) || String(e);
        startBtn.disabled = false;
        startBtn.textContent = "retry";
      }
    });

    // ---------- Stage 3: prompt compiler UI ----------
    const promptText = $("prompt-text");
    const promptDrop = $("prompt-drop");
    const promptDropHint = $("prompt-drop-hint");
    const promptFile = $("prompt-file");
    const promptThumbs = $("prompt-thumbs");
    const promptStatus = $("prompt-status");
    const compileBtn = $("compile-btn");
    const refineBtn = $("refine-btn");

    let pendingImages = [];  // [{name, media_type, size, data}]

    function renderThumbs() {
      promptThumbs.innerHTML = "";
      pendingImages.forEach((img, i) => {
        const div = document.createElement("div");
        div.className = "prompt__thumb";
        div.innerHTML =
          `<img src="data:${img.media_type};base64,${img.data}" alt="${img.name}">` +
          `<button class="prompt__thumb-x" data-i="${i}" aria-label="remove">×</button>`;
        promptThumbs.appendChild(div);
      });
      promptDropHint.style.display = pendingImages.length ? "none" : "block";
    }
    promptThumbs.addEventListener("click", (e) => {
      const i = e.target?.dataset?.i;
      if (i != null) {
        pendingImages.splice(Number(i), 1);
        renderThumbs();
      }
    });

    async function addFiles(files) {
      for (const f of files) {
        if (!f.type.startsWith("image/")) continue;
        if (pendingImages.length >= 5) break;
        try {
          pendingImages.push(await fileToImage(f));
        } catch (e) {
          console.warn("[prompt] skip", f.name, e);
        }
      }
      renderThumbs();
    }
    promptDrop.addEventListener("click", (e) => {
      if (e.target === promptFile) return;
      promptFile.click();
    });
    promptFile.addEventListener("change", (e) => {
      addFiles(e.target.files || []);
      e.target.value = "";
    });
    ["dragenter", "dragover"].forEach((ev) =>
      promptDrop.addEventListener(ev, (e) => {
        e.preventDefault();
        promptDrop.classList.add("is-dragging");
      }),
    );
    ["dragleave", "drop"].forEach((ev) =>
      promptDrop.addEventListener(ev, (e) => {
        e.preventDefault();
        promptDrop.classList.remove("is-dragging");
      }),
    );
    promptDrop.addEventListener("drop", (e) => {
      addFiles(e.dataTransfer?.files || []);
    });

    function applyConfig(config, meta = {}) {
      // Swap axes — CLAP's ensureTextEmbeddings() will invalidate its cache
      // on name/prompt change automatically.
      const nextAxes = config.axes.map((a) => ({
        name: a.name,
        positive: a.positive,
        negative: a.negative,
      }));
      axisBus.setAxes(nextAxes);
      if (clapHandle?.setAxes) clapHandle.setAxes(axisBus.axes);
      renderAxisPanel();

      // Palette plumbs through to presets via viz.paletteRGB
      if (Array.isArray(config.palette)) setPalette(config.palette);

      // Knobs: push the LLM's primitive values as new targets. The bus
      // eases each one toward its target at the currently selected
      // transition rate — smooth glide, no cuts. Manual-override holds
      // are respected so user drags don't get stomped.
      if (config.knobs) {
        knobBus.setTargets(config.knobs);
        document.querySelectorAll("#preset-buttons [data-preset]").forEach((b) => {
          b.classList.remove("btn--filled");
        });
      }
      // Routing: Claude can also specify which audio source drives each
      // knob and how strongly. Apply any that arrived, leaving others
      // at whatever the user/default set.
      if (config.routing && typeof config.routing === "object") {
        for (const [name, r] of Object.entries(config.routing)) {
          if (!r || typeof r !== "object") continue;
          if (typeof r.source === "string") knobBus.setSource(name, r.source);
          if (typeof r.intensity === "number") knobBus.setIntensity(name, r.intensity);
          // Reflect in the UI row if it's rendered
          const el = knobEls.get(name);
          if (el) {
            if (typeof r.source === "string") el.sourceSel.value = r.source;
            if (typeof r.intensity === "number") {
              el.intensityFill.style.width = (Math.max(0, Math.min(1, r.intensity)) * 100) + "%";
            }
          }
        }
      }

      promptStatus.textContent =
        `axes: ${config.axes.map((a) => a.name).join(", ")} · ` +
        `palette: ${(config.palette || []).length} colors · ` +
        `${meta._cacheHit ? "cached" : meta.model || "live"}`;
    }

    async function runCompile({ nonce = null } = {}) {
      const text = promptText.value.trim();
      if (!text && pendingImages.length === 0) {
        promptStatus.textContent = "type a prompt or drop an image";
        return;
      }
      compileBtn.disabled = true;
      refineBtn.disabled = true;
      promptStatus.textContent = "compiling…";
      try {
        const result = await compilePrompt({
          text,
          images: pendingImages,
          nonce,
        });
        applyConfig(result.config, result);
      } catch (e) {
        console.error("[compile]", e);
        promptStatus.textContent = "error: " + (e.message || String(e));
      } finally {
        compileBtn.disabled = false;
        refineBtn.disabled = false;
      }
    }
    compileBtn.addEventListener("click", () => runCompile());
    refineBtn.addEventListener("click", () =>
      runCompile({ nonce: String(Math.random()).slice(2, 10) }),
    );

    // Auto-compile (Stage 4 seed): every 45s re-run compile with a fresh
    // nonce so Claude produces stochastic variation on the same prompt.
    // Knobs glide to the new targets. Respects locks (knobs won't drift
    // unless user unlocks them). Toggleable.
    const AUTO_COMPILE_MS = 45000;
    let autoTimer = null;
    const autoChk = $("auto-compile-chk");
    function startAutoCompile() {
      stopAutoCompile();
      autoTimer = setInterval(() => {
        if (!promptText.value.trim() && pendingImages.length === 0) return;
        runCompile({ nonce: String(Math.random()).slice(2, 10) });
      }, AUTO_COMPILE_MS);
    }
    function stopAutoCompile() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    }
    autoChk.addEventListener("change", () => {
      if (autoChk.checked) {
        localStorage.setItem("ss.autoCompile", "1");
        startAutoCompile();
      } else {
        localStorage.removeItem("ss.autoCompile");
        stopAutoCompile();
      }
    });
    if (localStorage.getItem("ss.autoCompile") === "1") {
      autoChk.checked = true;
      startAutoCompile();
    }

    // ---------- Live device switch from the sidebar dropdown. ----------
    sourceSelLive.addEventListener("change", async () => {
      if (!audioHandle || !audioHandle.switchDevice) return;
      const next = sourceSelLive.value;
      localStorage.setItem("ss.source", next);
      try {
        setStatus("switching source…");
        const newSource = await audioHandle.switchDevice(next);
        if (clapHandle && clapHandle.rewireSource) clapHandle.rewireSource(newSource);
        sourceInfo.textContent = `sr ${audioHandle.ctx.sampleRate} Hz`;
      } catch (e) {
        console.error("[source] switch failed:", e);
        setStatus("switch failed: " + (e.message || e), false);
      }
    });

    // ---------- Debug HUD render loop ----------
    function bar(v) {
      const pct = Math.max(0, Math.min(1, v)) * 100;
      return `<span class="hud__bar"><span style="width:${pct.toFixed(0)}%"></span></span>`;
    }
    function sbar(v) {
      const pct = Math.max(-1, Math.min(1, v));
      const half = Math.abs(pct) * 50;
      const left = pct >= 0 ? 50 : (50 - half);
      return `<span class="hud__bar hud__bar--signed"><span style="width:${half}%;margin-left:${left}%;background:#fff"></span></span>`;
    }
    function fmt(n, d = 3) {
      return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
    }
    let frames = 0, fpsLast = performance.now(), fps = 0;

    function updateHud() {
      frames++;
      const now = performance.now();
      if (now - fpsLast > 500) {
        fps = (frames * 1000) / (now - fpsLast);
        frames = 0; fpsLast = now;
      }
      if (hudOn) {
        const v = window.viz;
        const axes = v.axis || {};
        let axRows = "";
        for (const [name, val] of Object.entries(axes)) {
          axRows += `<div class="hud__row"><span class="hud__k">${name}</span><span class="hud__v">${(val >= 0 ? "+" : "") + fmt(val, 2)}</span>${sbar(val)}</div>`;
        }
        const clap = (window.clapDiag && window.clapDiag()) || null;
        let clapRows = "";
        if (clap) {
          const secIn = (clap.samplesSeen / 48000);  // approximate
          clapRows =
            `<hr class="hud__hr">` +
            `<div class="hud__row"><span class="hud__k">clap · infers</span><span class="hud__v">${clap.inferenceCount}</span></div>` +
            `<div class="hud__row"><span class="hud__k">clap · last</span><span class="hud__v">${Math.round(clap.lastInferenceMs || 0)}ms</span></div>` +
            `<div class="hud__row"><span class="hud__k">clap · ring rms</span><span class="hud__v">${(clap.ringRms || 0).toFixed(4)}</span></div>` +
            `<div class="hud__row"><span class="hud__k">clap · samples in</span><span class="hud__v">${secIn.toFixed(1)}s</span></div>`;
        }
        hud.innerHTML =
          `<div class="hud__row"><span class="hud__k">energy</span><span class="hud__v">${fmt(v.energy)}</span>${bar(v.energy)}</div>` +
          `<div class="hud__row"><span class="hud__k">transient</span><span class="hud__v">${fmt(v.transient)}</span>${bar(v.transient)}</div>` +
          `<div class="hud__row"><span class="hud__k">low</span><span class="hud__v">${fmt(v.low ?? 0)}</span>${bar(v.low ?? 0)}</div>` +
          `<div class="hud__row"><span class="hud__k">mid</span><span class="hud__v">${fmt(v.mid ?? 0)}</span>${bar(v.mid ?? 0)}</div>` +
          `<div class="hud__row"><span class="hud__k">high</span><span class="hud__v">${fmt(v.high ?? 0)}</span>${bar(v.high ?? 0)}</div>` +
          `<div class="hud__row"><span class="hud__k">beat_phase</span><span class="hud__v">${fmt(v.beat_phase)}</span>${bar(v.beat_phase)}</div>` +
          `<div class="hud__row"><span class="hud__k">brightness</span><span class="hud__v">${fmt(v.brightness)}</span>${bar(v.brightness)}</div>` +
          `<div class="hud__row"><span class="hud__k">bpm</span><span class="hud__v">${fmt(v.bpm, 1)}</span></div>` +
          (axRows ? `<hr class="hud__hr">${axRows}` : "") +
          clapRows +
          `<hr class="hud__hr"><div class="hud__row"><span class="hud__k">fps</span><span class="hud__v">${fmt(fps, 1)}</span></div>`;
      }
      // Tick knob bus — every frame eases baseline toward target and
      // applies audio-source routing. window.viz.knob holds the final
      // routed values the engine actually reads.
      knobBus.tick();
      // Repaint sidebar meters: axes use their smoothed values. Knob
      // sliders show BASELINE (the user/LLM set-point) so the handle
      // doesn't jiggle with music routing — routing moves the visual,
      // not the UI.
      for (const [name, v] of Object.entries(window.viz.axis || {})) paintAxis(name, v);
      for (const name of Object.keys(window.viz.knob || {})) paintKnob(name, knobBus.getBaseline(name));
      requestAnimationFrame(updateHud);
    }
    requestAnimationFrame(updateHud);
  </script>
</body>
</html>
