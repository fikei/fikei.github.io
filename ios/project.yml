name: CtrlRodeo
options:
  bundleIdPrefix: com.ctrlrodeo
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "RJ8FB5M6HX"

targets:
  CtrlRodeo:
    type: application
    platform: iOS
    sources:
      - path: CtrlRodeo
      - path: Shared
    info:
      path: CtrlRodeo/Info.plist
      properties:
        CFBundleDisplayName: Boards
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.ctrlrodeo.boards
            CFBundleURLSchemes:
              - ctrlrodeo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: CtrlRodeo/CtrlRodeo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ctrlrodeo.boards
        com.apple.developer.associated-domains:
          - applinks:ctrl.rodeo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctrlrodeo.boards
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Boards
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ctrlrodeo.boards
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctrlrodeo.boards.share
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
